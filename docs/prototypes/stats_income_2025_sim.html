<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats 2025 Income Simulation</title>
  <style>
    :root {
      --phone-w: 412px;
      --fastinfo-h: 328px;
      --header-h: 188px;
      --surface-h: 516px;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --primary: #06b6d4;
      --income: #22c55e;
      --expense: #ef4444;
      --orange: #fbbf24;
      --chip: #fbbf24;
      --fastfood: #22c55e;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #dbe3ec;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--gray-800);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .phone {
      width: var(--phone-w);
      min-height: 100vh;
      background: var(--gray-100);
      overflow: hidden;
      position: relative;
    }

    .surface {
      width: 100%;
      height: var(--surface-h);
      position: relative;
      background: var(--gray-100);
      border-radius: 0 0 24px 24px;
      box-shadow: 0 4px 8px rgb(0 0 0 / 15%);

    }

    #fastInfoCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--phone-w);
      height: var(--fastinfo-h);
    }

    .header {

    .app-title {

    .header-label {

    .header-value {

    .category-button {

      display: block;

    .joystick {

    #scoreDesignCanvas {

    }

    #incomeLowerOptionsCanvas {

    }

    #magnetScaleCanvas {
      display: block;
      width: var(--phone-w);
      height: 700px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .control-title {
      color: var(--gray-800);

    input[type="range"] {
      width: 100%;

    .amount-pill {
      margin-top: 10px;
      height: 50px;
      border-radius: 25px;

      border: 1px solid var(--gray-200);
      box-shadow: 0 2px 4px rgb(0 0 0 / 8%);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #thresholdInput {
      width: 120px;
      border: 0;
      outline: 0;
      color: var(--gray-800);
      background: transparent;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      font-family: inherit;
    }

    .suffix {
      color: var(--gray-500);
      font-size: 14px;
      font-weight: 700;
    }

    .runtime-error {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 20;
      max-width: calc(var(--phone-w) - 24px);
      margin: 0 auto;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #fecaca;
      color: #991b1b;
      box-shadow: 0 8px 24px rgb(0 0 0 / 16%);
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .runtime-error.visible {
      display: block;
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="surface" aria-label="FastInfo and header card">
      <canvas id="fastInfoCanvas" width="412" height="328"></canvas>
      <header class="header">
        <div class="app-title">ExpenseTracker</div>
        <canvas id="magnetCanvas" width="412" height="158"></canvas>
        <div class="scope-chip">1</div>
        <div class="header-label">INCOME SCORE</div>
        <div class="header-value" id="headerValue">0/100</div>
        <button class="category-button" type="button" aria-label="category scope">
          <div><span></span><span></span><span></span></div>
        </button>
      </header>
    </section>

    <section class="calendar-wrap" aria-label="2025 month cards">
      <canvas id="monthCanvas" width="372" height="1275"></canvas>
      <button class="joystick" id="joystick" type="button" aria-label="threshold joystick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M4 7h10"></path><path d="M18 7h2"></path><path d="M16 5v4"></path>
          <path d="M4 12h3"></path><path d="M11 12h9"></path><path d="M9 10v4"></path>
          <path d="M4 17h12"></path><path d="M20 17h0"></path><path d="M18 15v4"></path>
        </svg>
      </button>
    </section>

    <section class="controls" aria-label="threshold controls">
      <div class="control-row">
        <div class="control-title">Tranzakció küszöb</div>
      <div id="thresholdValue">300 000 Ft</div>
      </div>
      <input id="thresholdSlider" type="range" min="0" max="600000" step="10000" value="300000">
      <label class="amount-pill">
        <input id="thresholdInput" inputmode="numeric" value="300000">
        <span class="suffix">Ft</span>
      </label>
    </section>

    <section class="design-lab" aria-label="score design alternatives">
      <div class="design-lab-title">1. függvény design alternatívák</div>
      <canvas id="scoreDesignCanvas" width="412" height="930"></canvas>
    </section>

    <section class="design-lab" aria-label="income score comparison">
      <div class="design-lab-title">Bevételi score összehasonlítás</div>
      <canvas id="incomeCompareCanvas" width="412" height="1010"></canvas>
    </section>

    <section class="design-lab" aria-label="income lower chart alternatives">
      <div class="design-lab-title">Alsó chart alternatívák</div>
      <canvas id="incomeLowerOptionsCanvas" width="412" height="760"></canvas>
    </section>

    <section class="design-lab" aria-label="magnet scale alternatives">
      <div class="design-lab-title">Mágnescsík színskála alternatívák</div>
      <canvas id="magnetScaleCanvas" width="412" height="700"></canvas>
    </section>
  </main>
  <div class="runtime-error" id="runtimeError"></div>

  <script>
    const W = 412;
    const FASTINFO_H = 328;
    const HEADER_H = 188;
    const MONTH_CANVAS_W = 372;
    const MONTH_CANVAS_H = 1275;

    const colors = {
      gray100: '#f1f5f9',
      gray200: '#e2e8f0',
      gray300: '#cbd5e1',
      gray500: '#64748b',
      gray600: '#475569',
      gray700: '#334155',
      gray800: '#1e293b',
      white: '#ffffff',
      primary: '#06b6d4',
      expense: '#ef4444',
      income: '#22c55e',
      orange: '#fbbf24',
      teal: '#0ea5a4',
      fastfood: '#6b7280',
    };

    const monthNames = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];
    const monthLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const weekdays = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

    class JavaRandom {
      constructor(seed) {
        this.seed = (BigInt(seed) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
      }
      next(bits) {
        this.seed = (this.seed * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
        return Number(this.seed >> (48n - BigInt(bits)));
      }
      nextInt(bound) {
        if (bound <= 0) throw new Error('bound must be positive');
        if ((bound & -bound) === bound) {
          return Math.floor((bound * this.next(31)) / 2147483648);
        }
        let bits;
        let val;
        do {
          bits = this.next(31);
          val = bits % bound;
        } while (bits - val + (bound - 1) < 0);
        return val;
      }
      nextBoolean() {
        return this.next(1) !== 0;
      }
    }

    function roundedAmount(random, minAmount, maxAmount) {
      const raw = minAmount + random.nextInt(maxAmount - minAmount + 1);
      return Math.floor((raw + 5) / 10) * 10;
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    const incomePlans = [
      { month: 1, type: 'single', total: 242600, days: [5], merchant: 'Munkaber' },
      { month: 2, type: 'double', total: 562800, days: [5, 20], merchant: 'Projekt reszlet' },
      { month: 3, type: 'micro', total: 286700, count: 20, merchant: 'Mikrobevetel' },
      { month: 4, type: 'weekly', total: 436200, days: [4, 11, 18, 25], merchant: 'Heti fizetes' },
      { month: 5, type: 'single', total: 309600, days: [5], merchant: 'Munkaber' },
      { month: 6, type: 'double', total: 592700, days: [6, 21], merchant: 'Projekt reszlet' },
      { month: 7, type: 'micro', total: 421900, count: 24, merchant: 'Mikrobevetel' },
      { month: 8, type: 'weekly', total: 394700, days: [1, 8, 15, 22], merchant: 'Heti fizetes' },
      { month: 9, type: 'single', total: 142300, days: [5], merchant: 'Munkaber' },
      { month: 10, type: 'double', total: 521500, days: [4, 19], merchant: 'Projekt reszlet' },
      { month: 11, type: 'micro', total: 638500, count: 18, merchant: 'Mikrobevetel' },
      { month: 12, type: 'weekly', total: 478900, days: [2, 9, 16, 23], merchant: 'Heti fizetes' },
    ];

    function buildTransactions() {
      const rows = [];
      for (const plan of incomePlans) {
        const year = 2025;
        const month = plan.month;
        const idBase = ((year % 100) * 100000) + (month * 1000);
        const days = plan.days || microIncomeDays(plan.count);
        const amounts = splitIncome(plan.total, days.length, plan.type, month);
        for (let index = 0; index < days.length; index += 1) {
          const day = days[index];
          const amount = amounts[index];
          rows.push({
            id: idBase + 700 + index,
            year, month, day,
            date: `${year}.${pad2(month)}.${pad2(day)}`,
            time: incomeTime(plan.type, index),
            merchant: plan.merchant,
            amount,
            categoryId: incomeCategoryId(plan.type),
            incomeScope: true,
            incomeType: plan.type,
          });
        }
      }
      return rows;
    }

    function microIncomeDays(count) {
      const days = [];
      for (let index = 0; index < count; index += 1) {
        days.push(1 + ((index * 5) % 28));
      }
      return days.sort((a, b) => a - b);
    }

    function splitIncome(total, count, type, month) {
      if (count <= 1) return [total];
      const weights = [];
      if (type === 'double' && count === 2) {
        weights.push(0.68, 0.32);
      } else if (type === 'weekly' && count === 4) {
        weights.push(0.38, 0.27, 0.20, 0.15);
      } else if (type === 'micro') {
        for (let index = 0; index < count; index += 1) {
          const rank = (index * 7) % count;
          const wobble = 1 + ((((index * 11) % 9) - 4) * 0.012);
          weights.push(Math.pow(1.42, rank) * wobble);
        }
      } else {
        for (let index = 0; index < count; index += 1) {
          const wave = Math.sin((index + 1) * 1.73) * 0.62;
          const zigzag = (((index * 37) % 11) - 5) * 0.035;
          const drift = index / count * 0.42;
          const pulse = index % 5 === 0 ? 0.29 : index % 3 === 0 ? -0.21 : 0;
          weights.push(Math.max(0.08, 1 + wave + zigzag + drift + pulse));
        }
      }
      const weightTotal = weights.reduce((sum, value) => sum + value, 0);
      const amounts = [];
      let used = 0;
      for (let index = 0; index < count; index += 1) {
        const raw = Math.max(1, Math.floor(total * weights[index] / weightTotal));
        amounts.push(raw);
        used += raw;
      }
      amounts[amounts.length - 1] += total - used;
      return amounts;
    }

    function incomeTime(type, index) {
      if (type === 'single') return '08:30';
      if (type === 'double') return index === 0 ? '09:10' : '16:40';
      if (type === 'weekly') return '10:15';
      return index % 2 === 0 ? '11:20' : '17:35';
    }

    function incomeCategoryId(type) {
      if (type === 'single') return 1;
      if (type === 'double') return 2;
      if (type === 'weekly') return 3;
      return 4;
    }

    const transactions = buildTransactions();
    const incomeRows = transactions.filter((row) => row.year === 2025 && row.incomeScope);
    const yearBase = buildYearBase();
    const canvases = {};
    let pendingThreshold = 300000;
    let pendingFrame = 0;

    function formatHuf(amount) {
      const rounded = String(Math.round(Math.abs(amount)));
      let out = '';
      for (let i = 0; i < rounded.length; i += 1) {
        const fromEnd = rounded.length - i;
        out += rounded[i];
        if (fromEnd > 1 && fromEnd % 3 === 1) out += ' ';
      }
      return `${out} Ft`;
    }

    function formatCompactHuf(amount) {
      const value = Math.abs(amount);
      if (value >= 1000000) return `${(value / 1000000).toFixed(value >= 10000000 ? 0 : 1)}M Ft`;
      if (value >= 1000) return `${Math.round(value / 1000)}k Ft`;
      return `${Math.round(value)} Ft`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function average(values) {
      if (!values.length) return 0;
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function ema(values, window) {
      if (!values.length) return [];
      const safeWindow = Math.max(1, window);
      const multiplier = 2 / (safeWindow + 1);
      const output = [values[0]];
      for (let i = 1; i < values.length; i += 1) {
        output.push((values[i] - output[output.length - 1]) * multiplier + output[output.length - 1]);
      }
      return output;
    }

    function dynamicEmaPeriod(focusScopeDays) {
      return clamp(Math.round(22 - 0.45 * focusScopeDays), 7, 18);
    }

    function scoreFromPressure(values) {
      if (!values.length) return 100;
      if (values.length === 1) return clamp(100 - values[0], 0, 100);
      const split = Math.max(1, Math.floor(values.length / 2));
      const prior = average(values.slice(0, split));
      const recent = average(values.slice(split));
      const worseningPenalty = Math.max(0, recent - prior) * 0.5;
      return clamp(100 - recent - worseningPenalty, 0, 100);
    }

    function leadingBlankDays(year, month) {
      return (new Date(year, month - 1, 1).getDay() + 6) % 7;
    }

    function buildYearBase() {
      const months = [];
      let summaryTotal = 0;
      for (let month = 1; month <= 12; month += 1) {
        const dim = daysInMonth(2025, month);
        const days = [];
        for (let day = 1; day <= dim; day += 1) {
          days.push({
            day,
            activeAmount: 0,
            scopeAmount: 0,
            transactionCount: 0,
            dominantCategoryId: null,
          });
        }
        months.push({
          year: 2025,
          month,
          name: monthNames[month - 1],
          weekdayLabels: weekdays,
          leadingBlankDays: leadingBlankDays(2025, month),
          days,
          activeTotal: 0,
          scopeTotal: 0,
          transactionCount: 0,
        });
      }

      for (const row of transactions) {
        if (row.year !== 2025 || row.amount <= 0) continue;
        const month = months[row.month - 1];
        const day = month.days[row.day - 1];
        const amount = Math.abs(row.amount);
        day.activeAmount += amount;
        day.transactionCount += 1;
        month.activeTotal += amount;
        month.transactionCount += 1;
        if (row.incomeScope) {
          day.scopeAmount += amount;
          day.dominantCategoryId = row.categoryId;
          month.scopeTotal += amount;
        }
      }

      for (const month of months) {
        summaryTotal += month.activeTotal;
      }

      return { months, summaryTotal };
    }

    function buildYearData(threshold) {
      const months = [];
      for (const sourceMonth of yearBase.months) {
        let thresholdHitDays = 0;
        let thresholdScopeTotal = 0;
        const days = sourceMonth.days.map((sourceDay) => {
          const hasIncome = sourceDay.scopeAmount > 0;
          const meetsThreshold =
            hasIncome && (threshold <= 0 || sourceDay.scopeAmount >= threshold);
          if (meetsThreshold) {
            thresholdHitDays += 1;
            thresholdScopeTotal += sourceDay.scopeAmount;
          }
          return {
            day: sourceDay.day,
            activeAmount: sourceDay.activeAmount,
            scopeAmount: sourceDay.scopeAmount,
            meetsThreshold,
            monthMeetsTarget: false,
            dominantCategoryId: sourceDay.dominantCategoryId,
          };
        });
        const monthMeetsTarget = thresholdHitDays > 0;
        for (const day of days) day.monthMeetsTarget = monthMeetsTarget;
        months.push({
          year: 2025,
          month: sourceMonth.month,
          name: sourceMonth.name,
          weekdayLabels: weekdays,
          leadingBlankDays: sourceMonth.leadingBlankDays,
          days,
          activeTotal: sourceMonth.activeTotal,
          scopeTotal: sourceMonth.scopeTotal,
          thresholdScopeTotal,
          monthMeetsTarget,
          thresholdHitDays,
          transactionCount: sourceMonth.transactionCount,
        });
      }
      const totalThresholdHitDays = months.reduce((sum, month) => sum + month.thresholdHitDays, 0);
      const totalThresholdAmount = months.reduce((sum, month) => {
        return sum + month.days.reduce((daySum, day) => daySum + (day.meetsThreshold ? day.scopeAmount : 0), 0);
      }, 0);
      return {
        year: 2025,
        threshold,
        months,
        graphMonths: months,
        monthLabels,
        summaryTotal: yearBase.summaryTotal,
        summaryValue: formatHuf(yearBase.summaryTotal),
        totalThresholdHitDays,
        totalThresholdAmount,
      };
    }

    function incomeGraphMonthsForThreshold(data) {
      const sourceMonths = data.graphMonths.filter((month) => month.scopeTotal > 0);
      if (data.threshold <= 0) return sourceMonths;
      return sourceMonths.filter((month) => month.thresholdHitDays > 0);
    }

    function incomeMetricTotal(month, threshold) {
      return threshold <= 0 ? month.scopeTotal : month.thresholdScopeTotal;
    }

    function incomeMetricDayCount(month, threshold) {
      if (threshold <= 0) {
        return month.days.filter((day) => day.scopeAmount > 0).length;
      }
      return month.thresholdHitDays;
    }

    function categorySeries(data) {
      const graphMonths = incomeGraphMonthsForThreshold(data);
      const totals = graphMonths.map((month) => incomeMetricTotal(month, data.threshold));
      const incomeDayCounts = graphMonths.map((month) => incomeMetricDayCount(month, data.threshold));
      const scoreValues = appIncomeHealthValues(totals, incomeDayCounts);
      const maxTotal = Math.max(1, ...totals);
      const monthPoints = graphMonths.map((month, index) => {
        const total = incomeMetricTotal(month, data.threshold);
        const incomeDays = incomeMetricDayCount(month, data.threshold);
        return {
          index,
          month: month.month,
          value: total,
          incomeDays,
          score: scoreValues[index] || 0,
          position: normalizedPosition(index, graphMonths.length),
        };
      });
      const monthTicks = graphMonths.map((month, index) => ({
        label: monthLabels[month.month - 1],
        position: normalizedPosition(index, graphMonths.length),
      }));
      return {
        occurrenceLine: [],
        amountLine: totals.map((value, index) => ({ index, value: clamp(value / maxTotal * 100, 0, 100), position: normalizedPosition(index, totals.length) })),
        helperAmountLine: monthPoints.map((point) => ({ index: point.index, value: point.value, position: point.position })),
        scoreLine: scoreValues.map((value, index) => ({ index, value, position: normalizedPosition(index, scoreValues.length) })),
        monthTicks,
        occurrenceMax: Math.max(1, ...monthPoints.map((point) => point.incomeDays)),
        amountMax: Math.max(1, ...totals),
        latestOccurrence: monthPoints.length ? monthPoints[monthPoints.length - 1].incomeDays : 0,
        latestAmount: totals.length ? totals[totals.length - 1] : 0,
        dynamicEmaPeriod: 1,
        displayScore: scoreValues.length ? scoreValues[scoreValues.length - 1] : 50,
        kontrollScore: incomeHealthFinalScore(scoreValues),
      };
    }

    function incomeComparisonSeries(data) {
      const months = incomeGraphMonthsForThreshold(data);
      const target = data.threshold > 0
        ? data.threshold
        : Math.max(1, average(months.map((month) => incomeMetricTotal(month, data.threshold)).filter((value) => value > 0)));
      const monthTicks = months.map((month, index) => ({
        label: monthLabels[month.month - 1],
        position: normalizedPosition(index, months.length),
      }));
      const totals = months.map((month) => incomeMetricTotal(month, data.threshold));
      const incomeDayCounts = months.map((month) => incomeMetricDayCount(month, data.threshold));
      const dayTotalsByMonth = months.map((month) => (
        month.days
          .filter((day) => data.threshold <= 0 ? day.scopeAmount > 0 : day.meetsThreshold)
          .map((day) => day.scopeAmount)
      ));

      const appHealth = appIncomeHealthValues(totals, incomeDayCounts);
      const targetCoverage = totals.map((total) => (
        data.threshold <= 0 ? 100 : clamp(total / target * 100, 0, 100)
      ));
      const confidenceTrend = ema(targetCoverage, 3);
      const targetConfidence = targetCoverage.map((value, index) => (
        clamp(value * 0.78 + confidenceTrend[index] * 0.22, 0, 100)
      ));
      const structure = dayTotalsByMonth.map((amounts) => incomeStructureIndex(amounts));
      const salaryLike = targetCoverage.map((value, index) => (
        clamp(value * 0.70 + (100 - structure[index]) * 0.30, 0, 100)
      ));
      return {
        monthTicks,
        target,
        cards: [
          {
            key: 'A',
            title: 'App jelenlegi income health',
            note: [
              'Relatív: éves átlaghoz, aktív napokhoz és stabilitáshoz mér.',
              'Nem user-cél alapú, ezért bevételnél félre tud skálázni.',
            ],
            score: incomeHealthFinalScore(appHealth),
            line: pointsFromValues(appHealth),
            secondary: pointsFromValues(incomeDayCounts.map((count) => (
              clamp(count / Math.max(1, ...incomeDayCounts) * 100, 0, 100)
            ))),
            secondaryLabel: 'napok',
            secondaryColor: colors.primary,
          },
          {
            key: 'B',
            title: 'Target coverage',
            note: [
              'Egyszerű: havi bevétel / havi cél, 100-nál plafon.',
              'Jó célmérés, de sok 100-as hónapnál platót rajzol.',
            ],
            score: targetCoverage.length ? targetCoverage[targetCoverage.length - 1] : 100,
            line: pointsFromValues(targetCoverage),
            secondary: pointsFromValues(totals.map((total) => clamp(total / Math.max(1, Math.max(...totals)) * 100, 0, 100))),
            secondaryLabel: 'összeg',
            secondaryColor: colors.primary,
          },
          {
            key: 'C',
            title: 'Javasolt: célbiztonság',
            note: [
              'Fő score: cél elérése + enyhe 3 havi EMA, magasabb = jobb.',
              'A szerkezet külön segédvonal, nem bünteti a havi fizetést.',
            ],
            score: targetConfidence.length ? targetConfidence[targetConfidence.length - 1] : 100,
            line: pointsFromValues(targetConfidence),
            secondary: pointsFromValues(structure),
            secondaryLabel: 'szerkezet',
            secondaryColor: colors.primary,
          },
          {
            key: 'D',
            title: 'Alternatíva: bér-jellegű scope',
            note: [
              'Csak akkor jó, ha a scope tényleg fizetés kategória.',
              'A sok mikrobevételt lejjebb veszi, mert nem salary-szerű.',
            ],
            score: salaryLike.length ? salaryLike[salaryLike.length - 1] : 100,
            line: pointsFromValues(salaryLike),
            secondary: pointsFromValues(structure),
            secondaryLabel: 'fragmentáció',
            secondaryColor: colors.primary,
          },
        ],
      };
    }

    function appIncomeHealthValues(monthlyTotals, activeDayCounts) {
      const monthlyReference = average(monthlyTotals);
      const activeDayReference = average(activeDayCounts.filter((days) => days > 0));
      const totalIndexes = monthlyTotals.map((total) => (
        clamp(50 * safeRatio(total, monthlyReference), 0, 100)
      ));
      const activeDayIndexes = activeDayCounts.map((days) => (
        clamp(50 * safeRatio(days, activeDayReference), 0, 100)
      ));
      const stabilityIndexes = totalIndexes.map((value, index) => {
        if (index === 0) return 50;
        const delta = Math.abs(value - totalIndexes[index - 1]);
        return clamp(100 - delta * 1.2, 0, 100);
      });
      return totalIndexes.map((value, index) => (
        clamp(0.55 * value + 0.25 * activeDayIndexes[index] + 0.20 * stabilityIndexes[index], 0, 100)
      ));
    }

    function incomeHealthFinalScore(values) {
      if (!values.length) return 50;
      if (values.length === 1) return clamp(values[0], 0, 100);
      const split = Math.max(1, Math.floor(values.length / 2));
      const prior = average(values.slice(0, split));
      const recent = average(values.slice(split));
      const declinePenalty = Math.max(0, prior - recent) * 0.5;
      return clamp(recent - declinePenalty, 0, 100);
    }

    function incomeStructureIndex(amounts) {
      const total = amounts.reduce((sum, value) => sum + value, 0);
      if (total <= 0) return 0;
      const concentration = amounts.reduce((sum, value) => {
        const share = value / total;
        return sum + share * share;
      }, 0);
      const effectiveDays = 1 / Math.max(0.0001, concentration);
      return clamp((effectiveDays - 1) / 9 * 100, 0, 100);
    }

    function safeRatio(value, reference) {
      return reference <= 0 ? 0 : value / reference;
    }

    function pointsFromValues(values) {
      return values.map((value, index) => ({
        index,
        value: clamp(value, 0, 100),
        position: normalizedPosition(index, values.length),
      }));
    }

    function sparseCategorySeries(graphDays, focusScopeDays, helperAmountLine) {
      const hitDays = graphDays.filter((day) => day.qualifyingAmount > 0);
      const amountMax = Math.max(1, ...hitDays.map((day) => day.qualifyingAmount));
      const scoreValues = hitDays.map((day) => clamp(100 - (day.qualifyingAmount / amountMax * 100), 0, 100));
      return {
        occurrenceLine: hitDays.map((day, index) => ({ index, value: 100, position: positionInGraph(day, graphDays) })),
        amountLine: hitDays.map((day, index) => ({ index, value: clamp(day.qualifyingAmount / amountMax * 100, 0, 100), position: positionInGraph(day, graphDays) })),
        helperAmountLine,
        scoreLine: scoreValues.map((value, index) => ({ index, value, position: positionInGraph(hitDays[index], graphDays) })),
        monthTicks: monthTicksForGraphDays(graphDays),
        occurrenceMax: focusScopeDays,
        amountMax,
        latestOccurrence: focusScopeDays,
        latestAmount: hitDays.length ? hitDays[hitDays.length - 1].qualifyingAmount : 0,
        dynamicEmaPeriod: 1,
        kontrollScore: scoreValues.length ? scoreValues[scoreValues.length - 1] : 100,
      };
    }

    function helperAmountPoints(graphDays) {
      return graphDays
        .filter((day) => day.qualifyingAmount > 0)
        .map((day, index) => ({
          index,
          value: day.qualifyingAmount,
          position: positionInGraph(day, graphDays),
        }));
    }

    function normalizedPosition(index, length) {
      return length <= 1 ? 0.5 : index / (length - 1);
    }

    function positionInGraph(day, graphDays) {
      const index = graphDays.indexOf(day);
      return normalizedPosition(index < 0 ? 0 : index, graphDays.length);
    }

    function monthTicksForGraphDays(graphDays) {
      if (!graphDays.length) return [];
      const ticks = [];
      const seen = new Set();
      for (let i = 0; i < graphDays.length; i += 1) {
        const month = graphDays[i].month;
        if (seen.has(month)) continue;
        seen.add(month);
        ticks.push({
          label: monthLabels[month - 1],
          position: graphDays.length <= 1 ? 0.5 : i / (graphDays.length - 1),
        });
      }
      return ticks;
    }

    function setupCanvas(id) {
      const canvas = document.getElementById(id);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssWidth = Number(canvas.getAttribute('width'));
      const cssHeight = Number(canvas.getAttribute('height'));
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.round(cssWidth * dpr);
      canvas.height = Math.round(cssHeight * dpr);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { canvas, ctx, dpr, width: cssWidth, height: cssHeight };
    }

    function initCanvases() {
      canvases.fastInfo = setupCanvas('fastInfoCanvas');
      canvases.magnet = setupCanvas('magnetCanvas');
      canvases.months = setupCanvas('monthCanvas');
      canvases.scoreDesign = setupCanvas('scoreDesignCanvas');
      canvases.incomeCompare = setupCanvas('incomeCompareCanvas');
      canvases.incomeLowerOptions = setupCanvas('incomeLowerOptionsCanvas');
      canvases.magnetScale = setupCanvas('magnetScaleCanvas');
    }

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawText(ctx, text, x, y, size, weight, color, align = 'left', baseline = 'alphabetic') {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.fillText(text, x, y);
    }

    function drawLowerOptionAxis(ctx, chart, topLabel) {
      ctx.save();
      roundRect(ctx, chart.x, chart.y, chart.w, chart.h, 6);
      ctx.fillStyle = 'rgba(248,250,252,.72)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(226,232,240,.76)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chart.x, chart.y + 1);
      ctx.lineTo(chart.x + chart.w, chart.y + 1);
      ctx.moveTo(chart.x, chart.y + chart.h * 0.5);
      ctx.lineTo(chart.x + chart.w, chart.y + chart.h * 0.5);
      ctx.moveTo(chart.x, chart.y + chart.h - 1);
      ctx.lineTo(chart.x + chart.w, chart.y + chart.h - 1);
      ctx.stroke();
      drawText(ctx, topLabel, chart.x - 5, chart.y + 5, 6.8, 750, colors.gray500, 'right', 'middle');
      drawText(ctx, '0', chart.x - 5, chart.y + chart.h * 0.5 + 2, 6.8, 750, colors.gray500, 'right', 'middle');
      drawText(ctx, '-max', chart.x - 5, chart.y + chart.h - 2, 6.8, 750, colors.gray500, 'right', 'middle');
      ctx.restore();
    }

    function drawAverageDeviationBars(ctx, chart, points) {
      ctx.save();
      roundRect(ctx, chart.x, chart.y, chart.w, chart.h, 6);
      ctx.fillStyle = 'rgba(248,250,252,.72)';
      ctx.fill();

      const baselineY = chart.y + chart.h * 0.5;
      ctx.strokeStyle = 'rgba(100,116,139,.48)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chart.x, baselineY);
      ctx.lineTo(chart.x + chart.w, baselineY);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(226,232,240,.66)';
      ctx.beginPath();
      ctx.moveTo(chart.x, chart.y + 1);
      ctx.lineTo(chart.x + chart.w, chart.y + 1);
      ctx.moveTo(chart.x, chart.y + chart.h - 1);
      ctx.lineTo(chart.x + chart.w, chart.y + chart.h - 1);
      ctx.stroke();

      if (!points.length) {
        drawEmptyChartMessage(ctx, chart, 'Nincs minta');
        ctx.restore();
        return;
      }

      const values = points.map((point) => pointValue(point));
      const avg = average(values);
      const maxDeviation = Math.max(1, ...values.map((value) => Math.abs(value - avg)));
      const barW = optionBarWidth(chart, points);

      drawText(ctx, '+max', chart.x - 5, chart.y + 4, 6.8, 750, colors.gray500, 'right', 'middle');
      drawText(ctx, '0', chart.x - 5, baselineY + 2, 6.8, 750, colors.gray500, 'right', 'middle');
      drawText(ctx, '-max', chart.x - 5, chart.y + chart.h - 2, 6.8, 750, colors.gray500, 'right', 'middle');

      for (let i = 0; i < points.length; i += 1) {
        const value = pointValue(points[i]);
        const delta = value - avg;
        const strength = clamp(Math.abs(delta) / maxDeviation, 0, 1);
        const x = chart.x + chart.w * pointPosition(points[i], i, points.length);
        const h = Math.max(1.5, strength * chart.h * 0.42);
        const top = delta >= 0 ? baselineY - h : baselineY;
        roundRect(ctx, x - barW / 2, top, barW, h, Math.min(4, barW / 2));
        ctx.fillStyle = delta >= 0 ? colors.income : colors.expense;
        ctx.globalAlpha = clamp(0.30 + strength * 0.52, 0.30, 0.82);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawFragmentationOption(ctx, chart, points) {
      const barW = optionBarWidth(chart, points);
      ctx.save();
      ctx.strokeStyle = 'rgba(6,182,212,.34)';
      ctx.lineWidth = 1.3;
      for (let i = 0; i < points.length; i += 1) {
        const value = pointValue(points[i]);
        const x = chart.x + chart.w * pointPosition(points[i], i, points.length);
        const y = chart.y + chart.h - chart.h * clamp(value / 100, 0, 1);
        ctx.beginPath();
        ctx.moveTo(x, chart.y + chart.h - 2);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, clamp(barW * 0.34, 2.4, 4.2), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(6,182,212,.78)';
        ctx.fill();
      }
      ctx.restore();

    function drawConcentrationOption(ctx, chart, points) {
      const barW = optionBarWidth(chart, points);
      ctx.save();
      for (let i = 0; i < points.length; i += 1) {
        const value = pointValue(points[i]);
        const x = chart.x + chart.w * pointPosition(points[i], i, points.length);
        const h = Math.max(2, chart.h * clamp(value / 100, 0, 1));
        roundRect(ctx, x - barW / 2, chart.y + chart.h - h, barW, h, Math.min(4, barW / 2));
        ctx.fillStyle = 'rgba(245,158,11,.82)';
        ctx.globalAlpha = clamp(0.28 + value / 100 * 0.58, 0.28, 0.86);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawSurvivalOption(ctx, chart, points) {
      const barW = optionBarWidth(chart, points);
      ctx.save();
      for (let i = 0; i < points.length; i += 1) {
        const value = pointValue(points[i]);
        const x = chart.x + chart.w * pointPosition(points[i], i, points.length);
        roundRect(ctx, x - barW / 2, chart.y + 4, barW, chart.h - 8, Math.min(5, barW / 2));
        ctx.fillStyle = 'rgba(203,213,225,.52)';
        ctx.fill();
        const h = Math.max(2, (chart.h - 8) * clamp(value / 100, 0, 1));
        roundRect(ctx, x - barW / 2, chart.y + chart.h - 4 - h, barW, h, Math.min(5, barW / 2));

    function drawScoreGrid(ctx, chart, full) {
      ctx.save();
      if (full) {
        ctx.strokeStyle = 'rgba(226,232,240,.72)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i += 1) {
          const y = chart.y + chart.h * i / 4;
          ctx.beginPath();
          ctx.moveTo(chart.x, y);
          ctx.lineTo(chart.x + chart.w, y);
          ctx.stroke();
        }
      }
      const neutralY = chart.y + chart.h * 0.5;
      ctx.strokeStyle = 'rgba(251,191,36,.50)';
      ctx.lineWidth = full ? 1.2 : 1;
      ctx.beginPath();
      ctx.moveTo(chart.x, neutralY);
      ctx.lineTo(chart.x + chart.w, neutralY);
      ctx.stroke();
      ctx.restore();
    }

    function drawSoftScoreZones(ctx, chart) {
      const gradient = ctx.createLinearGradient(0, chart.y, 0, chart.y + chart.h);
      gradient.addColorStop(0, 'rgba(34,197,94,.13)');
      gradient.addColorStop(0.40, 'rgba(34,197,94,.04)');
      gradient.addColorStop(0.50, 'rgba(251,191,36,.08)');
      gradient.addColorStop(0.62, 'rgba(239,68,68,.04)');
      gradient.addColorStop(1, 'rgba(239,68,68,.13)');
      ctx.fillStyle = gradient;
      roundRect(ctx, chart.x, chart.y, chart.w, chart.h, 8);
      ctx.fill();
    }

    function drawScoreDeviationFill(ctx, chart, points) {
      if (!points.length) return;
      const baselineY = chart.y + chart.h * 0.5;
      const barW = points.length <= 12 ? 12 : clamp(chart.w / points.length * 0.72, 1.2, 5.4);
      for (let i = 0; i < points.length; i += 1) {
        const value = pointValue(points[i]);
        const x = chart.x + chart.w * pointPosition(points[i], i, points.length);
        const y = chart.y + chart.h - chart.h * clamp(value / 100, 0, 1);
        const h = Math.max(1.2, Math.abs(y - baselineY));
        const top = Math.min(y, baselineY);
        roundRect(ctx, x - barW / 2, top, barW, h, Math.min(2, barW / 2));
        ctx.fillStyle = value >= 50 ? 'rgba(34,197,94,.26)' : 'rgba(239,68,68,.26)';
        ctx.fill();
      }
    }

    function drawScorePath(ctx, chart, points, color, width, dash) {
      if (!points.length) return;
      ctx.save();
      ctx.beginPath();
      addSmoothScorePath(ctx, chart, points, 0, points.length - 1);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash(dash);
      ctx.stroke();
      ctx.restore();
    }

    function drawSegmentedScorePath(ctx, chart, points, width, alpha) {
      if (!points.length) return;
      const zones = [
        { from: 0, to: 45, color: colors.expense },
        { from: 45, to: 60, color: colors.orange },
        { from: 60, to: 100, color: colors.income },
      ];
      for (const zone of zones) {
        const yTop = chart.y + chart.h - chart.h * zone.to / 100;
        const yBottom = chart.y + chart.h - chart.h * zone.from / 100;
        ctx.save();
        ctx.beginPath();
        ctx.rect(chart.x - width, yTop, chart.w + width * 2, yBottom - yTop);
        ctx.clip();
        ctx.beginPath();
        addSmoothScorePath(ctx, chart, points, 0, points.length - 1);
        ctx.strokeStyle = zone.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }
    }

    function addSmoothScorePath(ctx, chart, points, fromIndex, toIndex) {
      const point = (i) => ({
        x: chart.x + chart.w * pointPosition(points[i], i, points.length),
        y: chart.y + chart.h - chart.h * clamp(pointValue(points[i]) / 100, 0, 1),
      });
      const first = point(fromIndex);
      ctx.moveTo(first.x, first.y);
      if (toIndex - fromIndex < 2) {
        for (let i = fromIndex + 1; i <= toIndex; i += 1) {
          const p = point(i);
          ctx.lineTo(p.x, p.y);
        }
        return;
      }
      for (let i = fromIndex; i < toIndex; i += 1) {
        const p0 = i === fromIndex ? point(i) : point(i - 1);
        const p1 = point(i);
        const p2 = point(i + 1);
        const p3 = i + 2 <= toIndex ? point(i + 2) : p2;
        const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
        const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
        ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, p2.x, p2.y);
      }
    }

    function drawEndpointDot(ctx, chart, points, radius) {
      if (!points.length) return;
      const last = points[points.length - 1];
      const x = chart.x + chart.w * pointPosition(last, points.length - 1, points.length);
      const y = chart.y + chart.h - chart.h * clamp(pointValue(last) / 100, 0, 1);
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius + 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = scoreColor(pointValue(last));
      ctx.fill();
      ctx.restore();
    }

    function drawMiniLegend(ctx, items, x, y, maxX) {
      let currentX = x;
      for (const [label, color] of items) {
        ctx.font = `700 7.4px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        const labelW = ctx.measureText(label).width;
        if (currentX + labelW + 14 > maxX) break;
        roundRect(ctx, currentX, y + 5, 8, 3.8, 1.4);
        ctx.fillStyle = color;
        ctx.fill();
        drawText(ctx, label, currentX + 11, y + 9.5, 7.4, 700, colors.gray500);
        currentX += labelW + 22;
      }
    }

    function drawLegend(ctx, items, chart) {
      let x = chart.x;
      const y = Number.isFinite(chart.legendY) ? chart.legendY : chart.y - 16;
      const maxX = chart.x + chart.w;
      for (const [label, color] of items) {
        ctx.font = `650 12.4px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        const labelW = ctx.measureText(label).width;
        const itemW = 10.5 + 5 + labelW + 12;
        if (x + itemW > maxX) break;
        roundRect(ctx, x, y + 5.5, 10.5, 5.2, 1.8);
        ctx.fillStyle = color;
        ctx.fill();
        drawText(ctx, label, x + 15.5, y + 12.3, 12.4, 650, colors.gray500);
        x += itemW;
      }
    }

    }

    function drawThresholdVolumeLine(ctx, chart, points, maxAmount) {
      ctx.save();
      roundRect(ctx, chart.x, chart.y, chart.w, chart.h, 6);
      ctx.fillStyle = 'rgba(248,250,252,.72)';
      ctx.fill();

      ctx.strokeStyle = 'rgba(226,232,240,.74)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chart.x, chart.y + 1);
      ctx.lineTo(chart.x + chart.w, chart.y + 1);
      ctx.moveTo(chart.x, chart.y + chart.h * 0.5);
      ctx.lineTo(chart.x + chart.w, chart.y + chart.h * 0.5);
      ctx.moveTo(chart.x, chart.y + chart.h - 1);
      ctx.lineTo(chart.x + chart.w, chart.y + chart.h - 1);

      drawText(ctx, formatCompactHuf(maxAmount), chart.x - 5, chart.y + 5, 6.8, 750, colors.gray500, 'right', 'middle');

      if (!points.length) {
        drawEmptyChartMessage(ctx, chart, 'Nincs küszöb feletti volumen');
        ctx.restore();
        return;
      }

      ctx.save();
      ctx.beginPath();
      const first = {
        x: chart.x + chart.w * pointPosition(points[0], 0, points.length),
        y: chart.y + chart.h - chart.h * clamp(pointValue(points[0]) / 100, 0, 1),
      };
      const last = points[points.length - 1];
      const lastX = chart.x + chart.w * pointPosition(last, points.length - 1, points.length);
      ctx.moveTo(first.x, chart.y + chart.h);
      ctx.lineTo(first.x, first.y);
      addSmoothScorePath(ctx, chart, points, 0, points.length - 1);
      ctx.lineTo(lastX, chart.y + chart.h);

      const fill = ctx.createLinearGradient(0, chart.y, 0, chart.y + chart.h);
      fill.addColorStop(0, 'rgba(6,182,212,.22)');
      fill.addColorStop(1, 'rgba(6,182,212,.02)');
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.restore();

      drawScorePath(ctx, chart, points, colors.primary, 2.25, []);
      drawVolumeEndpointDot(ctx, chart, points);
      ctx.restore();
    }

    function drawVolumeEndpointDot(ctx, chart, points) {
      if (!points.length) return;
      const last = points[points.length - 1];
      const x = chart.x + chart.w * pointPosition(last, points.length - 1, points.length);
      const y = chart.y + chart.h - chart.h * clamp(pointValue(last) / 100, 0, 1);
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, 4.4, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 2.7, 0, Math.PI * 2);

      ctx.fill();
      ctx.restore();
    }

    function scoreColor(value) {
      if (value < 45) return colors.expense;
      if (value < 60) return colors.orange;
      return colors.income;
    }

    function drawScoreZones(ctx, chart) {
      const zones = [
        { from: 0, to: 45, color: 'rgba(239,68,68,.07)' },
        { from: 45, to: 60, color: 'rgba(251,191,36,.08)' },
        { from: 60, to: 100, color: 'rgba(34,197,94,.07)' },
      ];
      for (const zone of zones) {
        const yTop = chart.y + chart.h - chart.h * zone.to / 100;
        const yBottom = chart.y + chart.h - chart.h * zone.from / 100;
        ctx.fillStyle = zone.color;
        ctx.fillRect(chart.x, yTop, chart.w, yBottom - yTop);
      }
    }

    function drawScoreHistogram(ctx, chart, points) {
      ctx.save();
      ctx.fillStyle = 'rgba(248,250,252,.72)';
      roundRect(ctx, chart.x, chart.y, chart.w, chart.h, 7);
      ctx.fill();
      ctx.strokeStyle = 'rgba(226,232,240,.92)';
      ctx.lineWidth = 1;
      ctx.stroke();

      const baselineY = chart.y + chart.h * 0.5;
      ctx.strokeStyle = 'rgba(100,116,139,.42)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chart.x, baselineY);
      ctx.lineTo(chart.x + chart.w, baselineY);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(226,232,240,.55)';
      ctx.beginPath();
      ctx.moveTo(chart.x, chart.y + chart.h * 0.25);
      ctx.lineTo(chart.x + chart.w, chart.y + chart.h * 0.25);
      ctx.moveTo(chart.x, chart.y + chart.h * 0.75);
      ctx.lineTo(chart.x + chart.w, chart.y + chart.h * 0.75);
      ctx.stroke();

      if (!points.length) {
        ctx.restore();
        return;
      }
      const barWidth = points.length <= 12
        ? clamp(chart.w / Math.max(points.length * 7, 18), 5, 10)
        : clamp(chart.w / (points.length * 1.35), 1.1, 7);
      for (let i = 0; i < points.length; i += 1) {
        const value = pointValue(points[i]);
        const delta = scoreHistogramDelta(value);
        const x = chart.x + chart.w * pointPosition(points[i], i, points.length);
        const h = Math.max(1.4, Math.abs(delta) / 50 * chart.h * 0.46);
        const top = delta >= 0 ? baselineY - h : baselineY;
        roundRect(ctx, x - barWidth / 2, top, barWidth, h, Math.min(2.6, barWidth / 2));
        ctx.fillStyle = delta >= 0 ? colors.expense : colors.income;
        ctx.globalAlpha = clamp(0.38 + Math.abs(delta) / 50 * 0.48, 0.38, 0.86);
        ctx.fill();
      }
      ctx.restore();
    }

    function scoreHistogramDelta(score) {
      return clamp(50 - score, -50, 50);
    }

    function drawAmountAverageHistogram(ctx, chart, points) {
      const values = points.map((point) => pointValue(point));
      const deltas = amountAverageDeltas(values);
      drawDeltaHistogram(ctx, chart, points, deltas, {
        positiveColor: colors.expense,
        negativeColor: colors.income,
        baselineMode: 'middle',
      });
    }

    function drawAmountMinHistogram(ctx, chart, points) {
      const values = points.map((point) => pointValue(point));
      const deltas = amountMinDeltas(values);
      drawDeltaHistogram(ctx, chart, points, deltas, {
        positiveColor: colors.expense,
        negativeColor: colors.expense,
        baselineMode: 'bottom',
      });
    }

    function drawThresholdExcessHistogram(ctx, chart, points, threshold) {
      if (threshold <= 0) {
        const values = points.map((point) => pointValue(point));
        drawDeltaHistogram(ctx, chart, points, amountAverageDeltas(values), {
          positiveColor: colors.income,
          negativeColor: colors.expense,
          baselineMode: 'center',
        });
        return;
      }
      const values = points.map((point) => pointValue(point));
      const deltas = incomeTargetDeltas(values, threshold);
      drawDeltaHistogram(ctx, chart, points, deltas, {
        positiveColor: colors.income,
        negativeColor: colors.expense,
        baselineMode: 'center',
      });
    }

    function amountAverageDeltas(values) {
      const avg = average(values);
      const maxDeviation = Math.max(1, ...values.map((value) => Math.abs(value - avg)));
      return values.map((value) => (value - avg) / maxDeviation * 50);
    }

    function amountMinDeltas(values) {
      const min = values.length ? Math.min(...values) : 0;
      const maxSpread = Math.max(1, ...values.map((value) => value - min));
      return values.map((value) => (value - min) / maxSpread * 100);
    }

    function thresholdExcessDeltas(values, threshold) {
      if (threshold <= 0) return amountMinDeltas(values);
      const excessValues = values.map((value) => Math.max(0, value - threshold));
      const maxExcess = Math.max(1, ...excessValues);
      return excessValues.map((value) => value / maxExcess * 100);
    }

    function incomeTargetDeltas(values, threshold) {
      if (threshold <= 0) return amountAverageDeltas(values);
      const maxDeviation = Math.max(1, ...values.map((value) => Math.abs(value - threshold)));
      return values.map((value) => (value - threshold) / maxDeviation * 50);
    }

    function drawDeltaHistogram(ctx, chart, points, deltas, options) {
      ctx.save();
      ctx.fillStyle = 'rgba(248,250,252,.72)';
      roundRect(ctx, chart.x, chart.y, chart.w, chart.h, 6);
      ctx.fill();

      const baselineY = options.baselineMode === 'bottom'
        ? chart.y + chart.h - 1
        : chart.y + chart.h * 0.5;
      ctx.strokeStyle = 'rgba(100,116,139,.4)';
      ctx.beginPath();
      ctx.moveTo(chart.x, baselineY);
      ctx.lineTo(chart.x + chart.w, baselineY);
      ctx.stroke();

      if (!points.length) {
        ctx.restore();
        return;
      }
      const barWidth = points.length <= 12
        ? clamp(chart.w / Math.max(points.length * 7, 18), 5, 10)
        : clamp(chart.w / (points.length * 1.35), 1.1, 7);
      for (let i = 0; i < points.length; i += 1) {
        const delta = clamp(deltas[i] || 0, -50, 100);
        const x = chart.x + chart.w * pointPosition(points[i], i, points.length);
        const scale = options.baselineMode === 'bottom' ? 100 : 50;
        const available = options.baselineMode === 'bottom' ? chart.h * 0.82 : chart.h * 0.43;
        const h = Math.max(1, Math.abs(delta) / scale * available);
        const top = delta >= 0 ? baselineY - h : baselineY;
        roundRect(ctx, x - barWidth / 2, top, barWidth, h, Math.min(2.4, barWidth / 2));
        ctx.fillStyle = delta >= 0 ? options.positiveColor : options.negativeColor;
        ctx.globalAlpha = clamp(0.34 + Math.abs(delta) / scale * 0.5, 0.34, 0.84);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEndpointBadge(ctx, chart, points, label, color, offsetY) {
      if (!points.length) return;
      const lastPoint = points[points.length - 1];
      const last = pointValue(lastPoint);
      const y = chart.y + chart.h - chart.h * clamp(last / 100, 0, 1) + offsetY;
      const x = chart.x + chart.w * pointPosition(lastPoint, points.length - 1, points.length) - 2;
      ctx.font = `800 7px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      const labelW = ctx.measureText(label).width + 10;
      roundRect(ctx, x - labelW, clamp(y - 8, chart.y + 2, chart.y + chart.h - 14), labelW, 14, 7);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.stroke();
      drawText(ctx, label, x - labelW / 2, clamp(y - 1, chart.y + 9, chart.y + chart.h - 7), 7, 800, color, 'center', 'middle');
    }

    function drawMonthLabels(ctx, chart, labels) {
      for (let i = 0; i < labels.length; i += 1) {
        const label = typeof labels[i] === 'string' ? labels[i] : labels[i].label;
        const position = typeof labels[i] === 'string'
          ? (labels.length <= 1 ? 0.5 : i / (labels.length - 1))
          : labels[i].position;
        const x = chart.x + chart.w * clamp(position, 0, 1);
        ctx.font = `700 7.4px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        const w = ctx.measureText(label).width;
        drawText(ctx, label, clamp(x - w / 2, chart.x, chart.x + chart.w - w), chart.y + chart.h + 11, 7.4, 700, colors.gray500);
      }
    }

    function drawSeriesLine(ctx, chart, values, color, width, dash) {
      if (!values.length) return;
      ctx.save();
      ctx.beginPath();
      const point = (i) => ({
        x: values.length <= 1 ? chart.x + chart.w / 2 : chart.x + chart.w * i / (values.length - 1),
        y: chart.y + chart.h - chart.h * clamp(values[i] / 100, 0, 1),
      });
      const first = point(0);
      ctx.moveTo(first.x, first.y);
      if (values.length < 3) {
        for (let i = 1; i < values.length; i += 1) {
          const p = point(i);
          ctx.lineTo(p.x, p.y);
        }
      } else {
        const pts = values.map((_, i) => point(i));
        for (let i = 0; i < pts.length - 1; i += 1) {
          const p0 = i === 0 ? pts[i] : pts[i - 1];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = i + 2 < pts.length ? pts[i + 2] : p2;
          const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
          const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
          ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, p2.x, p2.y);
        }
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash(dash);
      ctx.stroke();
      ctx.restore();
    }

    function drawScoreLine(ctx, chart, points) {
      if (!points.length) return;
      const point = (i) => ({
        x: chart.x + chart.w * pointPosition(points[i], i, points.length),
        y: chart.y + chart.h - chart.h * clamp(pointValue(points[i]) / 100, 0, 1),
      });
      const drawSegment = (fromIndex, toIndex, color) => {
        if (toIndex <= fromIndex) return;
        ctx.save();
        ctx.beginPath();
        const first = point(fromIndex);
        ctx.moveTo(first.x, first.y);
        for (let i = fromIndex; i < toIndex; i += 1) {
          const p0 = i === fromIndex ? point(i) : point(i - 1);
          const p1 = point(i);
          const p2 = point(i + 1);
          const p3 = i + 2 <= toIndex ? point(i + 2) : p2;
          const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
          const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
          ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, p2.x, p2.y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      };

      let segmentStart = 0;
      let currentColor = scoreColor(pointValue(points[0]));
      for (let i = 1; i < points.length; i += 1) {
        const nextColor = scoreColor(pointValue(points[i]));
        if (nextColor === currentColor) continue;
        drawSegment(segmentStart, i, currentColor);
        segmentStart = i - 1;
        currentColor = nextColor;
      }
      drawSegment(segmentStart, points.length - 1, currentColor);
    }

    function pointValue(point) {
      return typeof point === 'number' ? point : point.value;
    }

    function pointPosition(point, index, length) {
      if (point && typeof point === 'object' && Number.isFinite(point.position)) return clamp(point.position, 0, 1);
      return normalizedPosition(index, length);
    }

    function drawMagnet(score) {
      const { ctx } = canvases.magnet;
      const h = 157.5;
      ctx.clearRect(0, 0, W, h);
      const trackHeight = Math.max(2, h * 6 / 35);
      const y = h / 2 - trackHeight / 2;
      drawMagnetSoftWash(ctx, { x: 0, y, w: W, h: trackHeight }, score);
    }

    function drawMonthCards(data) {
      const { ctx } = canvases.months;
      ctx.clearRect(0, 0, MONTH_CANVAS_W, MONTH_CANVAS_H);
      const cardGap = MONTH_CANVAS_W * 0.04;
      const cardW = MONTH_CANVAS_W * 0.48;
      const cardH = 200;
      const rowGap = 15;
      for (let index = 0; index < 12; index += 1) {
        const row = Math.floor(index / 2);
        const column = index % 2;
        const x = column === 0 ? 0 : cardW + cardGap;
        const y = row * (cardH + rowGap);
        drawMonthCard(ctx, { x, y, w: cardW, h: cardH }, data.months[index]);
      }
    }

    function drawMonthCard(ctx, rect, month) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.10)';
      ctx.shadowBlur = 3;
      ctx.shadowOffsetY = 1;
      roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 15);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();
      roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 15);
      ctx.strokeStyle = colors.gray200;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.save();
      ctx.beginPath();
      roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 15);
      ctx.clip();
      drawText(ctx, month.name, rect.x + rect.w / 2, rect.y + 18, 12, 600, colors.gray800, 'center', 'middle');
      const weekdayTop = rect.y + 44;
      const cellW = rect.w / 7;
      for (let i = 0; i < weekdays.length; i += 1) {
        drawText(ctx, weekdays[i], rect.x + cellW * i + cellW / 2, weekdayTop + 3, 8, 600, colors.gray500, 'center', 'middle');
      }
      const gridTop = rect.y + 54;
      const cellH = (rect.y + rect.h - gridTop - 8) / 6;
      for (const day of month.days) {
        const cellIndex = month.leadingBlankDays + day.day - 1;
        const col = cellIndex % 7;
        const row = Math.floor(cellIndex / 7);
        const cx = rect.x + col * cellW + cellW / 2;
        const cy = gridTop + row * cellH + cellH / 2;
        const shortest = Math.min(cellW, cellH);
        const radius = clamp(shortest * 0.38, 3, 11);
        let textColor = colors.gray500;
        if (day.dominantCategoryId !== null && day.meetsThreshold) {
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fillStyle = colors.income;
          ctx.fill();
          textColor = '#fff';
        }
        drawText(ctx, String(day.day), cx, cy + 0.5, 10, 600, textColor, 'center', 'middle');
      }
      ctx.restore();
    }

    function snapThreshold(raw) {
      return clamp(Math.round(Number(raw || 0) / 10000) * 10000, 0, 600000);
    }

    function showRuntimeError(error) {
      const box = document.getElementById('runtimeError');
      if (!box) return;
      const message = error && error.message ? error.message : String(error);
      box.textContent = `HTML szimulátor hiba: ${message}`;
      box.classList.add('visible');
    }

    function render(rawThreshold) {
      const threshold = snapThreshold(rawThreshold);
      const data = buildYearData(threshold);
      const series = categorySeries(data);
      document.getElementById('thresholdValue').textContent = formatHuf(threshold);
      document.getElementById('thresholdSlider').value = threshold;
      document.getElementById('thresholdInput').value = String(threshold);
      document.getElementById('headerValue').textContent = `${Math.round(series.displayScore)}/100`;
      drawFastInfo(data, series);
      drawMagnet(series.displayScore);
      drawMonthCards(data);
      drawScoreDesignLab(data, series);
      drawIncomeCompareLab(data);
      drawIncomeLowerOptionsLab(data);
      drawMagnetScaleLab(series);
    }

    function requestRender(rawThreshold) {
      pendingThreshold = snapThreshold(rawThreshold);
      if (pendingFrame) return;
      const schedule = window.requestAnimationFrame || ((callback) => window.setTimeout(callback, 16));
      pendingFrame = schedule(() => {
        pendingFrame = 0;
        try {
          render(pendingThreshold);
        } catch (error) {
          showRuntimeError(error);
          throw error;
        }
      });
    }

    const slider = document.getElementById('thresholdSlider');
    const input = document.getElementById('thresholdInput');
    const joystick = document.getElementById('joystick');

    window.addEventListener('error', (event) => showRuntimeError(event.error || event.message));
    slider.addEventListener('input', (event) => requestRender(event.target.value));
    input.addEventListener('change', (event) => requestRender(event.target.value));
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') requestRender(event.currentTarget.value);
    });
    joystick.addEventListener('click', () => {
      joystick.classList.add('active');
      input.focus();
      window.setTimeout(() => joystick.classList.remove('active'), 220);
    });

    try {
      initCanvases();
      render(300000);
      console.info('2025 income seed rows', incomeRows);
    } catch (error) {
      showRuntimeError(error);
      throw error;
    }
  </script>
</body>
