<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluvi spectral category palette lab</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f6f8;
      --surface: #ffffff;
      --line: #dfe4ea;
      --ink: #1c2430;
      --muted: #667085;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { margin: 0; min-width: 0; background: var(--page); }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 12px 10px calc(24px + env(safe-area-inset-bottom));
    }

    .reference-block,
    .category-block {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgb(16 24 40 / 4%);
    }

    .reference-block {
      display: grid;
      gap: 7px;
      margin-bottom: 10px;
      padding: 10px 9px;
    }

    .reference-title {
      color: var(--ink);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .04em;
      line-height: 1.1;
    }

    .category-block {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 10px;
      padding: 11px 9px;
    }

    .category-block + .category-block { margin-top: 10px; }

    .category-anchor {
      align-self: stretch;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding-top: 1px;
    }

    .canonical-swatch {
      width: 44px;
      height: 44px;
      border: 2px solid rgb(28 36 48 / 16%);
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 35%);
    }

    .category-id {
      color: var(--ink);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .02em;
      line-height: 1.15;
    }

    .canonical-hex {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9px;
      line-height: 1.15;
    }

    .variation-stack {
      display: grid;
      min-width: 0;
      gap: 10px;
    }

    .variation-row { display: grid; min-width: 0; gap: 4px; }

    .variation-meta {
      display: flex;
      min-width: 0;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }

    .variation-label {
      overflow: hidden;
      color: var(--ink);
      font-size: 10px;
      font-weight: 720;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .variation-metrics {
      flex: 0 0 auto;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 8px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 3px;
      min-width: 0;
    }

    .slot {
      appearance: none;
      display: grid;
      min-width: 0;
      gap: 2px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: center;
      touch-action: manipulation;
    }

    .slot:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .slot-number {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
    }

    .slot-color {
      position: relative;
      display: block;
      min-width: 0;
      aspect-ratio: 1 / .72;
      min-height: 21px;
      border: 1px solid rgb(28 36 48 / 7%);
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 24%);
    }

    .slot.is-canonical .slot-color {
      border-color: #111827;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 45%), 0 0 0 1px #111827;
    }

    .slot.is-canonical .slot-color::after {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 0 1px rgb(17 24 39 / 32%);
      content: "";
    }

    .window-evidence { display: grid; gap: 2px; margin-top: 1px; }

    .window-line {
      display: grid;
      grid-template-columns: 15px minmax(0, 1fr) 35px;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .window-label {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
    }

    .window-track {
      position: relative;
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      height: 9px;
      overflow: visible;
      border-radius: 3px;
    }

    .window-track-segment {
      min-width: 0;
      border-inline-end: 1px solid rgb(255 255 255 / 40%);
    }

    .window-outline {
      position: absolute;
      top: -1px;
      bottom: -1px;
      z-index: 1;
      border: 1px solid rgb(17 24 39 / 78%);
      border-radius: 3px;
      pointer-events: none;
    }

    .ab-chips { display: flex; justify-content: flex-end; gap: 2px; }

    .ab-chip {
      width: 16px;
      height: 10px;
      border: 1px solid rgb(28 36 48 / 20%);
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 22%);
    }

    #toast {
      position: fixed;
      z-index: 1;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      max-width: calc(100vw - 32px);
      padding: 8px 11px;
      border-radius: 999px;
      background: rgb(28 36 48 / 94%);
      color: white;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    #toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 370px) {
      main { padding-inline: 7px; }
      .category-block { grid-template-columns: 67px minmax(0, 1fr); gap: 7px; padding: 9px 7px; }
      .canonical-swatch { width: 39px; height: 39px; }
      .variation-label { font-size: 9px; }
      .variation-metrics { font-size: 7px; }
      .slot-grid { gap: 2px; }
      .slot-color { min-height: 19px; border-radius: 4px; }
      .window-line { grid-template-columns: 13px minmax(0, 1fr) 33px; gap: 3px; }
      .ab-chip { width: 15px; }
    }
  </style>
</head>
<body>
  <main id="palette-lab" aria-label="Fluvi spectral category palette lab"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    // Read-only snapshot of CategoryColorCatalog. middleColor is the exact
    // canonical identity; no BudgetHeaderPaletteGenerator output is used.
    const CATEGORIES = Object.freeze([
      { id: 'color_01', colorA: '#FF3B4F', middleColor: '#FF5268', colorB: '#FF6B7D' },
      { id: 'color_02', colorA: '#FF5733', middleColor: '#FF7043', colorB: '#FF8A50' },
      { id: 'color_03', colorA: '#FF8C1A', middleColor: '#FFA12B', colorB: '#FFB340' },
      { id: 'color_04', colorA: '#F7B500', middleColor: '#FFC233', colorB: '#FFD15C' },
      { id: 'color_05', colorA: '#F4DF24', middleColor: '#F7EA45', colorB: '#FFF06A' },
      { id: 'color_06', colorA: '#D4F52F', middleColor: '#B7EA2A', colorB: '#98DC3F' },
      { id: 'color_07', colorA: '#7DD943', middleColor: '#5BD265', colorB: '#3CCF7D' },
      { id: 'color_08', colorA: '#35C76E', middleColor: '#24C889', colorB: '#18BA78' },
      { id: 'color_09', colorA: '#15BD6F', middleColor: '#12B980', colorB: '#13AD8E' },
      { id: 'color_10', colorA: '#18C99A', middleColor: '#19C0AA', colorB: '#1BB6B8' },
      { id: 'color_11', colorA: '#1AC3C8', middleColor: '#1BB7D2', colorB: '#22ABD8' },
      { id: 'color_12', colorA: '#22D3EE', middleColor: '#2BC4F3', colorB: '#39B8F4' },
      { id: 'color_13', colorA: '#38AEF8', middleColor: '#3B9DF5', colorB: '#418CF0' },
      { id: 'color_14', colorA: '#3D7EF2', middleColor: '#496DEB', colorB: '#555EE4' },
      { id: 'color_15', colorA: '#4F63E6', middleColor: '#5A55DF', colorB: '#6548D6' },
      { id: 'color_16', colorA: '#6750E8', middleColor: '#7546DC', colorB: '#843BD0' },
      { id: 'color_17', colorA: '#7C4DFF', middleColor: '#8B45ED', colorB: '#9A3DDB' },
      { id: 'color_18', colorA: '#9B5CF6', middleColor: '#A94EE6', colorB: '#B841D5' },
      { id: 'color_19', colorA: '#A855F7', middleColor: '#B84CE0', colorB: '#C43DD0' },
      { id: 'color_20', colorA: '#CB3ED6', middleColor: '#D932C9', colorB: '#E427BD' },
      { id: 'color_21', colorA: '#E43EC4', middleColor: '#F04AB6', colorB: '#FB56A8' },
    ]);

    // Exact source values from docs/prototypes/color_lab.html coolScaleStops.
    const COOL_SOURCE_STOPS = Object.freeze([
      '#FFFFFF', '#E6FBFF', '#BDF5FF', '#75E6FF', '#22D3EE',
      '#06B6D4', '#0284C7', '#0057D9', '#0030A8', '#00135F',
    ]);
    const WINDOW_WIDTH_PERCENT = 28;
    const WINDOW_CENTERS = Object.freeze([30, 50, 70]);
    const TAU = Math.PI * 2;
    const DEGREE = Math.PI / 180;
    const EPSILON = 0.00025;

    const VARIATIONS = Object.freeze([
      { id: 'v1', label: 'V1 · Spectrum 40°', kind: 'spectrum', span: 40, lead: 24, tail: 16 },
      { id: 'v2', label: 'V2 · Spectrum 60°', kind: 'spectrum', span: 60, lead: 35, tail: 25 },
      { id: 'v3', label: 'V3 · Spectrum 80°', kind: 'spectrum', span: 80, lead: 45, tail: 35 },
      { id: 'v4', label: 'V4 · Cool-density', kind: 'cool' },
      { id: 'v5', label: 'V5 · Family spectrum', kind: 'family' },
    ]);

    // The direction makes the full lead → canonical → tail path advance in
    // one analogous direction. No adjacent category token is ever consulted.
    const FAMILY_RULES = Object.freeze({
      red:     { direction: 1, lead: 37, tail: 27, terminalFloor: .43, tailDrop: .15, tailChroma: .98 },
      orange:  { direction: -1, lead: 35, tail: 29, terminalFloor: .59, tailDrop: .11, tailChroma: .94 },
      amber:   { direction: -1, lead: 31, tail: 31, terminalFloor: .68, tailDrop: .09, tailChroma: .86 },
      yellow:  { direction: 1, lead: 32, tail: 34, terminalFloor: .80, tailDrop: .07, tailChroma: .80 },
      lime:    { direction: -1, lead: 31, tail: 33, terminalFloor: .48, tailDrop: .16, tailChroma: .90 },
      green:   { direction: -1, lead: 33, tail: 31, terminalFloor: .39, tailDrop: .18, tailChroma: .96 },
      emerald: { direction: -1, lead: 32, tail: 32, terminalFloor: .33, tailDrop: .19, tailChroma: .96 },
      teal:    { direction: -1, lead: 32, tail: 33, terminalFloor: .31, tailDrop: .19, tailChroma: .98 },
      cyan:    { direction: -1, lead: 35, tail: 31, terminalFloor: .30, tailDrop: .18, tailChroma: 1.00 },
      azure:   { direction: -1, lead: 34, tail: 32, terminalFloor: .27, tailDrop: .19, tailChroma: 1.00 },
      blue:    { direction: -1, lead: 34, tail: 34, terminalFloor: .25, tailDrop: .20, tailChroma: 1.02 },
      indigo:  { direction: -1, lead: 32, tail: 36, terminalFloor: .23, tailDrop: .21, tailChroma: 1.02 },
      violet:  { direction: -1, lead: 31, tail: 37, terminalFloor: .25, tailDrop: .20, tailChroma: 1.00 },
      purple:  { direction: -1, lead: 32, tail: 35, terminalFloor: .27, tailDrop: .19, tailChroma: 1.00 },
      magenta: { direction: -1, lead: 34, tail: 32, terminalFloor: .31, tailDrop: .17, tailChroma: .98 },
      pink:    { direction: -1, lead: 33, tail: 34, terminalFloor: .35, tailDrop: .16, tailChroma: .96 },
    });

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function normalizeHue(hue) { return ((hue % TAU) + TAU) % TAU; }
    function shortestHueDelta(from, to) {
      let delta = normalizeHue(to - from);
      if (delta > Math.PI) delta -= TAU;
      return delta;
    }

    function srgbToLinear(channel) {
      return channel <= .04045 ? channel / 12.92 : ((channel + .055) / 1.055) ** 2.4;
    }

    function linearToSrgb(channel) {
      return channel <= .0031308
        ? channel * 12.92
        : 1.055 * Math.pow(Math.max(0, channel), 1 / 2.4) - .055;
    }

    function hexToRgb(hex) {
      const compact = hex.slice(1);
      return {
        r: parseInt(compact.slice(0, 2), 16) / 255,
        g: parseInt(compact.slice(2, 4), 16) / 255,
        b: parseInt(compact.slice(4, 6), 16) / 255,
      };
    }

    function rgbToHex(rgb) {
      const component = (value) => Math.round(clamp(value, 0, 1) * 255)
        .toString(16).padStart(2, '0').toUpperCase();
      return `#${component(rgb.r)}${component(rgb.g)}${component(rgb.b)}`;
    }

    function srgbToOklab(rgb) {
      const red = srgbToLinear(rgb.r);
      const green = srgbToLinear(rgb.g);
      const blue = srgbToLinear(rgb.b);
      const l = .4122214708 * red + .5363325363 * green + .0514459929 * blue;
      const m = .2119034982 * red + .6806995451 * green + .1073969566 * blue;
      const s = .0883024619 * red + .2817188376 * green + .6299787005 * blue;
      const lRoot = Math.cbrt(l);
      const mRoot = Math.cbrt(m);
      const sRoot = Math.cbrt(s);
      return {
        L: .2104542553 * lRoot + .7936177850 * mRoot - .0040720468 * sRoot,
        a: 1.9779984951 * lRoot - 2.4285922050 * mRoot + .4505937099 * sRoot,
        b: .0259040371 * lRoot + .7827717662 * mRoot - .8086757660 * sRoot,
      };
    }

    function oklabToOklch(lab) {
      return { L: lab.L, C: Math.hypot(lab.a, lab.b), H: normalizeHue(Math.atan2(lab.b, lab.a)) };
    }

    function oklchToOklab(lch) {
      return { L: lch.L, a: lch.C * Math.cos(lch.H), b: lch.C * Math.sin(lch.H) };
    }

    function oklabToLinearRgb(lab) {
      const lRoot = lab.L + .3963377774 * lab.a + .2158037573 * lab.b;
      const mRoot = lab.L - .1055613458 * lab.a - .0638541728 * lab.b;
      const sRoot = lab.L - .0894841775 * lab.a - 1.2914855480 * lab.b;
      const l = lRoot ** 3;
      const m = mRoot ** 3;
      const s = sRoot ** 3;
      return {
        r: 4.0767416621 * l - 3.3077115913 * m + .2309699292 * s,
        g: -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s,
        b: -.0041960863 * l - .7034186147 * m + 1.7076147010 * s,
      };
    }

    function linearRgbToSrgb(rgb) {
      return { r: linearToSrgb(rgb.r), g: linearToSrgb(rgb.g), b: linearToSrgb(rgb.b) };
    }

    function isInSrgbGamut(lch) {
      const rgb = oklabToLinearRgb(oklchToOklab(lch));
      const tolerance = .000001;
      return rgb.r >= -tolerance && rgb.r <= 1 + tolerance
        && rgb.g >= -tolerance && rgb.g <= 1 + tolerance && rgb.b >= -tolerance && rgb.b <= 1 + tolerance;
    }

    // Gamut mapping preserves target lightness and hue. It only lowers chroma;
    // independent RGB-channel clipping is never used for generated targets.
    function gamutMapOklch(target) {
      if (isInSrgbGamut(target)) {
        const rgb = linearRgbToSrgb(oklabToLinearRgb(oklchToOklab(target)));
        return { hex: rgbToHex(rgb), rgb, target, inGamut: true };
      }
      let low = 0;
      let high = target.C;
      let chosen = { ...target, C: 0 };
      for (let iteration = 0; iteration < 20; iteration += 1) {
        const chroma = (low + high) / 2;
        const candidate = { ...target, C: chroma };
        if (isInSrgbGamut(candidate)) { chosen = candidate; low = chroma; } else { high = chroma; }
      }
      const rgb = linearRgbToSrgb(oklabToLinearRgb(oklchToOklab(chosen)));
      return { hex: rgbToHex(rgb), rgb, target: chosen, inGamut: true };
    }

    function colorFromHex(hex) {
      const normalized = hex.toUpperCase();
      const rgb = hexToRgb(normalized);
      return { hex: normalized, rgb, target: oklabToOklch(srgbToOklab(rgb)), inGamut: true };
    }

    function oklchFromHex(hex) { return oklabToOklch(srgbToOklab(hexToRgb(hex))); }
    function oklabDistance(left, right) {
      const a = oklchToOklab(left);
      const b = oklchToOklab(right);
      return Math.hypot(a.L - b.L, a.a - b.a, a.b - b.b);
    }

    function familyForHue(hue) {
      const degrees = normalizeHue(hue) / DEGREE;
      if (degrees < 25) return 'red';
      if (degrees < 53) return 'orange';
      if (degrees < 78) return 'amber';
      if (degrees < 112) return 'yellow';
      if (degrees < 135) return 'lime';
      if (degrees < 153) return 'green';
      if (degrees < 173) return 'emerald';
      if (degrees < 197) return 'teal';
      if (degrees < 219) return 'cyan';
      if (degrees < 238) return 'azure';
      if (degrees < 258) return 'blue';
      if (degrees < 283) return 'indigo';
      if (degrees < 294) return 'violet';
      if (degrees < 307) return 'purple';
      if (degrees < 328) return 'magenta';
      return 'pink';
    }

    function spectralLightnesses(canonicalL, rule) {
      const headroom = Math.max(.028, .982 - canonicalL);
      const leadEnd = canonicalL + clamp(headroom * .32, .018, .064);
      const leadStart = canonicalL + clamp(headroom * .88, .062, .23);
      const leadProgress = [0, .21, .48, .72, 1];
      const lead = leadProgress.map((progress) => leadStart - (leadStart - leadEnd) * progress);
      let terminal = Math.max(rule.terminalFloor, canonicalL - rule.tailDrop);
      terminal = Math.min(terminal, canonicalL - .022);
      const tailProgress = [.30, .66, 1];
      const tail = tailProgress.map((progress) => canonicalL - (canonicalL - terminal) * progress);
      return { lead, tail };
    }

    function spectralChroma(canonicalC) {
      return {
        lead: [.18, .52, .78, .92, .98].map((ratio) => Math.max(.016, canonicalC * ratio)),
        tail: [1.03, 1.00, .94].map((ratio) => Math.max(.018, canonicalC * ratio)),
      };
    }

    function makeDirections(rule, leadDegrees, tailDegrees) {
      return {
        lead: rule.direction * leadDegrees * DEGREE,
        tail: -rule.direction * tailDegrees * DEGREE,
        advance: -rule.direction,
        span: leadDegrees + tailDegrees,
      };
    }

    function leadHueProgress(index) { return [0, .18, .42, .66, .86][index]; }
    function tailHueProgress(index) { return [.38, .72, 1][index]; }

    function spectralSlots(canonical, rule, directions) {
      const lightness = spectralLightnesses(canonical.L, rule);
      const chroma = spectralChroma(canonical.C);
      const slots = [colorFromHex('#FFFFFF')];
      for (let index = 0; index < 5; index += 1) {
        const progress = leadHueProgress(index);
        slots.push(gamutMapOklch({
          L: lightness.lead[index],
          C: chroma.lead[index],
          H: normalizeHue(canonical.H + directions.lead * (1 - progress)),
        }));
      }
      slots.push(null); // Exact source canonical identity is assigned by the caller.
      for (let index = 0; index < 3; index += 1) {
        slots.push(gamutMapOklch({
          L: lightness.tail[index],
          C: chroma.tail[index] * (index === 2 ? rule.tailChroma : 1),
          H: normalizeHue(canonical.H + directions.tail * tailHueProgress(index)),
        }));
      }
      return slots;
    }

    // The CSS source has tiny quantization jitters in its otherwise increasing
    // Cool hue path. Its L/C rhythm remains exact; hue is isotonicized once so
    // the rotated candidate obeys the lab's no-zig-zag contract.
    function coolTemplate() {
      const source = COOL_SOURCE_STOPS.map(oklchFromHex);
      const pivot = source[6];
      const offsets = source.map((point, index) => (
        index === 0 ? 0 : shortestHueDelta(pivot.H, point.H)
      ));
      offsets[0] = offsets[1];
      for (let index = 2; index < offsets.length; index += 1) {
        offsets[index] = Math.max(offsets[index], offsets[index - 1]);
      }
      return { source, pivot, offsets };
    }

    const COOL_TEMPLATE = coolTemplate();

    function coolDensitySlots(canonical) {
      const { source: cool, pivot: coolCanonical, offsets } = COOL_TEMPLATE;
      const rule = FAMILY_RULES[familyForHue(canonical.H)];
      const maxLeadScale = Math.max(.05, (.982 - canonical.L) / (cool[0].L - coolCanonical.L));
      const maxTailScale = Math.max(.05, (canonical.L - rule.terminalFloor) / (coolCanonical.L - cool[9].L));
      const leadScale = Math.min(1, maxLeadScale);
      const tailScale = Math.min(1, maxTailScale);
      const slots = [];
      for (let index = 0; index < 10; index += 1) {
        if (index === 0) { slots.push(colorFromHex('#FFFFFF')); continue; }
        if (index === 6) { slots.push(null); continue; }
        const source = cool[index];
        const lightnessScale = index < 6 ? leadScale : tailScale;
        slots.push(gamutMapOklch({
          L: canonical.L + (source.L - coolCanonical.L) * lightnessScale,
          C: canonical.C * (source.C / Math.max(.0001, coolCanonical.C)),
          H: normalizeHue(canonical.H + offsets[index]),
        }));
      }
      return {
        slots,
        directions: {
          lead: offsets[1],
          tail: offsets[9],
          advance: 1,
          span: (offsets[9] - offsets[1]) / DEGREE,
        },
      };
    }

    function generateVariation(category, variation) {
      const canonical = oklchFromHex(category.middleColor);
      const family = familyForHue(canonical.H);
      const rule = FAMILY_RULES[family];
      let slots;
      let directions;
      if (variation.kind === 'cool') {
        const cool = coolDensitySlots(canonical);
        slots = cool.slots;
        directions = cool.directions;
      } else {
        directions = variation.kind === 'family'
          ? makeDirections(rule, rule.lead, rule.tail)
          : makeDirections(rule, variation.lead, variation.tail);
        slots = spectralSlots(canonical, rule, directions);
      }
      slots[6] = colorFromHex(category.middleColor);
      return { id: variation.id, label: variation.label, variation, category, family, canonical, directions, slots };
    }

    function paletteLch(result) { return result.slots.map((slot) => oklchFromHex(slot.hex)); }

    function samplePalette(slots, percent) {
      const position = clamp(percent, 0, 100) / 100 * (slots.length - 1);
      const left = Math.floor(position);
      const right = Math.min(slots.length - 1, left + 1);
      const amount = position - left;
      const a = oklchToOklab(oklchFromHex(slots[left].hex));
      const b = oklchToOklab(oklchFromHex(slots[right].hex));
      const mixed = {
        L: a.L + (b.L - a.L) * amount,
        a: a.a + (b.a - a.a) * amount,
        b: a.b + (b.b - a.b) * amount,
      };
      const lch = oklabToOklch(mixed);
      return gamutMapOklch(lch);
    }

    function windowEvidence(slots) {
      return WINDOW_CENTERS.map((center) => {
        const left = center - WINDOW_WIDTH_PERCENT / 2;
        const right = center + WINDOW_WIDTH_PERCENT / 2;
        const colorA = samplePalette(slots, left);
        const colorB = samplePalette(slots, right);
        return {
          center, left, right, colorA, colorB,
          delta: oklabDistance(oklchFromHex(colorA.hex), oklchFromHex(colorB.hex)),
        };
      });
    }

    function countHueBacktracks(values, directions) {
      let failures = 0;
      const expected = directions.advance;
      for (let index = 2; index < values.length; index += 1) {
        if (values[index - 1].C < .018 || values[index].C < .018) continue;
        const delta = shortestHueDelta(values[index - 1].H, values[index].H);
        if (Math.abs(delta) > .012 && Math.sign(delta) !== expected) failures += 1;
      }
      return failures;
    }

    function validatePalette(result) {
      const values = paletteLch(result);
      const hexes = result.slots.map((slot) => slot.hex);
      const lightnessFailures = values.reduce((count, value, index) => (
        index && !(values[index - 1].L > value.L + EPSILON) ? count + 1 : count
      ), 0);
      const canonicalFailures = hexes[6] !== result.category.middleColor.toUpperCase() ? 1 : 0;
      const duplicateSlots = hexes.length - new Set(hexes).size;
      return {
        values,
        lightnessFailures,
        canonicalFailures,
        duplicateSlots,
        hueBacktracks: countHueBacktracks(result.slots.map((slot) => slot.target), result.directions),
        gamutFailures: result.slots.filter((slot) => !slot.inGamut).length,
        hueSpan: result.directions.span,
        windows: windowEvidence(result.slots),
      };
    }

    function paletteDistance(left, right) {
      return left.slots.reduce((sum, slot, index) => (
        sum + oklabDistance(oklchFromHex(slot.hex), oklchFromHex(right.slots[index].hex))
      ), 0) / left.slots.length;
    }

    function validateCollection(results) {
      const totals = {
        categories: CATEGORIES.length,
        variations: VARIATIONS.length,
        rows: results.length,
        swatches: results.length * 10,
        lightnessFailures: 0,
        canonicalFailures: 0,
        duplicateSlotFailures: 0,
        duplicatePaletteFailures: 0,
        hueBacktrackFailures: 0,
        gamutFailures: 0,
        spectralSpanFailures: 0,
        interVariationFailures: 0,
      };
      const byVariation = new Map(VARIATIONS.map((variation) => [variation.id, []]));
      const byCategory = new Map(CATEGORIES.map((category) => [category.id, []]));
      for (const result of results) {
        result.metrics = validatePalette(result);
        const metrics = result.metrics;
        totals.lightnessFailures += metrics.lightnessFailures;
        totals.canonicalFailures += metrics.canonicalFailures;
        totals.duplicateSlotFailures += metrics.duplicateSlots;
        totals.hueBacktrackFailures += metrics.hueBacktracks;
        totals.gamutFailures += metrics.gamutFailures;
        byVariation.get(result.id).push(result);
        byCategory.get(result.category.id).push(result);
      }
      for (const [variationId, rows] of byVariation) {
        const palettes = new Map();
        const nonWhiteSlots = new Map();
        for (const row of rows) {
          const key = row.slots.map((slot) => slot.hex).join('|');
          if (palettes.has(key)) totals.duplicatePaletteFailures += 1;
          palettes.set(key, row.category.id);
          for (const slot of row.slots.slice(1)) {
            if (nonWhiteSlots.has(slot.hex) && nonWhiteSlots.get(slot.hex) !== row.category.id) {
              totals.duplicateSlotFailures += 1;
            }
            nonWhiteSlots.set(slot.hex, row.category.id);
          }
        }
        if (palettes.size !== rows.length) console.error('Duplicate row in', variationId);
      }
      for (const rows of byCategory.values()) {
        const spans = rows.slice(0, 3).map((row) => row.metrics.hueSpan);
        if (!(spans[0] === 40 && spans[1] === 60 && spans[2] === 80)) totals.spectralSpanFailures += 1;
        const deltas = [paletteDistance(rows[0], rows[1]), paletteDistance(rows[1], rows[2])];
        if (deltas.some((delta) => delta < .006)) totals.interVariationFailures += 1;
      }
      return totals;
    }

    function assertSelfCheck(condition, details) {
      if (!condition) throw new Error(details);
    }

    function runSelfChecks(results) {
      const totals = validateCollection(results);
      const duplicate = { ...results[0], slots: Array.from({ length: 10 }, () => colorFromHex('#FFFFFF')) };
      assertSelfCheck(validatePalette(duplicate).duplicateSlots > 0, 'Duplicated candidate was not rejected.');

      const wrongCanonical = { ...results[0], slots: [...results[0].slots] };
      wrongCanonical.slots[6] = colorFromHex('#000000');
      assertSelfCheck(validatePalette(wrongCanonical).canonicalFailures === 1, 'Wrong canonical slot was not rejected.');

      const zigZag = [
        { H: .1, C: .05 }, { H: .2, C: .07 }, { H: .1, C: .09 }, { H: .3, C: .1 },
        { H: .4, C: .1 }, { H: .5, C: .1 }, { H: .6, C: .1 }, { H: .7, C: .1 },
        { H: .8, C: .1 }, { H: .9, C: .1 },
      ].map((value, index) => ({ ...value, L: 1 - index * .06 }));
      assertSelfCheck(countHueBacktracks(zigZag, { advance: 1 }) > 0, 'Hue zig-zag was not rejected.');

      const mapped = gamutMapOklch({ L: .62, C: .72, H: .06 });
      const mappedLch = oklchFromHex(mapped.hex);
      assertSelfCheck(isInSrgbGamut(mapped.target), 'Out-of-gamut target was not chroma-mapped.');
      assertSelfCheck(Math.abs(mappedLch.L - .62) < .006, 'Gamut mapping changed lightness.');
      assertSelfCheck(Math.abs(shortestHueDelta(mappedLch.H, .06)) < .035, 'Gamut mapping changed hue.');

      const failures = totals.lightnessFailures + totals.canonicalFailures + totals.duplicateSlotFailures
        + totals.duplicatePaletteFailures + totals.hueBacktrackFailures + totals.gamutFailures
        + totals.spectralSpanFailures + totals.interVariationFailures;
      if (failures) console.error('Fluvi palette lab invariant failure', totals);
      console.log(
        `Fluvi palette lab categories=${totals.categories} variationsPerCategory=${totals.variations} `
        + `rows=${totals.rows} swatches=${totals.swatches} lightnessFailures=${totals.lightnessFailures} `
        + `canonicalFailures=${totals.canonicalFailures} duplicateSlotFailures=${totals.duplicateSlotFailures} `
        + `duplicatePaletteFailures=${totals.duplicatePaletteFailures} hueBacktrackFailures=${totals.hueBacktrackFailures} `
        + `gamutFailures=${totals.gamutFailures} spectralSpanFailures=${totals.spectralSpanFailures} `
        + `interVariationFailures=${totals.interVariationFailures}`,
      );
      return { totals, failures };
    }

    function renderSlots(slots, category, label) {
      const grid = document.createElement('div');
      grid.className = 'slot-grid';
      slots.forEach((slot, index) => {
        const button = document.createElement('button');
        button.className = `slot${index === 6 ? ' is-canonical' : ''}`;
        button.type = 'button';
        button.title = `${category} ${label}, slot ${index + 1}: ${slot.hex}`;
        button.setAttribute('aria-label', `${category}, ${label}, slot ${index + 1}, ${slot.hex}${index === 6 ? ', canonical identity' : ''}`);
        const number = document.createElement('span');
        number.className = 'slot-number';
        number.textContent = String(index + 1);
        const color = document.createElement('span');
        color.className = 'slot-color';
        color.style.backgroundColor = slot.hex;
        button.append(number, color);
        button.addEventListener('click', () => showToast(slot.hex));
        grid.append(button);
      });
      return grid;
    }

    function renderWindowEvidence(slots, evidence) {
      const root = document.createElement('div');
      root.className = 'window-evidence';
      for (const item of evidence) {
        const line = document.createElement('div');
        line.className = 'window-line';
        const label = document.createElement('span');
        label.className = 'window-label';
        label.textContent = String(item.center);
        const track = document.createElement('div');
        track.className = 'window-track';
        slots.forEach((slot) => {
          const segment = document.createElement('span');
          segment.className = 'window-track-segment';
          segment.style.backgroundColor = slot.hex;
          track.append(segment);
        });
        const outline = document.createElement('span');
        outline.className = 'window-outline';
        outline.style.left = `${item.left}%`;
        outline.style.width = `${WINDOW_WIDTH_PERCENT}%`;
        outline.title = `${WINDOW_WIDTH_PERCENT}% window: ${item.colorA.hex} → ${item.colorB.hex}`;
        track.append(outline);
        const chips = document.createElement('span');
        chips.className = 'ab-chips';
        for (const color of [item.colorA, item.colorB]) {
          const chip = document.createElement('span');
          chip.className = 'ab-chip';
          chip.style.backgroundColor = color.hex;
          chip.title = color.hex;
          chips.append(chip);
        }
        line.append(label, track, chips);
        root.append(line);
      }
      return root;
    }

    function renderReference() {
      const reference = document.createElement('section');
      reference.className = 'reference-block';
      const title = document.createElement('div');
      title.className = 'reference-title';
      title.textContent = 'REFERENCE · COLOR LAB COOL';
      const slots = COOL_SOURCE_STOPS.map(colorFromHex);
      reference.append(title, renderSlots(slots, 'Color Lab Cool', 'source'), renderWindowEvidence(slots, windowEvidence(slots)));
      return reference;
    }

    function renderCategoryBlock(category, rows) {
      const block = document.createElement('section');
      block.className = 'category-block';
      block.dataset.categoryId = category.id;
      const anchor = document.createElement('aside');
      anchor.className = 'category-anchor';
      const swatch = document.createElement('div');
      swatch.className = 'canonical-swatch';
      swatch.style.backgroundColor = category.middleColor;
      const id = document.createElement('div');
      id.className = 'category-id';
      id.textContent = category.id;
      const hex = document.createElement('div');
      hex.className = 'canonical-hex';
      hex.textContent = category.middleColor;
      anchor.append(swatch, id, hex);

      const stack = document.createElement('div');
      stack.className = 'variation-stack';
      for (const result of rows) {
        const row = document.createElement('div');
        row.className = 'variation-row';
        const meta = document.createElement('div');
        meta.className = 'variation-meta';
        const label = document.createElement('span');
        label.className = 'variation-label';
        label.textContent = result.label;
        const metrics = document.createElement('span');
        metrics.className = 'variation-metrics';
        metrics.textContent = `H ${result.metrics.hueSpan.toFixed(0)}° · 28Δ ${result.metrics.windows[1].delta.toFixed(2)}`;
        meta.append(label, metrics);
        row.append(meta, renderSlots(result.slots, result.category.id, result.label), renderWindowEvidence(result.slots, result.metrics.windows));
        stack.append(row);
      }
      block.append(anchor, stack);
      return block;
    }

    let toastTimer = 0;
    function showToast(hex) {
      const toast = document.getElementById('toast');
      toast.textContent = hex;
      toast.classList.add('is-visible');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1100);
    }

    function renderLab(results) {
      const root = document.getElementById('palette-lab');
      const byCategory = new Map(CATEGORIES.map((category) => [category.id, []]));
      for (const result of results) byCategory.get(result.category.id).push(result);
      const fragment = document.createDocumentFragment();
      fragment.append(renderReference());
      for (const category of CATEGORIES) fragment.append(renderCategoryBlock(category, byCategory.get(category.id)));
      root.replaceChildren(fragment);
    }

    const RESULTS = CATEGORIES.flatMap((category) => VARIATIONS.map((variation) => generateVariation(category, variation)));
    const SELF_CHECK = runSelfChecks(RESULTS);
    renderLab(RESULTS);
    if (SELF_CHECK.failures) console.error('Fluvi palette lab rendered with invariant failures.');
  </script>
</body>
</html>
