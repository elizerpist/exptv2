<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapshot mód · Common stat</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f8fafc;
      --income: #22c55e;
      --income-dark: #059669;
      --expense: #ef4444;
      --expense-dark: #dc2626;
      --warn: #f59e0b;
      --accent: #0ea5a4;
      --shadow: 0 12px 28px rgba(15, 23, 42, .12);
      --active: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 0%, rgba(14, 165, 164, .08), transparent 32%),
        linear-gradient(180deg, #eef2f7 0%, #f8fafc 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .phone {
      width: min(100vw, 430px);
      height: min(100vh, 920px);
      min-height: 760px;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid rgba(15, 23, 42, .08);
      box-shadow: 0 28px 80px rgba(15, 23, 42, .24);
    }

    .fastinfo {
      height: 156px;
      padding: 14px 16px 0;
    }

    .fast-card {
      height: 100%;
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 14px 16px 12px;
      position: relative;
      overflow: hidden;
    }

    .fast-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #374151;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .fast-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--active);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .fast-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--active);
    }

    .chart {
      margin-top: 14px;
      height: 92px;
      position: relative;
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(34, 197, 94, .10), transparent 45%),
        linear-gradient(0deg, rgba(239, 68, 68, .10), transparent 48%),
        repeating-linear-gradient(0deg, transparent 0 29px, rgba(148, 163, 184, .25) 30px);
      overflow: hidden;
    }

    .chart::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px solid rgba(249, 115, 22, .65);
    }

    .bars {
      position: absolute;
      inset: 14px 12px 18px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: end;
      gap: 8px;
    }

    .bar {
      min-width: 0;
      height: var(--h);
      border-radius: 4px 4px 0 0;
      background: var(--c);
      opacity: var(--o);
      align-self: end;
    }

    .bar.down {
      align-self: start;
      border-radius: 0 0 4px 4px;
    }

    .header {
      height: 128px;
      margin: 12px 16px 0;
      background: #111827;
      color: #fff;
      border-radius: 18px;
      box-shadow: 0 14px 28px rgba(17, 24, 39, .25);
      padding: 14px 16px 16px;
      position: relative;
    }

    .app-title {
      font-size: 14px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .magnet {
      position: absolute;
      left: 16px;
      right: 88px;
      top: 48px;
      height: 16px;
    }

    .magnet-rail {
      height: 7px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--expense), var(--warn), var(--income));
      box-shadow: inset 0 1px 2px rgba(255,255,255,.28);
    }

    .magnet-marker {
      position: absolute;
      top: -4px;
      left: var(--score-left, 62%);
      width: 4px;
      height: 17px;
      border-radius: 99px;
      background: var(--active);
      box-shadow: 0 0 0 3px rgba(255,255,255,.86), 0 4px 10px rgba(0,0,0,.28);
      transform: translateX(-50%);
    }

    .scope-chip {
      position: absolute;
      right: 16px;
      top: 42px;
      min-width: 54px;
      height: 28px;
      border-radius: 14px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 12px;
      font-weight: 850;
    }

    .header-label {
      position: absolute;
      left: 16px;
      top: 78px;
      color: rgba(255,255,255,.72);
      font-size: 10px;
      font-weight: 800;
    }

    .header-value {
      position: absolute;
      left: 16px;
      bottom: 13px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0;
      color: var(--active);
    }

    .snapshot-mode-pill {
      position: absolute;
      right: 16px;
      bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.9);
      font-size: 11px;
      font-weight: 850;
    }

    .snapshot-mode-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--active);
      box-shadow: 0 0 0 3px rgba(255,255,255,.12);
    }

    .type-row,
    .summary-pill,
    .search-pill,
    .content-viewport {
      margin-left: 16px;
      margin-right: 16px;
    }

    .type-row {
      height: 42px;
      margin-top: 13px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .type-row button {
      border-radius: 21px;
      color: #374151;
      background: #fff;
      box-shadow: 0 6px 14px rgba(15, 23, 42, .08);
      font-size: 13px;
      font-weight: 850;
    }

    .type-row button.active {
      color: #fff;
      background: var(--active);
    }

    .summary-pill {
      height: 44px;
      margin-top: 10px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 7px 16px rgba(15, 23, 42, .08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .summary-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .summary-value {
      color: var(--active);
      font-size: 15px;
      font-weight: 900;
    }

    .search-pill {
      height: 44px;
      margin-top: 10px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 7px 16px rgba(15, 23, 42, .08);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      overflow: hidden;
    }

    .search-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .filter-capsules {
      display: flex;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-capsules::-webkit-scrollbar { display: none; }

    .capsule {
      flex: 0 0 auto;
      max-width: 128px;
      height: 26px;
      padding: 0 9px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      background: var(--capsule-color, var(--active));
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .capsule span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 34px;
      height: 28px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: #374151;
      border: 1px solid var(--line);
      font-weight: 900;
    }

    .sheet-title {
      min-width: 0;
    }

    .sheet-title strong {
      display: block;
      font-size: 12px;
      font-weight: 900;
      color: #374151;
      line-height: 1;
    }

    .sheet-title span {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 750;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .save-btn {
      width: 34px;
      height: 28px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--active);
      color: #fff;
      font-size: 18px;
      font-weight: 850;
      box-shadow: 0 5px 12px color-mix(in srgb, var(--active), transparent 70%);
    }

    .snapshot-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 1px;
    }

    .snapshot-strip::-webkit-scrollbar { display: none; }

    .snapshot-card {
      flex: 0 0 134px;
      border: 1px solid var(--line);
      background: #f9fafb;
      border-radius: 12px;
      padding: 9px 10px;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .snapshot-card.active {
      border-color: var(--active);
      background: color-mix(in srgb, var(--active), white 92%);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--active), white 34%);
    }

    .snapshot-card.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--active);
    }

    .save-snapshot-card {
      border-style: dashed;
      border-color: color-mix(in srgb, var(--active), white 28%);
      background: color-mix(in srgb, var(--active), white 93%);
    }

    .camera-icon {
      display: inline-block;
      margin-right: 5px;
      transform: translateY(-1px);
    }

    .snap-name {
      padding-left: 2px;
      color: #111827;
      font-size: 12px;
      line-height: 1.1;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .snap-meta {
      padding-left: 2px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 750;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .content-viewport {
      position: absolute;
      left: 0;
      right: 0;
      top: 477px;
      bottom: 78px;
      overflow: hidden;
      border-radius: 18px;
    }

    .page {
      position: absolute;
      inset: 0;
      display: none;
      overflow-y: auto;
      padding-bottom: 18px;
      scrollbar-width: none;
    }

    .page::-webkit-scrollbar { display: none; }

    .page.active { display: block; }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding-bottom: 4px;
    }

    .month-card {
      min-width: 0;
      height: 126px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px rgba(15, 23, 42, .08);
      padding: 10px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 5px;
    }

    .month-card.focused {
      height: 238px;
      border-color: var(--active);
    }

    .month-name {
      color: #374151;
      font-size: 12px;
      font-weight: 900;
    }

    .month-money {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .month-money strong {
      color: var(--active);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .month-money span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      align-content: end;
    }

    .day {
      aspect-ratio: 1;
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: #64748b;
      font-size: 8px;
      font-weight: 800;
      background: #f8fafc;
    }

    .day.hit {
      color: #fff;
      background: var(--active);
      opacity: var(--heat);
    }

    .focus-top {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 7px 16px rgba(15, 23, 42, .10);
      color: #374151;
      font-size: 18px;
      font-weight: 900;
    }

    .focus-title {
      min-width: 0;
    }

    .focus-title strong {
      display: block;
      color: #111827;
      font-size: 13px;
      font-weight: 900;
    }

    .focus-title span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .summary-page {
      display: grid;
      gap: 10px;
    }

    .warning {
      min-height: 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 11px;
      font-weight: 850;
    }

    .warning.hidden { display: none; }

    .warning-icon {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 15px solid var(--warn);
      position: relative;
      flex: 0 0 auto;
    }

    .warning-icon::after {
      content: "!";
      position: absolute;
      left: -2px;
      top: 3px;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .stat-box,
    .panel {
      min-width: 0;
      border-radius: 13px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px rgba(15, 23, 42, .08);
    }

    .stat-box {
      min-height: 78px;
      padding: 11px;
    }

    .stat-box.primary {
      min-height: 96px;
      border-color: color-mix(in srgb, var(--active), white 55%);
      background: color-mix(in srgb, var(--active), white 94%);
    }

    .stat-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .stat-value {
      margin-top: 9px;
      color: #111827;
      font-size: 16px;
      font-weight: 950;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .stat-sub {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
    }

    .panel {
      padding: 13px;
    }

    .panel-title {
      color: #374151;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .progress-list,
    .category-list {
      display: grid;
      gap: 9px;
    }

    .progress-head,
    .category-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #374151;
      font-size: 11px;
      font-weight: 850;
    }

    .progress-track {
      height: 7px;
      border-radius: 99px;
      background: #f1f5f9;
      margin-top: 5px;
      overflow: hidden;
    }

    .progress-fill {
      width: var(--p);
      height: 100%;
      border-radius: inherit;
      background: var(--color);
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 66px;
      background: rgba(255,255,255,.92);
      border-top: 1px solid rgba(15,23,42,.08);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 0 18px;
      backdrop-filter: blur(14px);
    }

    .nav-item {
      text-align: center;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 850;
    }

    .nav-item.active {
      color: var(--active);
    }

    .fab {
      position: absolute;
      right: 20px;
      bottom: 80px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--active);
      color: #fff;
      box-shadow: 0 10px 22px color-mix(in srgb, var(--active), transparent 58%);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
      z-index: 4;
      touch-action: none;
      user-select: none;
      transition: transform .08s ease, box-shadow .12s ease;
    }

    .fab.dragging {
      transform: scale(1.04);
      box-shadow: 0 12px 28px color-mix(in srgb, var(--active), transparent 46%);
    }

    .tick-feedback {
      position: absolute;
      right: 86px;
      bottom: 93px;
      min-width: 42px;
      height: 30px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: #111827;
      color: #fff;
      font-size: 14px;
      font-weight: 950;
      opacity: 0;
      transform: translateX(0) scale(.92);
      pointer-events: none;
      z-index: 5;
      transition: opacity .08s ease, transform .12s ease;
    }

    .tick-feedback.show {
      opacity: 1;
      transform: translateX(var(--tick-x, 0)) scale(1);
    }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 292px;
      border-radius: 28px 28px 0 0;
      background: #f8fafc;
      box-shadow: 0 -20px 50px rgba(15, 23, 42, .22);
      padding: 12px 20px 22px;
      transform: translateY(105%);
      transition: transform .22s ease;
      z-index: 8;
    }

    .sheet.open {
      transform: translateY(0);
    }

    .grabber {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: #d1d5db;
      margin: 0 auto 20px;
    }

    .snapshot-editor {
      margin-bottom: 14px;
    }

    .snapshot-editor-head {
      margin-bottom: 9px;
    }

    .sheet-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #111827;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--active);
    }

    .input-pill {
      height: 48px;
      margin-top: 12px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }

    .input-pill input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      text-align: center;
      color: #111827;
      font-size: 16px;
      font-weight: 900;
    }

    .input-pill span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
    }
  </style>
</head>
<body>
  <main class="phone" id="app">
    <section class="fastinfo">
      <div class="fast-card">
        <div class="fast-title">
          <span id="fastTitle">1. Szűrés pontszám</span>
          <span class="fast-badge" id="fastBadge">Mentett nézet aktív</span>
        </div>
        <div class="chart" aria-label="snapshot gyorsgrafikon">
          <div class="bars" id="chartBars"></div>
        </div>
      </div>
    </section>

    <header class="header">
      <div class="app-title">Pénzfigyelő</div>
      <div class="magnet">
        <div class="magnet-rail"></div>
        <div class="magnet-marker" id="magnetMarker"></div>
      </div>
      <button class="scope-chip" id="scopeChip" type="button">MIND</button>
      <div class="header-label">SZŰRÉS PONTSZÁM</div>
      <div class="header-value" id="headerValue">62/100</div>
      <div class="snapshot-mode-pill">Snapshot mód</div>
    </header>

    <section class="type-row">
      <button id="incomeBtn" type="button">Bevétel</button>
      <button id="expenseBtn" class="active" type="button">Kiadás</button>
    </section>

    <section class="summary-pill">
      <div class="summary-title" id="summaryTitle">Összegzés · Éves · 2025 · Kiadás</div>
      <div class="summary-value" id="summaryValue">3.1M Ft</div>
    </section>

    <section class="search-pill">
      <div class="search-icon" aria-hidden="true">⌕</div>
      <div class="filter-capsules" id="filterCapsules">
        <div class="capsule"><span>Keresés vagy vendor</span></div>
      </div>
    </section>

    <section class="content-viewport">
      <section class="page active" id="pageOne" aria-label="Page 1 snapshot tartalom"></section>
      <section class="page" id="pageTwo" aria-label="Page 2 snapshot tartalom"></section>
    </section>

    <button class="fab" id="thresholdFab" type="button" aria-label="Küszöb és snapshot joystick">≋</button>
    <div class="tick-feedback" id="tickFeedback" aria-hidden="true">tick</div>

    <nav class="bottom-nav" aria-label="alsó navigáció">
      <div class="nav-item">Home</div>
      <div class="nav-item active">Stat</div>
      <div class="nav-item">Push</div>
      <div class="nav-item">Beállítás</div>
    </nav>

    <section class="sheet" id="thresholdSheet" aria-label="küszöb sheet">
      <div class="grabber"></div>
      <section class="snapshot-editor">
        <div class="snapshot-editor-head">
          <div class="sheet-title">
            <strong>Mentett nézetek</strong>
            <span id="activeSnapshotText">Swipe a snapshotok között, tap a betöltéshez</span>
          </div>
        </div>
        <div class="snapshot-strip" id="snapshotStrip"></div>
      </section>
      <div class="sheet-row">
        <span>Küszöb</span>
        <span id="thresholdLabel">0 Ft</span>
      </div>
      <input id="thresholdSlider" type="range" min="0" max="250000" step="5000" value="0">
      <label class="input-pill">
        <input id="thresholdManual" inputmode="numeric" value="0">
        <span>Ft</span>
      </label>
    </section>
  </main>

  <script>
    const colors = {
      income: '#22c55e',
      incomeDark: '#059669',
      expense: '#ef4444',
      expenseDark: '#dc2626',
      warn: '#f59e0b',
      accent: '#0ea5a4',
      food: '#f97316',
      home: '#8b5cf6',
      mobility: '#0ea5e9',
      salary: '#22c55e',
      side: '#f59e0b',
    };

    const monthNames = ['Január', 'Február', 'Március', 'Április', 'Május', 'Június', 'Július', 'Augusztus', 'Szeptember', 'Október', 'November', 'December'];
    const monthShort = ['Jan', 'Feb', 'Már', 'Ápr', 'Máj', 'Jún', 'Júl', 'Aug', 'Szep', 'Okt', 'Nov', 'Dec'];

    const snapshots = [
      {
        id: 'food-alert',
        name: 'Étel kontroll',
        type: 'expense',
        threshold: 15000,
        page: 1,
        scope: 'year',
        month: null,
        categories: ['Étel'],
        vendors: ['Tesco', 'Lidl'],
        score: 38,
        summary: 890000,
        color: colors.food,
        bars: [34, 45, -28, -54, 38, 22, -42],
      },
      {
        id: 'home-year',
        name: 'Lakás éves',
        type: 'expense',
        threshold: 50000,
        page: 2,
        scope: 'year',
        month: null,
        categories: ['Lakás'],
        vendors: ['E.ON', 'Közös költség'],
        score: 58,
        summary: 1420000,
        color: colors.home,
        bars: [18, 25, 32, -12, 44, 38, 50],
      },
      {
        id: 'income-main',
        name: 'Főbevétel',
        type: 'income',
        threshold: 300000,
        page: 1,
        scope: 'year',
        month: null,
        categories: ['Fizetés'],
        vendors: ['Munkáltatói utalás'],
        score: 71,
        summary: 5480000,
        color: colors.income,
        bars: [45, 52, 47, 61, 58, 67, 72],
      },
      {
        id: 'june-focus',
        name: 'Június fókusz',
        type: 'expense',
        threshold: 10000,
        page: 2,
        scope: 'month',
        month: 5,
        categories: ['Étel', 'Mozgás'],
        vendors: ['BKK', 'Lidl'],
        score: 46,
        summary: 455000,
        color: colors.accent,
        bars: [-22, 18, -35, 25, 32, -18, 20],
      },
    ];

    let activeIndex = 0;
    let state = {...snapshots[0]};
    const joystickStepThreshold = 42;
    let joystickDrag = null;
    let tickTimer = null;
    let suppressNextFabClick = false;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function formatCompactHuf(value) {
      const amount = Math.abs(value);
      if (amount >= 1000000) {
        const scaled = amount / 1000000;
        return `${scaled % 1 === 0 ? scaled.toFixed(0) : scaled.toFixed(1)}M Ft`;
      }
      return `${Math.round(amount / 1000)}k Ft`;
    }

    function formatHuf(value) {
      return `${String(Math.round(Math.abs(value))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')} Ft`;
    }

    function scoreColor(score) {
      if (score < 45) return colors.expense;
      if (score < 60) return colors.warn;
      return colors.income;
    }

    function activeTypeLabel() {
      return state.type === 'income' ? 'Bevétel' : 'Kiadás';
    }

    function snapshotMeta(snapshot) {
      const period = snapshot.scope === 'month' ? `${monthNames[snapshot.month]} · havi` : 'Éves · 2025';
      const category = snapshot.categories.length > 1 ? `${snapshot.categories.length} kategória` : snapshot.categories[0] || 'Minden kategória';
      const vendor = snapshot.vendors.length > 1 ? `${snapshot.vendors.length} vendor` : snapshot.vendors[0] || 'Minden vendor';
      return `${period} · ${category} · ${vendor} · ${formatCompactHuf(snapshot.threshold)} küszöb`;
    }

    function renderSnapshotStrip() {
      const strip = document.getElementById('snapshotStrip');
      const saveCard = `
        <button
          class="snapshot-card save-snapshot-card"
          type="button"
          data-save-snapshot
          aria-label="Aktuális mentése"
          style="--active:${scoreColor(state.score)}"
        >
          <div class="snap-name"><span class="camera-icon" aria-hidden="true">📷</span> Aktuális mentése</div>
          <div class="snap-meta">Új snapshot kártya a mostani szűrésből</div>
        </button>
      `;
      strip.innerHTML = saveCard + snapshots.map((snapshot, index) => `
        <button
          class="snapshot-card${index === activeIndex ? ' active' : ''}"
          type="button"
          data-snapshot-id="${snapshot.id}"
          style="--active:${snapshot.color}"
        >
          <div class="snap-name">${snapshot.name}</div>
          <div class="snap-meta">${snapshotMeta(snapshot)}</div>
        </button>
      `).join('');
      strip.querySelector('[data-save-snapshot]').addEventListener('click', saveCurrentSnapshot);
      strip.querySelectorAll('[data-snapshot-id]').forEach(button => {
        button.addEventListener('click', () => {
          const index = snapshots.findIndex(item => item.id === button.dataset.snapshotId);
          if (index >= 0) applySnapshot(index);
        });
      });
    }

    function renderHeader() {
      const active = scoreColor(state.score);
      document.documentElement.style.setProperty('--active', active);
      document.getElementById('magnetMarker').style.setProperty('--score-left', `${clamp(state.score, 0, 100)}%`);
      document.getElementById('headerValue').textContent = `${Math.round(state.score)}/100`;
      document.getElementById('scopeChip').textContent = state.categories.length > 1 ? `${state.categories.length}` : state.categories[0]?.slice(0, 4).toUpperCase() || 'MIND';
      document.getElementById('incomeBtn').classList.toggle('active', state.type === 'income');
      document.getElementById('expenseBtn').classList.toggle('active', state.type === 'expense');
      document.getElementById('summaryTitle').textContent = `Összegzés · ${state.scope === 'month' ? monthNames[state.month] : 'Éves · 2025'} · ${activeTypeLabel()}`;
      document.getElementById('summaryValue').textContent = formatCompactHuf(state.summary);
      document.getElementById('fastTitle').textContent = state.type === 'income' ? 'Bevétel vs kiadás' : '1. Szűrés pontszám';
      document.getElementById('fastBadge').textContent = state.name;
      document.getElementById('activeSnapshotText').textContent = `${state.name} · ${snapshotMeta(state)}`;
    }

    function renderCapsules() {
      const root = document.getElementById('filterCapsules');
      const capsules = [
        ...state.categories.map(label => ({label, color: state.color})),
        ...state.vendors.map(label => ({label, color: state.type === 'income' ? colors.income : colors.accent})),
      ];
      root.innerHTML = capsules.map(item => `
        <div class="capsule" style="--capsule-color:${item.color}"><span>${item.label}</span></div>
      `).join('') || '<div class="capsule"><span>Keresés vagy vendor</span></div>';
    }

    function renderChart() {
      const root = document.getElementById('chartBars');
      root.innerHTML = state.bars.map(value => {
        const height = clamp(Math.abs(value), 12, 74);
        const positive = value >= 0;
        const color = positive ? colors.income : colors.expense;
        return `<div class="bar${positive ? '' : ' down'}" style="--h:${height}%;--c:${color};--o:${0.42 + Math.abs(value) / 120}"></div>`;
      }).join('');
    }

    function renderPageState() {
      document.getElementById('pageOne').classList.toggle('active', state.page === 1);
      document.getElementById('pageTwo').classList.toggle('active', state.page === 2);
      renderPageOne();
      renderPageTwo();
    }

    function monthAmount(index) {
      const base = state.type === 'income'
        ? [566, 45, 238, 366, 658, 592, 980, 342, 22, 326, 742, 638]
        : [420, 260, 315, 390, 520, 455, 610, 350, 245, 405, 720, 480];
      const thresholdImpact = Math.max(0.34, 1 - state.threshold / 320000);
      return Math.round(base[index] * 1000 * thresholdImpact);
    }

    function monthCard(index, focused = false) {
      const amount = monthAmount(index);
      const days = Array.from({length: focused ? 35 : 28}, (_, dayIndex) => {
        const day = dayIndex + 1;
        const hit = (day * (index + 3) + state.threshold / 5000) % 6 < 2;
        const heat = focused ? 0.28 + ((day * 7 + index) % 8) / 10 : 0.22 + ((day * 5 + index) % 6) / 10;
        return `<div class="day${hit ? ' hit' : ''}" style="--heat:${clamp(heat, .1, 1)}">${day <= 31 ? day : ''}</div>`;
      }).join('');
      return `
        <article class="month-card${focused ? ' focused' : ''}" data-month-index="${index}">
          <div class="month-name">${monthNames[index]}</div>
          <div class="month-money">
            <strong>${formatCompactHuf(amount)}</strong>
            <span>${state.type === 'income' ? 'bevétel' : 'kiadás'}</span>
          </div>
          <div class="days">${days}</div>
        </article>
      `;
    }

    function renderPageOne() {
      const root = document.getElementById('pageOne');
      if (state.scope === 'month') {
        root.innerHTML = `
          <div class="focus-top">
            <button class="back-btn" id="backToYear" type="button" aria-label="Vissza">←</button>
            <div class="focus-title">
              <strong>${monthNames[state.month]} snapshot</strong>
              <span>Havi fókusz · ${activeTypeLabel()} · ${formatCompactHuf(state.threshold)} küszöb</span>
            </div>
          </div>
          ${monthCard(state.month, true)}
        `;
        document.getElementById('backToYear').addEventListener('click', () => {
          state = {...state, scope: 'year', month: null, page: 1};
          renderAll();
        });
        return;
      }
      root.innerHTML = `<div class="month-grid">${monthNames.map((_, index) => monthCard(index)).join('')}</div>`;
      root.querySelectorAll('[data-month-index]').forEach(card => {
        card.addEventListener('click', () => {
          state = {...state, scope: 'month', month: Number(card.dataset.monthIndex), page: 1};
          renderAll();
        });
      });
    }

    function renderPageTwo() {
      const root = document.getElementById('pageTwo');
      const scopeTitle = state.scope === 'month' ? monthNames[state.month] : '2025';
      const total = state.summary;
      const divisor = state.scope === 'month' ? 1 : 12;
      const dayCount = state.scope === 'month' ? 30 : 365;
      const warningHidden = state.threshold > 0 ? '' : ' hidden';
      const vendorTitle = state.type === 'income' ? 'Top 5 forrás' : 'Top 5 kereskedő';
      const averageLabel = state.type === 'income' ? 'Átlagos bevétel' : 'Átlagos kiadás';
      root.innerHTML = `
        <div class="summary-page">
          <div class="warning${warningHidden}">
            <span class="warning-icon"></span>
            <span>${formatCompactHuf(state.threshold)} alatti tranzakciók rejtve</span>
          </div>
          <div class="kpi-grid">
            <div class="stat-box primary">
              <div class="stat-label">Havi átlag</div>
              <div class="stat-value">${formatCompactHuf(total / divisor)}</div>
            </div>
            <div class="stat-box primary">
              <div class="stat-label">${state.type === 'income' ? 'Legnagyobb bevétel' : 'Legnagyobb kiadás'}</div>
              <div class="stat-value">${formatCompactHuf(total * .22)}<span class="stat-sub">${state.vendors[0] || 'Nincs találat'}</span></div>
            </div>
            <div class="stat-box primary">
              <div class="stat-label">${state.type === 'income' ? 'Legerősebb hónap' : 'Legdrágább hónap'}</div>
              <div class="stat-value">${formatCompactHuf(total * .18)}<span class="stat-sub">${scopeTitle}</span></div>
            </div>
          </div>
          <div class="metric-grid">
            <div class="stat-box">
              <div class="stat-label">Napi tranzakcióátlag</div>
              <div class="stat-value">${(state.scope === 'month' ? 2.8 : 1.7).toFixed(1)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${state.type === 'income' ? 'Napi bevételátlag' : 'Napi kiadásátlag'}</div>
              <div class="stat-value">${formatCompactHuf(total / dayCount)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${state.type === 'income' ? 'Bevételmentes nap' : 'Költésmentes nap'}</div>
              <div class="stat-value">${state.scope === 'month' ? 11 : 128}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${averageLabel}</div>
              <div class="stat-value">${formatCompactHuf(total / (state.scope === 'month' ? 42 : 248))}</div>
            </div>
          </div>
          <section class="panel">
            <div class="panel-title">${state.categories.length === 1 ? 'Szűrt kategória' : 'Kategória rangsor'}</div>
            <div class="category-list">
              ${state.categories.map((category, index) => `
                <div class="category-row">
                  <span>${category}</span>
                  <span>${state.categories.length === 1 ? '' : `${Math.round(100 / (index + 1 + state.categories.length))}%`}</span>
                </div>
              `).join('')}
            </div>
          </section>
          <section class="panel">
            <div class="panel-title">${vendorTitle} · ${Math.min(5, state.vendors.length)} / ${Math.max(state.vendors.length, 5)}</div>
            <div class="progress-list">
              ${(state.vendors.length ? state.vendors : ['Nincs találat']).map((vendor, index) => `
                <div>
                  <div class="progress-head"><span>${vendor}</span><span>${formatCompactHuf(total * (0.32 - index * .06))}</span></div>
                  <div class="progress-track"><div class="progress-fill" style="--p:${clamp(88 - index * 18, 12, 100)}%;--color:${state.color}"></div></div>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function applySnapshot(index) {
      activeIndex = (index + snapshots.length) % snapshots.length;
      state = {...snapshots[activeIndex]};
      renderAll();
    }

    function stepSnapshot(direction) {
      applySnapshot(activeIndex + direction);
    }

    function showTickFeedback(direction) {
      const tick = document.getElementById('tickFeedback');
      tick.textContent = direction > 0 ? '›' : '‹';
      tick.style.setProperty('--tick-x', `${direction > 0 ? 10 : -10}px`);
      tick.classList.add('show');
      window.clearTimeout(tickTimer);
      tickTimer = window.setTimeout(() => tick.classList.remove('show'), 130);
    }

    function handleJoystickDrag(clientX) {
      if (!joystickDrag) return;
      const delta = clientX - joystickDrag.lastStepX;
      if (Math.abs(delta) < joystickStepThreshold) return;
      const direction = delta > 0 ? 1 : -1;
      joystickDrag.lastStepX += direction * joystickStepThreshold;
      stepSnapshot(direction);
      showTickFeedback(direction);
    }

    function endJoystickDrag() {
      if (!joystickDrag) return;
      if (joystickDrag.moved) suppressNextFabClick = true;
      document.getElementById('thresholdFab').classList.remove('dragging');
      joystickDrag = null;
    }

    function saveCurrentSnapshot() {
      const next = {
        ...state,
        id: `manual-${Date.now()}`,
        name: `Mentett ${snapshots.length + 1}`,
        color: scoreColor(state.score),
      };
      snapshots.push(next);
      activeIndex = snapshots.length - 1;
      state = {...next};
      renderAll();
    }

    function setThreshold(raw) {
      const parsed = Number.parseInt(String(raw).replace(/\D/g, ''), 10);
      const next = Number.isFinite(parsed) ? clamp(Math.round(parsed / 5000) * 5000, 0, 250000) : state.threshold;
      state = {
        ...state,
        threshold: next,
        score: clamp(state.score + (next > state.threshold ? -3 : 3), 12, 88),
      };
      renderAll();
    }

    function renderControls() {
      const label = document.getElementById('thresholdLabel');
      const slider = document.getElementById('thresholdSlider');
      const manual = document.getElementById('thresholdManual');
      label.textContent = formatHuf(state.threshold);
      slider.value = state.threshold;
      manual.value = String(state.threshold);
    }

    function renderAll() {
      renderHeader();
      renderCapsules();
      renderChart();
      renderSnapshotStrip();
      renderPageState();
      renderControls();
    }

    const thresholdFab = document.getElementById('thresholdFab');
    thresholdFab.addEventListener('click', () => {
      if (suppressNextFabClick) {
        suppressNextFabClick = false;
        return;
      }
      document.getElementById('thresholdSheet').classList.toggle('open');
    });
    thresholdFab.addEventListener('pointerdown', event => {
      joystickDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        lastStepX: event.clientX,
        moved: false,
      };
      thresholdFab.classList.add('dragging');
      thresholdFab.setPointerCapture?.(event.pointerId);
    });
    thresholdFab.addEventListener('pointermove', event => {
      if (!joystickDrag || joystickDrag.pointerId !== event.pointerId) return;
      if (Math.abs(event.clientX - joystickDrag.startX) > 8) joystickDrag.moved = true;
      handleJoystickDrag(event.clientX);
    });
    thresholdFab.addEventListener('pointerup', endJoystickDrag);
    thresholdFab.addEventListener('pointercancel', endJoystickDrag);
    document.getElementById('thresholdSlider').addEventListener('input', event => setThreshold(event.target.value));
    document.getElementById('thresholdManual').addEventListener('change', event => setThreshold(event.target.value));
    document.getElementById('incomeBtn').addEventListener('click', () => {
      state = {...state, type: 'income', categories: ['Fizetés'], vendors: ['Munkáltatói utalás'], color: colors.income, score: 66, summary: 5480000};
      renderAll();
    });
    document.getElementById('expenseBtn').addEventListener('click', () => {
      state = {...state, type: 'expense', categories: ['Étel'], vendors: ['Tesco', 'Lidl'], color: colors.food, score: 42, summary: 890000};
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
