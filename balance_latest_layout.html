      function populateFacts(panel, facts) {
        const container = panel.querySelector('.common-balance-mother-child-facts');
        const doc = panel.ownerDocument;
        container.replaceChildren(...facts.map((fact) => {
          const row = doc.createElement('div');
          row.className = `common-balance-mother-child-fact${fact.tone === 'expense' ? ' expense' : ''}`;
          if (fact.avatar) {
            row.classList.add('has-category-avatar');
            row.append(createFactAvatar(doc, fact.avatar), doc.createTextNode(fact.text));
          } else {
            row.textContent = fact.text;
          }
          return row;
        }));
      }

      function createFactAvatar(doc, avatar) {
        const badge = doc.createElement('span');
        badge.className = 'common-balance-mother-child-fact-avatar';
        badge.setAttribute('aria-hidden', 'true');
        badge.style.setProperty('--fact-avatar-color', avatar.color);

        const icon = doc.createElement('span');
        icon.className = 'slot-icon';
        icon.style.setProperty('--icon-url', `url('/assets/icons/lucide/${avatar.icon}')`);
        icon.style.setProperty('--icon-size', '9px');
        icon.style.setProperty('--icon-color', '#ffffff');
        badge.append(icon);
        return badge;
      }

      function populateVisual(panel, card) {
        const trend = panel.querySelector('.common-balance-mother-child-trend');
        if (card.hideStage2Visual || card.visual === 'transaction-event') {
          trend.remove();
          return;
        }
        trend.setAttribute('data-fastinfo-visual', card.visual);
        setText(trend, '.common-balance-mother-child-trend-head strong', card.visualTitle);
        setText(trend, '.common-balance-mother-child-trend-head span', card.visualRange);
        const axis = trend.querySelectorAll('.common-balance-mother-child-trend-axis span');
        if (axis[0]) axis[0].textContent = card.axisStart;
        if (axis[1]) axis[1].textContent = card.axisEnd;
        const svg = trend.querySelector('svg');
        svg.innerHTML = renderContextualVisual(card);
      }

      function attachTodayRedesignScrollInteraction(screen, headerViewport, transactionViewport) {
        const layout = screen.querySelector('.stage2-redesign-layout');
        const insightGrid = screen.querySelector('.stage2-redesign-insight-grid');
        const detailCarousel = screen.querySelector('.stage2-redesign-detail-carousel');
        const budgetPill = screen.querySelector('.stage2-redesign-budget-pill');
        const collapseHandle = screen.querySelector('[data-today-collapse-handle="true"]');
        const budgetPillBehavior = screen.dataset.todayBudgetPillBehavior || 'sticky';
        const requiresCollapseHandle = budgetPillBehavior === 'exit';
        const keepsBudgetPill = budgetPillBehavior === 'sticky';
        const isTimeRailCompact = screen.dataset.todayRedesignDensity === 'time-rail-compact';
        const configuredInsightHeight = Number.parseInt(screen.dataset.todayRedesignInsightHeight || '', 10);
        const configuredDetailHeight = Number.parseInt(screen.dataset.todayRedesignDetailHeight || '', 10);
        const collapseDistance = 180;
        const expandedHeroHeight = isTimeRailCompact ? 126 : 150;
        const collapsedHeroHeight = 104;
        const expandedInsightHeight = Number.isFinite(configuredInsightHeight)
          ? configuredInsightHeight
          : isTimeRailCompact ? 72 : 128;
        const expandedDetailHeight = Number.isFinite(configuredDetailHeight)
          ? configuredDetailHeight
          : isTimeRailCompact ? 218 : 210;
        const scrollStackGap = 11;
        const scrollContentHeroGap = 11;
        const unifiedContent = screen.dataset.todayRedesignUnifiedContent === 'true';
        const scrollStackGapCount = unifiedContent ? 1 : 2;
        const compactBudgetPillHeight = 50;
        const collapsedHeaderContentGap = 4;
        const collapsedPostBudgetShift = -((expandedInsightHeight + (scrollStackGap * scrollStackGapCount) + expandedDetailHeight) - collapseDistance - compactBudgetPillHeight - collapsedHeaderContentGap);
        const windowRef = screen.ownerDocument.defaultView;
        const reducedMotion = windowRef?.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
        if (!layout || !insightGrid || !detailCarousel || !budgetPill || !transactionViewport || (requiresCollapseHandle && !collapseHandle)) {
          throw new Error('Today redesign scroll controller could not find its required surfaces');
        }

        const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
        let animationFrame = 0;

        const update = () => {
          animationFrame = 0;
          const scrollTop = Math.min(headerViewport.scrollTop, collapseDistance);
          if (headerViewport.scrollTop > collapseDistance) {
            headerViewport.scrollTop = collapseDistance;
          }
          const progress = clamp(scrollTop / collapseDistance);
          const insightProgress = clamp((progress - .03) / .62);
          const detailProgress = clamp((progress - .16) / .62);
          const pillProgress = keepsBudgetPill ? clamp((progress - .18) / .58) : 0;
          const disappearingPillActionGap = scrollContentHeroGap;
          const disappearingPillPostBudgetShift = -((expandedInsightHeight + (scrollStackGap * scrollStackGapCount) + expandedDetailHeight) - scrollTop + scrollContentHeroGap - disappearingPillActionGap);
          const postBudgetShift = keepsBudgetPill ? collapsedPostBudgetShift : disappearingPillPostBudgetShift;
          const heroHeight = expandedHeroHeight - ((expandedHeroHeight - collapsedHeroHeight) * progress);
          const heroStatOpacity = 1 - clamp((progress - .08) / .52);

          layout.style.setProperty('--today-redesign-collapse-progress', progress.toFixed(3));
          layout.style.setProperty('--today-redesign-hero-height', `${heroHeight.toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-insight-opacity', (1 - insightProgress).toFixed(3));
          layout.style.setProperty('--today-redesign-insight-scale', (1 - (.1 * insightProgress)).toFixed(3));
          layout.style.setProperty('--today-redesign-insight-shift', `${(-18 * insightProgress).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-detail-opacity', (1 - detailProgress).toFixed(3));
          layout.style.setProperty('--today-redesign-detail-scale', (1 - (.04 * detailProgress)).toFixed(3));
          layout.style.setProperty('--today-redesign-detail-shift', `${(-24 * detailProgress).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-pill-opacity', pillProgress.toFixed(3));
          layout.style.setProperty('--today-redesign-pill-scale', (.96 + (.04 * pillProgress)).toFixed(3));
          layout.style.setProperty('--today-redesign-pill-shift', `${(-9 + (9 * pillProgress)).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-hero-stat-opacity', heroStatOpacity.toFixed(3));
          layout.style.setProperty('--today-redesign-hero-stat-shift', `${(10 * (1 - heroStatOpacity)).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-post-budget-shift', `${(postBudgetShift * detailProgress).toFixed(2)}px`);

          insightGrid.style.pointerEvents = insightProgress > .96 ? 'none' : 'auto';
          detailCarousel.style.pointerEvents = detailProgress > .96 ? 'none' : 'auto';
          budgetPill.style.pointerEvents = keepsBudgetPill && pillProgress > .12 ? 'auto' : 'none';
          budgetPill.setAttribute('aria-hidden', keepsBudgetPill && pillProgress > .12 ? 'false' : 'true');
          screen.dataset.todayRedesignState = progress > .98 ? 'collapsed' : progress > 0 ? 'collapsing' : 'expanded';
          if (collapseHandle) {
            collapseHandle.setAttribute('aria-expanded', String(progress <= .98));
            collapseHandle.setAttribute('aria-label', progress > .5 ? 'Nézet kibontása' : 'Nézet összecsukása');
          }
        };

        const updateTransactionScrollState = () => {
          const maxScrollTop = Math.max(0, transactionViewport.scrollHeight - transactionViewport.clientHeight);
          const scrollTop = transactionViewport.scrollTop;
          screen.dataset.todayTransactionScrollState = maxScrollTop === 0
            ? 'rest'
            : scrollTop <= 0
              ? 'top'
              : scrollTop >= maxScrollTop - 1
                ? 'end'
                : 'scrolling';
        };

        const scheduleUpdate = () => {
          if (animationFrame) return;
          animationFrame = windowRef.requestAnimationFrame(update);
        };

        const expand = () => {
          if (reducedMotion) {
            headerViewport.scrollTo({ top: 0, behavior: 'auto' });
            return;
          }
          headerViewport.scrollTo({ top: 0, behavior: 'smooth' });
        };

        let collapsePointerId = null;
        let collapsePointerStartY = 0;
        let collapsePointerStartScrollTop = 0;
        let collapsePointerMoved = false;
        let suppressCollapseHandleClick = false;

        const scrollToCollapseTarget = (top) => {
          headerViewport.scrollTo({
            top,
            behavior: reducedMotion ? 'auto' : 'smooth',
          });
        };

        const beginCollapseHandleDrag = (event) => {
          if (event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
          collapsePointerId = event.pointerId;
          collapsePointerStartY = event.clientY;
          collapsePointerStartScrollTop = headerViewport.scrollTop;
          collapsePointerMoved = false;
          collapseHandle.setAttribute('data-today-collapse-handle-dragging', 'true');
          collapseHandle.setPointerCapture?.(event.pointerId);
        };

        const updateCollapseHandleDrag = (event) => {
          if (event.pointerId !== collapsePointerId) return;
          const deltaY = event.clientY - collapsePointerStartY;
          if (Math.abs(deltaY) > 3) collapsePointerMoved = true;
          if (!collapsePointerMoved) return;
          event.preventDefault();
          headerViewport.scrollTop = clamp(collapsePointerStartScrollTop - deltaY, 0, collapseDistance);
          scheduleUpdate();
        };

        const finishCollapseHandleDrag = (event) => {
          if (event.pointerId !== collapsePointerId) return;
          const didMove = collapsePointerMoved;
          if (collapseHandle.hasPointerCapture?.(event.pointerId)) {
            collapseHandle.releasePointerCapture(event.pointerId);
          }
          collapsePointerId = null;
          collapsePointerMoved = false;
          collapseHandle.removeAttribute('data-today-collapse-handle-dragging');
          const collapseTarget = headerViewport.scrollTop >= collapseDistance / 2
            ? collapseDistance
            : 0;
          scrollToCollapseTarget(collapseTarget);
          if (didMove && event.type === 'pointerup') {
            suppressCollapseHandleClick = true;
            windowRef.setTimeout(() => {
              suppressCollapseHandleClick = false;
            }, 0);
          }
        };

        const toggleCollapseFromHandle = (event) => {
          if (suppressCollapseHandleClick) {
            event.preventDefault();
            suppressCollapseHandleClick = false;
            return;
          }
          const collapseTarget = headerViewport.scrollTop >= collapseDistance / 2
            ? 0
            : collapseDistance;
          scrollToCollapseTarget(collapseTarget);
        };

        headerViewport.addEventListener('scroll', scheduleUpdate, { passive: true });
        transactionViewport.addEventListener('scroll', updateTransactionScrollState, { passive: true });
        budgetPill.addEventListener('click', expand);
        if (collapseHandle) {
          collapseHandle.addEventListener('pointerdown', beginCollapseHandleDrag);
          collapseHandle.addEventListener('pointermove', updateCollapseHandleDrag);
          collapseHandle.addEventListener('pointerup', finishCollapseHandleDrag);
          collapseHandle.addEventListener('pointercancel', finishCollapseHandleDrag);
          collapseHandle.addEventListener('click', toggleCollapseFromHandle);
        }
        update();
        updateTransactionScrollState();
      }

      function installBudgetModeStyles(doc) {
        if (doc.getElementById('balance-budget-mode-styles')) return;
        const style = doc.createElement('style');
        style.id = 'balance-budget-mode-styles';

          '[data-budget-mode-screen="true"] { background: var(--gray-50, #f7f8fb); }',

      function getBudgetModeAvatar(avatarId) {
        const avatar = budgetModeAvatarFixture.find((candidate) => candidate.id === avatarId);
        if (!avatar) throw new Error('Unknown Budget avatar: ' + avatarId);
        return avatar;
      }

      function setBudgetAvatarSelection(screen, avatarId) {
        const avatar = getBudgetModeAvatar(avatarId);
        const remaining = Math.max(0, avatar.limit - avatar.spent);
        const progress = Math.round((avatar.spent / avatar.limit) * 100);
        screen.setAttribute('data-budget-selected-avatar', avatarId);
        screen.style.setProperty('--budget-chart-color', avatar.color);
        for (const option of screen.querySelectorAll('[data-budget-avatar-option]')) {
          option.setAttribute('aria-pressed', String(option.dataset.budgetAvatarOption === avatarId));
        }

        const heroAmount = screen.querySelector('[data-budget-hero-amount]');
        const heroCaption = screen.querySelector('[data-budget-hero-caption]');
        const heroSpent = screen.querySelector('[data-budget-hero-spent]');
        const heroLimit = screen.querySelector('[data-budget-hero-limit]');
        const chartCategory = screen.querySelector('[data-budget-chart-category]');
        const chartAmount = screen.querySelector('[data-budget-chart-amount]');
        const bars = screen.querySelector('[data-budget-chart-bars]');
        const list = screen.querySelector('[data-budget-chart-list]');
        if (!heroAmount || !heroCaption || !heroSpent || !heroLimit || !chartCategory || !chartAmount || !bars || !list) {
          throw new Error('Budget selection could not find its chart/list surfaces');
        }

        heroAmount.textContent = formatTodayRedesignForint(remaining) + ' még';
        heroCaption.textContent = avatar.category + ' · ' + progress + '% felhasználva';
        heroSpent.textContent = formatTodayRedesignForint(avatar.spent);
        heroLimit.textContent = formatTodayRedesignForint(avatar.limit);
        chartCategory.textContent = avatar.category;
        chartAmount.textContent = progress + '%';

        bars.replaceChildren(...avatar.bars.map((value) => {
          const bar = screen.ownerDocument.createElement('i');
          bar.style.setProperty('--budget-chart-bar-height', value + '%');
          return bar;
        }));
        list.replaceChildren(...avatar.rows.map((row) => {
          const element = screen.ownerDocument.createElement('article');
          element.className = 'budget-mode-list-row';
          const copy = screen.ownerDocument.createElement('div');
          copy.className = 'budget-mode-list-copy';
          const title = screen.ownerDocument.createElement('strong');
          title.textContent = row.name;
          const meta = screen.ownerDocument.createElement('span');
          meta.textContent = row.meta;
          copy.append(title, meta);
          const amount = screen.ownerDocument.createElement('strong');
          amount.textContent = '-' + formatTodayRedesignForint(row.amount);
          element.append(copy, amount);
          return element;
        }));
      }

      function attachBudgetModeInteraction(screen, scrollViewport) {
        const layout = screen.querySelector('.budget-mode-layout');
        const avatarRail = screen.querySelector('.budget-mode-avatar-rail');
        const chartList = screen.querySelector('.budget-mode-chart-list');
        const postContent = screen.querySelector('.budget-mode-post-content');
        const compactPill = screen.querySelector('.budget-mode-compact-pill');
        const avatarButtons = [...screen.querySelectorAll('[data-budget-avatar-option]')];
        if (!layout || !avatarRail || !chartList || !postContent || !compactPill || !avatarButtons.length) {
          throw new Error('Budget interaction could not find its required surfaces');
        }

        const collapseDistance = 180;
        const collapsedHeroHeight = 104;
        const scrollStackGap = 11;
        const expandedStackHeight = budgetModeGeometry.avatarRail + scrollStackGap + budgetModeGeometry.chartList;
        const collapsedPostShift = -(expandedStackHeight - collapseDistance - 54);
        const windowRef = screen.ownerDocument.defaultView;
        const requestFrame = windowRef?.requestAnimationFrame?.bind(windowRef) || ((callback) => {
          callback();
          return 0;
        });
        const reducedMotion = windowRef?.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
        let animationFrame = 0;
        let railSettleTimer = 0;
        const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));

        const update = () => {
          animationFrame = 0;
          const scrollTop = Math.min(scrollViewport.scrollTop, collapseDistance);
          if (scrollViewport.scrollTop > collapseDistance) scrollViewport.scrollTop = collapseDistance;
          const progress = clamp(scrollTop / collapseDistance);
          const railProgress = clamp((progress - .02) / .60);
          const chartProgress = clamp((progress - .14) / .60);
          const compactProgress = clamp((progress - .20) / .55);
          const heroHeight = budgetModeGeometry.hero - ((budgetModeGeometry.hero - collapsedHeroHeight) * progress);
          layout.style.setProperty('--budget-mode-hero-h', heroHeight.toFixed(2) + 'px');
          layout.style.setProperty('--budget-mode-rail-opacity', (1 - railProgress).toFixed(3));
          layout.style.setProperty('--budget-mode-rail-shift', (-16 * railProgress).toFixed(2) + 'px');
          layout.style.setProperty('--budget-mode-chart-opacity', (1 - chartProgress).toFixed(3));
          layout.style.setProperty('--budget-mode-chart-shift', (-24 * chartProgress).toFixed(2) + 'px');
          layout.style.setProperty('--budget-mode-compact-pill-opacity', compactProgress.toFixed(3));
          layout.style.setProperty('--budget-mode-compact-pill-shift', (-9 + (9 * compactProgress)).toFixed(2) + 'px');
          layout.style.setProperty('--budget-mode-post-shift', (collapsedPostShift * chartProgress).toFixed(2) + 'px');
          avatarRail.style.pointerEvents = railProgress > .96 ? 'none' : 'auto';
          chartList.style.pointerEvents = chartProgress > .96 ? 'none' : 'auto';
          compactPill.style.pointerEvents = compactProgress > .12 ? 'auto' : 'none';
          compactPill.setAttribute('aria-hidden', compactProgress > .12 ? 'false' : 'true');
          screen.dataset.budgetModeState = progress > .98 ? 'collapsed' : progress > 0 ? 'collapsing' : 'expanded';
        };

        const scheduleUpdate = () => {
          if (animationFrame) return;
          animationFrame = requestFrame(update);
        };

        const centerAvatar = (avatarId, behavior) => {
          const option = avatarButtons.find((button) => button.dataset.budgetAvatarOption === avatarId);
          if (!option) return;
          const left = Math.max(0, option.offsetLeft - ((avatarRail.clientWidth - option.offsetWidth) / 2));
          avatarRail.scrollTo({ left, behavior: behavior || 'smooth' });
        };

        const settleAvatar = () => {
          const railCenter = avatarRail.scrollLeft + (avatarRail.clientWidth / 2);
          const nearest = avatarButtons.reduce((current, candidate) => {
            const currentDistance = Math.abs((current.offsetLeft + (current.offsetWidth / 2)) - railCenter);
            const candidateDistance = Math.abs((candidate.offsetLeft + (candidate.offsetWidth / 2)) - railCenter);
            return candidateDistance < currentDistance ? candidate : current;
          });
          setBudgetAvatarSelection(screen, nearest.dataset.budgetAvatarOption);
        };

        const expand = () => {
          scrollViewport.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
        };

        scrollViewport.addEventListener('scroll', scheduleUpdate, { passive: true });
        avatarRail.addEventListener('scroll', () => {
          if (railSettleTimer) windowRef?.clearTimeout(railSettleTimer);
          railSettleTimer = windowRef?.setTimeout(settleAvatar, 80) || 0;
        }, { passive: true });
        compactPill.addEventListener('click', expand);
        for (const button of avatarButtons) {
          button.addEventListener('click', () => {
            const avatarId = button.dataset.budgetAvatarOption;
            setBudgetAvatarSelection(screen, avatarId);
            centerAvatar(avatarId);
          });
        }

        setBudgetAvatarSelection(screen, budgetModeAvatarFixture[0].id);
        requestFrame(() => centerAvatar(budgetModeAvatarFixture[0].id, 'auto'));
        update();
      }

      function attachBudget3DSummaryPagination(screen, categorySummaryTrack) {
        const categorySummaryDots = [...screen.querySelectorAll('[data-budget-category-summary-page-dot]')];
        if (!categorySummaryDots.length) throw new Error('B3M-B3D needs local category-summary pagination dots');
        const updateCategorySummaryPagination = () => {
          const pageWidth = Math.max(1, categorySummaryTrack.clientWidth);
          const activePage = Math.max(0, Math.min(categorySummaryDots.length - 1, Math.round(categorySummaryTrack.scrollLeft / pageWidth)));
          categorySummaryTrack.setAttribute('data-budget-category-summary-active-page', String(activePage));
          categorySummaryDots.forEach((dot, index) => dot.classList.toggle('is-active', index === activePage));
        };
        categorySummaryTrack.addEventListener('scroll', updateCategorySummaryPagination, { passive: true });
        updateCategorySummaryPagination();

      function attachBudget3DLimitEditor(screen, limitEditor) {
        const limitAmount = limitEditor.querySelector('.budget-limit-amount');
        const limitInput = limitEditor.querySelector('[data-budget-limit-input="true"]');
        const limitEditTrigger = limitEditor.querySelector('[data-budget-limit-edit-trigger="true"]');
        const limitProgressRing = screen.querySelector('[data-budget-limit-progress]');
        const limitProgressValue = limitProgressRing?.querySelector('.budget-limit-progress-value');
        const limitProgressPanel = screen.querySelector('.budget-limit-progress-panel');
        const activeCategoryName = limitEditor.dataset.budgetLimitCategory || screen.querySelector('.budget-limit-category-name')?.textContent?.trim();
        const activeCategorySpent = Number.parseInt(limitEditor.dataset.budgetLimitSpent || '', 10);
        let currentActiveCategoryLimit = Number.parseInt(limitEditor.dataset.budgetLimitValue || '', 10);
        if (!limitAmount || !limitInput || !limitEditTrigger || !limitProgressRing || !limitProgressValue || !limitProgressPanel || !activeCategoryName || !Number.isFinite(activeCategorySpent) || !Number.isFinite(currentActiveCategoryLimit)) {
          throw new Error('B3M-B3D needs a complete local limit editor');
        }

        const updateActiveCategoryLimit = (nextLimit) => {
          currentActiveCategoryLimit = nextLimit;
          const nextPercent = Math.min(100, Math.round((activeCategorySpent / nextLimit) * 100));
          const nextArcDash = `${nextPercent} ${100 - nextPercent}`;
          limitEditor.dataset.budgetLimitValue = String(nextLimit);
          limitAmount.textContent = formatTodayRedesignForint(nextLimit);
          limitInput.value = String(nextLimit);
          limitProgressValue.textContent = `${nextPercent}%`;
          limitProgressRing.setAttribute('data-budget-limit-progress', String(nextPercent));
          limitProgressRing.style.setProperty('--budget-limit-progress', `${nextPercent}%`);
          limitProgressRing.style.setProperty('--budget-limit-progress-midpoint', `${Math.round(nextPercent * .7)}%`);
          for (const progressArc of limitProgressRing.querySelectorAll('[data-budget-3d-limit-progress-arc]')) {
            progressArc.setAttribute('stroke-dasharray', nextArcDash);
          }
          limitProgressRing.setAttribute('aria-label', `${nextPercent}% elköltve: ${formatTodayRedesignForint(activeCategorySpent)} / ${formatTodayRedesignForint(nextLimit)}`);
          limitProgressPanel.setAttribute('aria-label', `${activeCategoryName}: ${nextPercent}% elköltve`);
        };
        const setLimitEditorState = (editing) => {
          limitEditor.setAttribute('data-budget-limit-editor-state', editing ? 'editing' : 'idle');
          limitEditTrigger.setAttribute('aria-label', editing ? `${activeCategoryName} limit mentése` : `${activeCategoryName} limit szerkesztése`);
          if (editing) {
            limitInput.focus();
            limitInput.select();
          }
        };
        const commitLimit = () => {
          const nextLimit = Math.round(Number(limitInput.value));
          if (Number.isFinite(nextLimit) && nextLimit > 0) updateActiveCategoryLimit(nextLimit);
          else limitInput.value = String(currentActiveCategoryLimit);
          setLimitEditorState(false);
        };

        limitEditTrigger.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          event.stopPropagation();
        });
        limitEditTrigger.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (limitEditor.getAttribute('data-budget-limit-editor-state') === 'editing') commitLimit();
          else setLimitEditorState(true);
        });
        limitInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            commitLimit();
          }
          if (event.key === 'Escape') {
            event.preventDefault();
            limitInput.value = String(currentActiveCategoryLimit);
            setLimitEditorState(false);
          }
        });
        limitInput.addEventListener('blur', () => {
          if (limitEditor.getAttribute('data-budget-limit-editor-state') === 'editing') commitLimit();
        });
      }

      function setBudgetFluviClayDonutData(donutSvg, items, selectedIndex = 0) {
        if (!donutSvg || typeof donutSvg.querySelector !== 'function' || !donutSvg.ownerDocument) {
          throw new Error('Fluvi clay donut needs its SVG root');
        }
        const segmentSides = donutSvg.querySelector('[data-fluvi-donut-segment-sides]');
        const segmentTops = donutSvg.querySelector('[data-fluvi-donut-segment-tops]');
        const centerValue = donutSvg.querySelector('#center-value');
        const centerLabel = donutSvg.querySelector('#center-label');
        if (!segmentSides || !segmentTops || !centerValue || !centerLabel) {
          throw new Error('Fluvi clay donut needs segment layers and centered information');
        }
        const cleanItems = (Array.isArray(items) ? items : [])
          .map((item, index) => {
            const directValue = Number(item?.value);
            return {
              label: String(item?.label ?? item?.name ?? `Tétel ${index + 1}`),
              value: Number.isFinite(directValue) ? directValue : Number(item?.fraction),
              color: String(item?.color || '#B47CFF'),
              sideColor: item?.sideColor ? String(item.sideColor) : null,
            };
          })
          .filter((item) => Number.isFinite(item.value) && item.value > 0);
        segmentSides.replaceChildren();
        segmentTops.replaceChildren();
        const total = cleanItems.reduce((sum, item) => sum + item.value, 0);
        if (!total) {
          centerValue.textContent = '0%';
          centerLabel.textContent = 'nincs adat';
          donutSvg.setAttribute('data-budget-fluvi-donut-count', '0');
          return 0;
        }

        const svgNamespace = 'http://www.w3.org/2000/svg';
        const point = (cx, cy, radius, degrees, yOffset = 0) => {
          const radians = (degrees - 90) * Math.PI / 180;
          return { x: cx + (radius * Math.cos(radians)), y: cy + (radius * Math.sin(radians)) + yOffset };
        };
        const ringSlicePath = (cx, cy, outerRadius, innerRadius, start, end, yOffset = 0) => {
          const outerStart = point(cx, cy, outerRadius, start, yOffset);
          const outerEnd = point(cx, cy, outerRadius, end, yOffset);
          const innerEnd = point(cx, cy, innerRadius, end, yOffset);
          const innerStart = point(cx, cy, innerRadius, start, yOffset);
          const largeArc = end - start > 180 ? 1 : 0;
          return `M ${outerStart.x} ${outerStart.y} A ${outerRadius} ${outerRadius} 0 ${largeArc} 1 ${outerEnd.x} ${outerEnd.y} L ${innerEnd.x} ${innerEnd.y} A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${innerStart.x} ${innerStart.y} Z`;
        };
        const outerSidePath = (cx, cy, radius, depth, start, end) => {
          const topStart = point(cx, cy, radius, start);
          const topEnd = point(cx, cy, radius, end);
          const bottomEnd = point(cx, cy, radius, end, depth);
          const bottomStart = point(cx, cy, radius, start, depth);
          const largeArc = end - start > 180 ? 1 : 0;
          return `M ${topStart.x} ${topStart.y} A ${radius} ${radius} 0 ${largeArc} 1 ${topEnd.x} ${topEnd.y} L ${bottomEnd.x} ${bottomEnd.y} A ${radius} ${radius} 0 ${largeArc} 0 ${bottomStart.x} ${bottomStart.y} Z`;
        };
        const highlightedIndexes = [...new Set(
          (Array.isArray(selectedIndex) ? selectedIndex : [selectedIndex])
            .map((candidate) => Math.round(Number(candidate)))
            .filter((candidate) => Number.isInteger(candidate) && candidate >= 0 && candidate < cleanItems.length),
        )];
        const selected = highlightedIndexes[0] ?? 0;
        const selectedOuterRadius = 198;
        const selectedOutset = 10;
        const gap = cleanItems.length > 12 ? .5 : cleanItems.length > 7 ? .9 : 1.7;
        let angle = 0;
        for (const [index, item] of cleanItems.entries()) {
          const sweep = (item.value / total) * 360;
          const start = angle + (gap / 2);
          const end = angle + sweep - (gap / 2);
          angle += sweep;
          if (end <= start) continue;
          const isSelected = index === selected;
          const isHighlighted = highlightedIndexes.includes(index);
          const sliceOuterRadius = isHighlighted ? selectedOuterRadius : 164;
          const sliceMidAngle = (start + end) / 2;
          const selectedOffset = isHighlighted ? point(0, 0, selectedOutset, sliceMidAngle) : { x: 0, y: 0 };
          const selectedTransform = `translate(${Math.round(selectedOffset.x)} ${Math.round(selectedOffset.y)})`;
          const side = donutSvg.ownerDocument.createElementNS(svgNamespace, 'path');
          side.setAttribute('d', outerSidePath(256, 256, sliceOuterRadius, 14, start, end));
          side.setAttribute('fill', item.sideColor || item.color);
          side.setAttribute('opacity', '.84');
          side.setAttribute('aria-hidden', 'true');
          if (isHighlighted) {
            side.setAttribute('transform', selectedTransform);
            side.setAttribute('data-fluvi-donut-highlighted', 'true');
          }

      function setBudgetFluviWeeklyRhythm(rhythmSvg, values) {
        if (!rhythmSvg || typeof rhythmSvg.querySelector !== 'function' || !rhythmSvg.ownerDocument) {
          throw new Error('Fluvi weekly rhythm needs its SVG root');
        }
        const barLayer = rhythmSvg.querySelector('[data-fluvi-weekly-rhythm-bars]');
        const averageText = rhythmSvg.querySelector('[data-fluvi-weekly-rhythm-average]');
        if (!barLayer || !averageText) {
          throw new Error('Fluvi weekly rhythm needs its bar layer and average label');
        }
        const suppliedValues = Array.isArray(values)
          ? values.slice(-7).map((value) => {
            const numericValue = Number(value);
            return Number.isFinite(numericValue) && numericValue > 0 ? numericValue : 0;
          })
          : [];
        const weeklyValues = Array.from(
          { length: 7 },
          (_unused, index) => suppliedValues[index - (7 - suppliedValues.length)] || 0,
        );
        const svgNamespace = 'http://www.w3.org/2000/svg';
        const left = 56;
        const chartWidth = 544;
        const top = 64;
        const chartHeight = 204;
        const baseline = 270;
        const gap = 14;
        const barWidth = (chartWidth - (gap * (weeklyValues.length - 1))) / weeklyValues.length;
        const maximum = Math.max(...weeklyValues, 1);
        barLayer.replaceChildren();
        for (const [index, value] of weeklyValues.entries()) {
          const barGroup = rhythmSvg.ownerDocument.createElementNS(svgNamespace, 'g');
          barGroup.setAttribute('data-weekly-rhythm-day', String(index));
          barGroup.setAttribute('data-value', String(value));
          const barHeight = value > 0 ? Math.max(12, (chartHeight * value) / maximum) : 0;
          const x = left + (index * (barWidth + gap));
          const y = baseline - barHeight;
          const radius = barWidth / 2;
          if (barHeight > 0) {
            const shadow = rhythmSvg.ownerDocument.createElementNS(svgNamespace, 'rect');
            shadow.setAttribute('x', x);
            shadow.setAttribute('y', y + 7);
            shadow.setAttribute('width', barWidth);
            shadow.setAttribute('height', barHeight);
            shadow.setAttribute('rx', radius);
            shadow.setAttribute('fill', '#b53bc8');
            shadow.setAttribute('opacity', '.16');
            shadow.setAttribute('filter', 'url(#budgetFluviWeeklyBlur6)');
            const face = rhythmSvg.ownerDocument.createElementNS(svgNamespace, 'rect');
            face.setAttribute('x', x);
            face.setAttribute('y', y);
            face.setAttribute('width', barWidth);
            face.setAttribute('height', barHeight);
            face.setAttribute('rx', radius);
            face.setAttribute('fill', 'url(#budgetFluviWeeklyBarGrad)');
            face.setAttribute('stroke', '#fff');
            face.setAttribute('stroke-opacity', '.55');
            face.setAttribute('stroke-width', '2');
            face.setAttribute('filter', 'url(#budgetFluviWeeklyBarShadow)');
            const highlight = rhythmSvg.ownerDocument.createElementNS(svgNamespace, 'rect');
            highlight.setAttribute('x', x + (barWidth * .18));
            highlight.setAttribute('y', y + 4);
            highlight.setAttribute('width', barWidth * .36);
            highlight.setAttribute('height', Math.max(10, barHeight * .5));
            highlight.setAttribute('rx', barWidth * .18);
            highlight.setAttribute('fill', '#fff');
            highlight.setAttribute('opacity', '.22');
            highlight.setAttribute('filter', 'url(#budgetFluviWeeklyBlur2)');
            barGroup.append(shadow, face, highlight);
          }
          barLayer.append(barGroup);
        }
        const average = Math.round(weeklyValues.reduce((sum, value) => sum + value, 0) / weeklyValues.length);
        averageText.textContent = `átlag: ${average}%`;
        rhythmSvg.setAttribute('aria-label', `Heti költési ritmus, átlag: ${average}%`);
        return weeklyValues.length;
      }

      function mixBudgetAvatarDiscColor(hex, target, amount) {
        const source = String(hex || '').trim();
        const destination = String(target || '').trim();
        if (!/^#[\da-f]{6}$/i.test(source) || !/^#[\da-f]{6}$/i.test(destination)) {
          throw new Error('Fluvi avatar disc colors must be six-digit hex values');
        }
        const ratio = Math.min(1, Math.max(0, Number(amount)));
        const sourceChannels = [source.slice(1, 3), source.slice(3, 5), source.slice(5, 7)].map((channel) => Number.parseInt(channel, 16));
        const targetChannels = [destination.slice(1, 3), destination.slice(3, 5), destination.slice(5, 7)].map((channel) => Number.parseInt(channel, 16));
        const mixedChannels = sourceChannels.map((channel, index) => Math.round(channel + ((targetChannels[index] - channel) * ratio)));
        return `#${mixedChannels.map((channel) => channel.toString(16).padStart(2, '0')).join('')}`;
      }

        limitProgressRing.setAttribute('aria-label', `${activeCategorySpentPercent}% elköltve: ${formatTodayRedesignForint(activeCategorySpent)} / ${formatTodayRedesignForint(activeCategoryLimit)}`);
        limitProgressRing.style.setProperty('--budget-limit-progress', `${activeCategorySpentPercent}%`);
        limitProgressRing.style.setProperty('--budget-limit-progress-midpoint', `${Math.round(activeCategorySpentPercent * .7)}%`);
        const budgetFluviProgress = createBudgetFluviCircleProgress(doc, activeCategorySpentPercent);
        const limitProgressValue = createTodayRedesignElement(doc, 'strong', 'budget-limit-progress-value', `${activeCategorySpentPercent}%`);
        limitProgressRing.append(budgetFluviProgress, limitProgressValue);
        const limitEditor = createTodayRedesignElement(doc, 'div', 'budget-limit-editor');
        limitEditor.setAttribute('data-budget-limit-editor-state', 'idle');
        limitEditor.setAttribute('data-budget-limit-spent', String(activeCategorySpent));
        limitEditor.setAttribute('data-budget-limit-value', String(activeCategoryLimit));
        limitEditor.setAttribute('data-budget-limit-category', activeCategoryName);
        const limitAmount = createTodayRedesignElement(doc, 'strong', 'budget-limit-amount', formatTodayRedesignForint(activeCategoryLimit));
        const limitInput = doc.createElement('input');
        limitInput.className = 'budget-limit-input';
        limitInput.type = 'number';
        limitInput.min = '1';
        limitInput.step = '1000';
        limitInput.inputMode = 'numeric';
        limitInput.autocomplete = 'off';
        limitInput.value = String(activeCategoryLimit);
        limitInput.setAttribute('data-budget-limit-input', 'true');
        limitInput.setAttribute('aria-label', `${activeCategoryName} limit összege forintban`);
        const limitEditTrigger = createTodayRedesignElement(doc, 'button', 'budget-limit-edit-trigger');
        limitEditTrigger.type = 'button';
        limitEditTrigger.setAttribute('data-budget-limit-edit-trigger', 'true');
        limitEditTrigger.setAttribute('aria-label', `${activeCategoryName} limit szerkesztése`);
        const limitEditIcon = createTodayRedesignElement(doc, 'span', 'slot-icon');
        limitEditIcon.style.setProperty('--icon-url', "url('/assets/icons/lucide/pencil.svg')");
        limitEditIcon.style.setProperty('--icon-color', '#7d8798');
        limitEditTrigger.append(limitEditIcon);
        limitEditor.append(limitAmount, limitInput, limitEditTrigger);
        const spentAmount = createTodayRedesignElement(doc, 'div', 'budget-limit-spent-amount');
        spentAmount.append(
          createTodayRedesignElement(doc, 'span', 'budget-limit-spent-label', 'Elköltve:'),
          createTodayRedesignElement(doc, 'strong', 'budget-limit-spent-value', formatTodayRedesignForint(activeCategorySpent)),
        );
        commonCategoryHeading.append(categoryIdentity, limitEditor);

        let currentActiveCategoryLimit = activeCategoryLimit;
        const updateActiveCategoryLimit = (nextLimit) => {
          currentActiveCategoryLimit = nextLimit;
          const nextPercent = Math.min(100, Math.round((activeCategorySpent / nextLimit) * 100));
          limitAmount.textContent = formatTodayRedesignForint(nextLimit);
          limitInput.value = String(nextLimit);
          limitProgressValue.textContent = `${nextPercent}%`;
          budgetFluviProgress.setValue(nextPercent);
          limitProgressRing.setAttribute('data-budget-limit-progress', String(nextPercent));
          limitProgressRing.style.setProperty('--budget-limit-progress', `${nextPercent}%`);
          limitProgressRing.style.setProperty('--budget-limit-progress-midpoint', `${Math.round(nextPercent * .7)}%`);
          limitProgressRing.setAttribute('aria-label', `${nextPercent}% elköltve: ${formatTodayRedesignForint(activeCategorySpent)} / ${formatTodayRedesignForint(nextLimit)}`);
          limitProgressPanel.setAttribute('aria-label', `${activeCategoryName}: ${nextPercent}% elköltve`);
        };
        const setLimitEditorState = (editing) => {
          limitEditor.setAttribute('data-budget-limit-editor-state', editing ? 'editing' : 'idle');
          limitEditTrigger.setAttribute('aria-label', editing ? `${activeCategoryName} limit mentése` : `${activeCategoryName} limit szerkesztése`);
          if (editing) {
            limitInput.focus();
            limitInput.select();
          }
        };
        const commitLimit = () => {
          const nextLimit = Math.round(Number(limitInput.value));
          if (Number.isFinite(nextLimit) && nextLimit > 0) updateActiveCategoryLimit(nextLimit);
          else limitInput.value = String(currentActiveCategoryLimit);
          setLimitEditorState(false);
        };
        limitEditTrigger.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          event.stopPropagation();
        });
        limitEditTrigger.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (limitEditor.getAttribute('data-budget-limit-editor-state') === 'editing') commitLimit();
          else setLimitEditorState(true);
        });
        limitInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            commitLimit();
          }
          if (event.key === 'Escape') {
            event.preventDefault();
            limitInput.value = String(currentActiveCategoryLimit);
            setLimitEditorState(false);
          }
        });
        limitInput.addEventListener('blur', () => {
          if (limitEditor.getAttribute('data-budget-limit-editor-state') === 'editing') commitLimit();
        });
        limitProgressPanel.append(limitPanelTitle, limitProgressRing, spentAmount);

        const rhythmPanel = createTodayRedesignElement(doc, 'section', 'budget-component-inner-panel budget-rhythm-panel');
        rhythmPanel.setAttribute('data-budget-rhythm', 'weekly');
        rhythmPanel.setAttribute('aria-label', 'Heti költési ritmus, elmúlt hét');
        const rhythmTitle = createTodayRedesignElement(doc, 'strong', 'budget-rhythm-title', 'Heti ritmus');
        const rhythmSvg = createBudgetFluviWeeklyRhythm(doc, budgetActiveCategoryWeeklyRhythmFixture);
        rhythmPanel.append(rhythmTitle, rhythmSvg);
        const limitColumn = createTodayRedesignElement(doc, 'div', 'budget-limit-column');
        limitColumn.append(limitProgressPanel, rhythmPanel);

        const pieOnlyPanel = createTodayRedesignElement(doc, 'section', 'budget-component-inner-panel budget-pie-only-panel');
        pieOnlyPanel.setAttribute('aria-label', 'Lapozható kategóriaösszesítő: eloszlás és kereskedők');
        const categorySummaryColumn = createTodayRedesignElement(doc, 'div', 'budget-category-summary-column');
        const categorySummaryTrack = createTodayRedesignElement(doc, 'div', 'budget-category-summary-track');
        categorySummaryTrack.setAttribute('data-budget-category-summary-swipe', 'true');
        categorySummaryTrack.setAttribute('aria-label', 'Kategóriaösszesítő lapok: eloszlás és kereskedők');
        const categorySummaryPagination = createTodayRedesignElement(doc, 'div', 'budget-category-summary-pagination');
        categorySummaryPagination.setAttribute('data-budget-category-summary-pagination', 'true');
        categorySummaryPagination.setAttribute('aria-hidden', 'true');
        const categorySummaryDots = [];
        for (let index = 0; index < 2; index += 1) {
          const categorySummaryDot = createTodayRedesignElement(doc, 'span', 'budget-category-summary-page-dot');
          categorySummaryDot.setAttribute('data-budget-category-summary-page-dot', String(index));
          if (index === 0) categorySummaryDot.classList.add('is-active');
          categorySummaryDots.push(categorySummaryDot);
          categorySummaryPagination.append(categorySummaryDot);
        }
        const pieSummaryPage = createTodayRedesignElement(doc, 'section', 'budget-category-summary-page budget-pie-summary-page');
        pieSummaryPage.setAttribute('data-budget-category-summary-page', 'pie');
        const piePanelTitle = createTodayRedesignElement(doc, 'strong', 'budget-pie-panel-title', 'Kategóriák eloszlása');
        const selectedPieSliceIndex = c4wReferencePieSlices.findIndex((slice) => slice.name === activeCategoryName);
        if (selectedPieSliceIndex < 0) throw new Error('Budget active category is missing from the C4W pie fixture');
        const selectedPieSlice = c4wReferencePieSlices[selectedPieSliceIndex];
        const selectedCategoryColor = selectedPieSlice.color;
        const secondaryHighlightedPieSliceIndex = c4wReferencePieSlices.findIndex((slice) => slice.name === 'Lakás');
        if (secondaryHighlightedPieSliceIndex < 0) throw new Error('Budget blue Lakás category is missing from the C4W pie fixture');
        const fluviClayDonut = createBudgetFluviClayDonut(doc, c4wReferencePieSlices, [selectedPieSliceIndex, secondaryHighlightedPieSliceIndex]);
        fluviClayDonut.setAttribute('aria-label', `${activeCategoryName}: ${selectedPieSlice.fraction}% a kategóriák eloszlásából`);
        const pieDonut = sourcePieDonut.cloneNode(true);
        pieDonut.classList.add('budget-c4w-donut-fallback');
        pieDonut.setAttribute('data-budget-c4w-donut-clone', 'true');
        pieDonut.setAttribute('role', 'img');
        pieDonut.setAttribute('aria-label', `${activeCategoryName}: ${selectedPieSlice.fraction}% a kategóriák eloszlásából`);
        pieDonut.removeAttribute('aria-hidden');
        const pieSlices = [...pieDonut.querySelectorAll('.common-budget-pie-slice')];
        if (!pieSlices.length) throw new Error('Budget pie clone has no category slices');
        for (const pieSlice of pieSlices) {
          const isSelectedPieSlice = Number(pieSlice.getAttribute('data-category-index')) === selectedPieSliceIndex;
          pieSlice.classList.toggle('selected', isSelectedPieSlice);
          pieSlice.setAttribute('data-category-highlight', isSelectedPieSlice ? 'current' : 'other');
        }
        const pieCenterPercent = doc.createElementNS('http://www.w3.org/2000/svg', 'text');
        pieCenterPercent.setAttribute('class', 'budget-pie-center-percent');
        pieCenterPercent.setAttribute('x', '60');
        pieCenterPercent.setAttribute('y', '60');
        pieCenterPercent.setAttribute('aria-hidden', 'true');
        pieCenterPercent.textContent = `${selectedPieSlice.fraction}%`;
        pieDonut.append(pieCenterPercent);
        const topPieLegend = [...c4wReferencePieSlices].sort((left, right) => right.fraction - left.fraction).slice(0, 3);
        const pieLegend = createTodayRedesignElement(doc, 'div', 'budget-pie-legend');
        pieLegend.setAttribute('data-budget-pie-legend', 'top-3');
        pieLegend.setAttribute('aria-label', 'Top 3 kategória');

        pieLegendList.setAttribute('role', 'list');
        for (const slice of topPieLegend) {

          pieLegendItem.setAttribute('aria-label', `${slice.name}: ${slice.fraction}%`);

            pieLegendDot,
            createTodayRedesignElement(doc, 'span', 'budget-pie-legend-name', slice.name),

        const activeCategoryVendors = summarizeBudgetCategoryVendors(

          vendorShareTrack.append(vendorShareFill);
          vendorShare.append(
            vendorShareTrack,
            createTodayRedesignElement(doc, 'strong', 'budget-vendor-share-value', `${vendor.sharePercent}%`),
          );
          vendorRow.append(
            vendorDot,
            createTodayRedesignElement(doc, 'strong', 'budget-vendor-name', vendor.merchant),
            vendorShare,
          );
          vendorList.append(vendorRow);
        }
        vendorSummaryPage.append(vendorSummaryTitle, vendorList);
        categorySummaryTrack.append(pieSummaryPage, vendorSummaryPage);
        const updateCategorySummaryPagination = () => {
          const pageWidth = Math.max(1, categorySummaryTrack.clientWidth);
          const activePage = Math.max(0, Math.min(categorySummaryDots.length - 1, Math.round(categorySummaryTrack.scrollLeft / pageWidth)));
          categorySummaryTrack.setAttribute('data-budget-category-summary-active-page', String(activePage));
          categorySummaryDots.forEach((dot, index) => dot.classList.toggle('is-active', index === activePage));
        };
        categorySummaryTrack.addEventListener('scroll', updateCategorySummaryPagination, { passive: true });
        updateCategorySummaryPagination();
        pieOnlyPanel.append(categorySummaryTrack);
        categorySummaryColumn.append(pieOnlyPanel, categorySummaryPagination);

        donutCard.append(commonCategoryHeading, splitLayout);

        insightGrid.setAttribute('aria-label', 'C4W kategória-avatar placeholderek');
        detailCarousel.setAttribute('aria-label', 'Budget statikus kategóriaösszesítő kártya');
        insightGrid.replaceChildren(avatarScope);
        detailCarousel.replaceChildren(donutCard);

        attachTodayRedesignScrollInteraction(screen, scrollViewport, transactionViewport);
        attachTodayTimeScopeDrawer(screen);
        installB3MA3ActionToggle(doc, column, true);
        return column;
      }

      function createBudget3DModeScreen(doc, budgetModeColumn) {
        if (!budgetModeColumn) throw new Error('B3M-B3D requires the finished B3M-B column');
        const column = budgetModeColumn.cloneNode(true);
        const screen = column.querySelector('[data-budget-mode-screen="true"]');
        const scrollViewport = screen?.querySelector('.stage2-redesign-scroll-viewport');
        const transactionViewport = screen?.querySelector('.stage2-redesign-transaction-viewport');
        if (!screen || !scrollViewport || !transactionViewport) throw new Error('B3M-B3D clone is incomplete');
        column.setAttribute('data-stage2-alternative', 'budget-mode-3d');
        column.setAttribute('data-budget-3d-mode-column', 'true');
        setText(column, '.screen-title', 'B3M-B3D · Budget 3D');
        screen.setAttribute('data-budget-3d-mode-screen', 'true');
        screen.setAttribute('data-screen', 'b3m-budget-mode-3d');
        screen.setAttribute('aria-label', 'B3M Budget 3D interaktív collapse expand és kategóriaösszesítő');
        decorateBudget3DLimitProgress(screen);
        decorateBudget3DDonutDepth(screen);
        attachTodayRedesignScrollInteraction(screen, scrollViewport, transactionViewport);
        attachTodayTimeScopeDrawer(screen);
        installB3MA3ActionToggle(doc, column, true);
        attachBudget3DCloneInteractions(screen);
        return column;
      }

      function createMindModePrototypeScreen(doc, budgetModeColumn, ds2aReferenceColumn) {
        if (!budgetModeColumn || !ds2aReferenceColumn) {
          throw new Error('B3M Mind prototype requires the finished B3M-B column and independent DS2A reference');
        }
        const sourceHeatmap = ds2aReferenceColumn.querySelector('[data-stage2-extra="mind-layout-sum-heatmap"]');
        const sourceHeatmapPanel = sourceHeatmap?.querySelector('[data-mind-stage2-page="year-heatmap"]');
        const sourceScore = doc.querySelector('.common-header-mode[data-common-header-mode="mind"][data-common-header-mode-source="balance"] [data-common-header-snap="0"] .common-header-value');
        const mindScore = sourceScore?.textContent.trim();
        if (!sourceHeatmap || !sourceHeatmapPanel) throw new Error('B3M Mind prototype requires the complete DS2A heatmap layer');
        if (!mindScore || !mindScore.endsWith('/ 100')) throw new Error('B3M Mind prototype requires the authentic Mind score');

        const column = budgetModeColumn.cloneNode(true);
        const screen = column.querySelector('[data-budget-mode-screen="true"]');
        const scrollViewport = screen?.querySelector('.stage2-redesign-scroll-viewport');
        const transactionViewport = screen?.querySelector('.stage2-redesign-transaction-viewport');
        const insightGrid = screen?.querySelector('.stage2-redesign-insight-grid');
        const detailCarousel = screen?.querySelector('.stage2-redesign-detail-carousel');
        const hero = screen?.querySelector('.stage2-redesign-balance-hero');
        const heroLabel = hero?.querySelector('.stage2-redesign-hero-label');
        const heroAmount = hero?.querySelector('.stage2-redesign-hero-amount');
        const heroStats = hero?.querySelector('.budget-clone-hero-stat-grid');
        if (!screen || !scrollViewport || !transactionViewport || !insightGrid || !detailCarousel || !hero || !heroLabel || !heroAmount || !heroStats) {
          throw new Error('B3M Mind prototype clone is incomplete');
        }

        column.setAttribute('data-stage2-alternative', 'mind-mode-prototype');
        column.setAttribute('data-mind-mode-prototype-column', 'true');
        setText(column, '.screen-title', 'B3M-M · Mind prototype');
        screen.setAttribute('data-mind-mode-prototype-screen', 'true');
        screen.setAttribute('data-screen', 'b3m-mind-mode-prototype');
        screen.setAttribute('data-today-redesign-insight-height', '0');
        screen.setAttribute('data-today-redesign-detail-height', '301');
        screen.setAttribute('data-today-redesign-unified-content', 'true');
        screen.setAttribute('aria-label', `B3M Mind prototípus, ${mindScore} score és DS2A éves heatmap`);
        hero.setAttribute('data-mind-header', 'true');
        hero.setAttribute('data-mind-score-source', 'color-lab-mind-stage0');
        heroLabel.textContent = 'Mind';
        heroAmount.textContent = mindScore;
        heroStats.remove();
        hero.removeAttribute('data-budget-progress-source');

        const heatmap = sourceHeatmap.cloneNode(true);
        if (heatmap.innerHTML !== sourceHeatmap.innerHTML) {
          throw new Error('B3M Mind DS2A heatmap deep clone differs from its source');
        }
        heatmap.setAttribute('data-mind-unified-heatmap-clone', 'true');
        const heatmapScope = createTodayRedesignElement(doc, 'div', 'mind-expanded-heatmap-scope common-header-mode');
        heatmapScope.setAttribute('data-common-header-mode', 'mind');
        heatmapScope.append(heatmap);
        const unifiedHeatmapCard = createTodayRedesignElement(doc, 'article', 'stage2-redesign-today-detail mind-expanded-heatmap-card');
        unifiedHeatmapCard.setAttribute('data-mind-unified-heatmap-card', 'true');
        unifiedHeatmapCard.setAttribute('aria-label', sourceHeatmapPanel.getAttribute('aria-label') || 'Mind SUM éves heatmap');
        unifiedHeatmapCard.append(heatmapScope);
        insightGrid.replaceChildren();
        insightGrid.setAttribute('aria-hidden', 'true');
        detailCarousel.setAttribute('aria-label', 'Mind egységes DS2A heatmap card');
        detailCarousel.replaceChildren(unifiedHeatmapCard);

        attachTodayRedesignScrollInteraction(screen, scrollViewport, transactionViewport);
        attachTodayTimeScopeDrawer(screen);
        installB3MA3ActionToggle(doc, column, true);
        return column;
      }

      function createMindAnnualMonthcardPrototypeScreen(doc, mindPrototypeColumn) {
        if (!mindPrototypeColumn) throw new Error('B3M Mind annual monthcards require the finished B3M-M column');
        const column = mindPrototypeColumn.cloneNode(true);
        const screen = column.querySelector('[data-mind-mode-prototype-screen="true"]');
        const scrollViewport = screen?.querySelector('.stage2-redesign-scroll-viewport');
        const transactionViewport = screen?.querySelector('.stage2-redesign-transaction-viewport');
        const detailCarousel = screen?.querySelector('.stage2-redesign-detail-carousel');
        const sourceCard = detailCarousel?.querySelector('[data-mind-unified-heatmap-card="true"]');
        if (!screen || !scrollViewport || !transactionViewport || !detailCarousel || !sourceCard) {
          throw new Error('B3M Mind annual monthcard clone is incomplete');
        }

        const annualMonthNames = ['Január', 'Február', 'Március', 'Április', 'Május', 'Június', 'Július', 'Augusztus', 'Szeptember', 'Október', 'November', 'December'];
        const annualDayCounts = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        const annualMonthOffsets = [0, 3, 4, 0, 2, 5, 0, 3, 6, 1, 4, 6];
        const annualHeatLevels = [0, 1, 2, 1, 0, 3, 2, 1, 4, 2, 0, 3, 1, 4, 2, 0, 2];
        const annualScopeTotals = ['21 400 Ft', '29 500 Ft', '45 800 Ft', '24 600 Ft', '39 000 Ft', '51 400 Ft', '17 900 Ft', '30 300 Ft', '38 200 Ft', '22 100 Ft', '54 200 Ft', '39 529 Ft'];

        column.removeAttribute('data-mind-mode-prototype-column');
        column.setAttribute('data-stage2-alternative', 'mind-annual-monthcards');
        column.setAttribute('data-mind-annual-monthcards-column', 'true');
        setText(column, '.screen-title', 'B3M-MY · Éves monthcards');
        screen.setAttribute('data-mind-annual-monthcards-screen', 'true');
        screen.setAttribute('data-screen', 'b3m-mind-annual-monthcards');
        screen.setAttribute('aria-label', 'B3M Mind éves hőtérkép, négy közvetlen monthcard egy sorban');

        const annualCard = createTodayRedesignElement(doc, 'article', 'stage2-redesign-today-detail mind-annual-monthcards-card');
        annualCard.setAttribute('data-mind-annual-monthcards-card', 'true');
        annualCard.setAttribute('aria-label', '2024 éves részletes hőtérkép');
        const annualHead = createTodayRedesignElement(doc, 'header', 'mind-annual-monthcards-head');
        annualHead.append(
          createTodayRedesignElement(doc, 'strong', '', 'Részletes hőtérkép'),
          createTodayRedesignElement(doc, 'span', '', '12 hónap · scroll'),
        );
        const annualGrid = createTodayRedesignElement(doc, 'div', 'mind-annual-month-grid');
        annualGrid.setAttribute('data-mind-annual-month-grid', 'true');
        annualGrid.setAttribute('role', 'grid');
        annualGrid.setAttribute('aria-label', '2024 hónapjai, négyszer három elrendezésben');

        annualMonthNames.forEach((monthName, monthIndex) => {
          const monthGroup = createTodayRedesignElement(doc, 'section', 'mind-annual-month-group');
          monthGroup.setAttribute('data-mind-annual-month-group', 'true');
          monthGroup.setAttribute('data-mind-annual-month', String(monthIndex + 1));
          monthGroup.setAttribute('role', 'gridcell');
          monthGroup.setAttribute('aria-label', `${monthName}: ${annualScopeTotals[monthIndex]}`);
          const monthTitle = createTodayRedesignElement(doc, 'strong', 'mind-annual-month-title', monthName);
          const dayGrid = createTodayRedesignElement(doc, 'div', 'mind-annual-days');
          dayGrid.setAttribute('aria-hidden', 'true');

          for (let blankIndex = 0; blankIndex < annualMonthOffsets[monthIndex]; blankIndex += 1) {
            const blankCell = createTodayRedesignElement(doc, 'i', 'mind-annual-day-cell blank');
            dayGrid.append(blankCell);
          }
          for (let dayIndex = 0; dayIndex < annualDayCounts[monthIndex]; dayIndex += 1) {
            const level = annualHeatLevels[(dayIndex + monthIndex * 3) % annualHeatLevels.length];
            const dayCell = createTodayRedesignElement(doc, 'i', `mind-annual-day-cell l${level}`, String(dayIndex + 1));
            dayGrid.append(dayCell);
          }

          const monthScope = createTodayRedesignElement(doc, 'footer', 'mind-annual-month-scope');
          monthScope.append(
            createTodayRedesignElement(doc, 'span', '', 'Scope'),
            createTodayRedesignElement(doc, 'strong', '', annualScopeTotals[monthIndex]),
          );
          monthGroup.append(monthTitle, dayGrid, monthScope);
          annualGrid.append(monthGroup);
        });

        annualCard.append(annualHead, annualGrid);
        detailCarousel.setAttribute('aria-label', 'Mind éves közvetlen monthcard hőtérkép');
        detailCarousel.replaceChildren(annualCard);

        attachTodayRedesignScrollInteraction(screen, scrollViewport, transactionViewport);
        attachTodayTimeScopeDrawer(screen);
        installB3MA3ActionToggle(doc, column, true);
        return column;
      }

      function buildTrendSparklineClipPath(values) {
        const bucketCount = 6;
        const buckets = Array.from({ length: bucketCount }, (_, bucketIndex) => {
          const start = Math.floor((bucketIndex * values.length) / bucketCount);
          const end = Math.floor(((bucketIndex + 1) * values.length) / bucketCount);
          const bucket = values.slice(start, end);
          return bucket.reduce((sum, value) => sum + value, 0) / bucket.length;
        });
        const minimum = Math.min(...buckets);
        const range = Math.max(...buckets) - minimum || 1;
        const points = buckets.map((value, index) => {
          const x = (index / (bucketCount - 1)) * 100;
          const y = 78 - (((value - minimum) / range) * 56);
          return `${x.toFixed(2)}% ${y.toFixed(2)}%`;
        });
        return `polygon(${points.join(', ')}, 100% 100%, 0 100%)`;
      }

      function formatAverageDailyForint(value) {
        return `${Math.round(value).toLocaleString('hu-HU').replace(/\u00a0/g, ' ')} Ft`;
      }

      function summarizeAverageDailyFixture() {
        const rollingTotal = averageDailyFixture.values.reduce((sum, value) => sum + value, 0);
        const average = rollingTotal / averageDailyFixture.values.length;
        const spikeThreshold = average * 1.5;
        const spikeDays = averageDailyFixture.values
          .map((value, index) => value > spikeThreshold ? { day: index + 1, value } : null)
          .filter((entry) => entry != null);
        const bufferDays = average > 0
          ? Math.round(Math.max(0, averageDailyFixture.balance) / average)
          : null;
        return {
          rollingTotal,
          average,
          spikeThreshold,
          spikeDays,
          bufferDays,
          highestDay: Math.max(...averageDailyFixture.values),
        };
      }

      function getAverageDailyDimension(dimensionId) {
        const dimension = averageDailyDimensions.find((entry) => entry.id === dimensionId);
        if (!dimension) throw new Error(`Unknown average daily dimension: ${dimensionId}`);
        return dimension;
      }

      function summarizeAverageDailyDimensionFixture(
        dimensionId = averageDailyDefaultDimensionId,
        fixture = allTransactionMerchantFixture,
      ) {
        const dimension = getAverageDailyDimension(dimensionId);
        if (!Array.isArray(fixture) || fixture.length === 0) {
          throw new Error('Average daily spend requires complete transaction input');
        }
        const [referenceYear, referenceMonth, referenceDay] = averageDailyReferenceDate.split('-').map(Number);
        const referenceTimestamp = Date.UTC(referenceYear, referenceMonth - 1, referenceDay);
        let startTimestamp = referenceTimestamp;
        if (dimensionId === 'week') {
          const weekday = new Date(referenceTimestamp).getUTCDay() || 7;
          startTimestamp -= (weekday - 1) * 86400000;
        } else if (dimensionId === 'month') {
          startTimestamp = Date.UTC(referenceYear, referenceMonth - 1, 1);
        } else if (dimensionId === 'year') {
          startTimestamp = Date.UTC(referenceYear, 0, 1);
        }
        const observedDays = Math.floor((referenceTimestamp - startTimestamp) / 86400000) + 1;
        const values = Array.from({ length: observedDays }, () => 0);
        for (const transaction of fixture) {
          if (!transaction || !/^\d{4}-\d{2}-\d{2}$/.test(transaction.date || '') || !Number.isFinite(transaction.amount)) {
            throw new Error('Average daily spend transaction input is invalid');
          }
          const [year, month, day] = transaction.date.split('-').map(Number);
          const transactionTimestamp = Date.UTC(year, month - 1, day);
          const index = Math.floor((transactionTimestamp - startTimestamp) / 86400000);
          if (index >= 0 && index < values.length) values[index] += Math.abs(transaction.amount);
        }
        const total = values.reduce((sum, value) => sum + value, 0);
        const average = total / observedDays;
        const spikeThreshold = average * 1.5;
        const spikeDays = values
          .map((value, index) => value > spikeThreshold ? { day: index + 1, value } : null)
          .filter((entry) => entry != null);
        return {
          ...dimension,
          observedDays,
          total,
          average,
          values,
          chartValues: values.length === 1 ? [0, values[0]] : values,
          spikeThreshold,
          spikeDays,
          bufferDays: average > 0 ? Math.round(Math.max(0, averageDailyFixture.balance) / average) : null,
          highestDay: Math.max(...values),
        };
      }

      function getTopMerchantDimension(dimensionId) {
        const dimension = topMerchantDimensions.find((entry) => entry.id === dimensionId);
        if (!dimension) throw new Error(`Unknown Top merchants dimension: ${dimensionId}`);
        return dimension;
      }

      function isTopMerchantTransactionInDimension(transaction, dimensionId) {
        getTopMerchantDimension(dimensionId);
        if (!transaction || !/^\d{4}-\d{2}-\d{2}$/.test(transaction.date || '')) {
          throw new Error('Top merchants transaction date is invalid');
        }
        if (dimensionId === 'all') return true;
        if (dimensionId === 'year') return transaction.date.startsWith(topMerchantReferenceYear);
        return transaction.date.startsWith(topMerchantReferenceMonth);
      }

      function summarizeTopMerchantsFixture(
        fixture = allTransactionMerchantFixture,
        dimensionId = topMerchantDefaultDimensionId,
      ) {
        if (!Array.isArray(fixture) || fixture.length === 0) {
          throw new Error('Top merchants requires complete transaction input');
        }

        const merchantsByName = new Map();
        for (const transaction of fixture) {
          if (!isTopMerchantTransactionInDimension(transaction, dimensionId)) continue;
          if (
            typeof transaction.merchant !== 'string' ||
            !transaction.merchant ||
            !Number.isFinite(transaction.amount)
          ) {
            throw new Error('Top merchants transaction input is invalid');
          }

          const merchant = merchantsByName.get(transaction.merchant) || {
            merchant: transaction.merchant,
            icon: transaction.icon,
            avatarColor: transaction.avatarColor,
            transactionCount: 0,
            totalAmount: 0,
          };
          merchant.transactionCount += 1;
          merchant.totalAmount += Math.abs(transaction.amount);
          merchantsByName.set(transaction.merchant, merchant);
        }

        return [...merchantsByName.values()]
          .sort((left, right) =>
            right.transactionCount - left.transactionCount ||
            right.totalAmount - left.totalAmount ||
            left.merchant.localeCompare(right.merchant, 'hu')
          )
          .slice(0, 5);
      }

      function summarizeBudgetCategoryVendors(
        fixture = budgetCategoryVendorFixture,
        category,
        dimensionId = topMerchantDefaultDimensionId,
      ) {
        getTopMerchantDimension(dimensionId);
        if (!Array.isArray(fixture) || !fixture.length || typeof category !== 'string' || !category) {
          throw new Error('Budget category vendors requires a category and complete transaction input');
        }
        const vendorsByName = new Map();
        for (const transaction of fixture) {
          if (!isTopMerchantTransactionInDimension(transaction, dimensionId)) continue;
          if (transaction.category !== category) continue;
          if (
            typeof transaction.merchant !== 'string' ||
            !transaction.merchant ||
            !Number.isFinite(transaction.amount) ||
            transaction.amount < 0
          ) {
            throw new Error('Budget category vendor input is invalid');
          }
          const vendor = vendorsByName.get(transaction.merchant) || {
            merchant: transaction.merchant,
            icon: transaction.icon,
            avatarColor: transaction.avatarColor,
            totalAmount: 0,
          };
          vendor.totalAmount += transaction.amount;
          vendorsByName.set(transaction.merchant, vendor);
        }
        const vendors = [...vendorsByName.values()]
          .sort((left, right) => right.totalAmount - left.totalAmount || left.merchant.localeCompare(right.merchant, 'hu'));
        const totalAmount = vendors.reduce((total, vendor) => total + vendor.totalAmount, 0);
        return vendors.map((vendor) => ({
          ...vendor,
          sharePercent: totalAmount > 0 ? Math.round((vendor.totalAmount / totalAmount) * 100) : 0,
        }));
      }

      function summarizeNoSpendDimensionFixture(dimensionId = topMerchantDefaultDimensionId) {
        getTopMerchantDimension(dimensionId);
        const summary = noSpendDimensionFixture[dimensionId];
        if (
          !summary ||
          summary.noSpendDays < 0 ||
          summary.observedDays <= 0 ||
          summary.noSpendDays > summary.observedDays
        ) {
          throw new Error('No-spend dimension fixture is invalid');
        }
        return { ...summary };
      }

      function getNoSpendFastInfoDimension(dimensionId) {
        const dimension = noSpendFastInfoDimensions.find((entry) => entry.id === dimensionId);
        if (!dimension) throw new Error('Unknown No-spend FastInfo dimension: ' + dimensionId);
        return dimension;
      }

      function summarizeNoSpendFastInfoDimension(dimensionId = noSpendFastInfoDefaultDimensionId) {
        const dimension = getNoSpendFastInfoDimension(dimensionId);
        if (dimension.id === 'week') {
          return {
            noSpendDays: todayRedesignFixture.noSpendDays,
            observedDays: todayRedesignFixture.noSpendWindowDays,
          };
        }
        return summarizeNoSpendDimensionFixture(dimension.id);
      }

      function summarizeTrendComparisonFixture(series = trendDailySeriesFixture) {
        const previousTotal = series.previous.reduce((sum, value) => sum + value, 0);
        const currentTotal = series.current.reduce((sum, value) => sum + value, 0);
        const relativeChange = previousTotal > 0
          ? ((currentTotal - previousTotal) / previousTotal) * 100
          : 0;
        return {
          previousTotal,
          currentTotal,
          percentage: Math.round(Math.abs(relativeChange)),
          direction: relativeChange > 0 ? 'up' : relativeChange < 0 ? 'down' : 'flat',
        };
      }

      function getVariableBudgetDimension(dimensionId) {
        const dimension = variableBudgetDimensions.find((entry) => entry.id === dimensionId);
        if (!dimension) throw new Error('Unknown variable budget dimension: ' + dimensionId);
        return dimension;
      }

      function summarizeVariableBudgetDimensionFixture(dimensionId = variableBudgetDefaultDimensionId) {
        const dimension = getVariableBudgetDimension(dimensionId);
        const source = variableBudgetDimensionFixture[dimensionId];
        if (
          !source ||
          !Number.isFinite(source.remaining) ||
          !Number.isFinite(source.spent) ||
          !Number.isInteger(source.transactionCount) ||
          !Number.isFinite(source.budget) ||
          source.remaining < 0 ||
          source.spent < 0 ||
          source.transactionCount <= 0 ||
          source.budget <= 0 ||
          Math.abs(source.remaining + source.spent - source.budget) > .01
        ) {
          throw new Error('Variable budget dimension fixture is invalid');
        }
        const progress = Math.round((source.spent / source.budget) * 10000) / 100;
        if (progress < 0 || progress > 100) throw new Error('Variable budget progress is invalid');
        return {
          ...dimension,
          ...source,
          progress,
          progressLabel: source.progressLabel || String(Math.round(progress)) + '%',
        };
      }

        return {

          progress,
        };
