      function renderContextualVisual(card) {
        const line = (path, dotX = 280, dotY = 9) => `
          <path class="common-balance-mother-child-trend-grid" d="M0 12.5H280 M0 27.5H280 M0 42.5H280"></path>
          <path class="common-balance-mother-child-trend-area" d="${path} L280 55 L0 55 Z"></path>
          <path class="common-balance-mother-child-trend-line" d="${path}"></path>
          <circle class="common-balance-mother-child-trend-dot" cx="${dotX}" cy="${dotY}" r="3.5"></circle>`;
        const rect = (x, y, width, height, fill) => `<rect x="${x}" y="${y}" width="${width}" height="${height}" rx="2" fill="${fill}"></rect>`;

        switch (card.visual) {
          case 'threshold':
            return `${rect(0, 24, 280, 8, 'rgba(20,33,58,.10)')}${rect(0, 24, 162, 8, '#ef3f5f')}<path d="M184 15V41" stroke="#1ea8a0" stroke-width="2"></path><circle cx="162" cy="28" r="4" fill="#ffffff" stroke="#ef3f5f" stroke-width="2"></circle>`;
          case 'weekly-bars':
            return [
              [17, '#1ea8a0'],
              [43, '#ef3f5f'],
              [29, '#f7b500'],
              [35, '#ef3f5f'],
              [10, 'rgba(20,33,58,.16)'],
              [6, 'rgba(20,33,58,.16)'],
              [4, 'rgba(20,33,58,.16)'],
            ].map(([value, color], index) => rect(index * 40 + 5, 51 - value, 23, value, color)).join('');
          case 'monthly-comparison':
            return `${line('M0 43 C20 36, 36 41, 56 28 S92 17, 112 24 S150 31, 170 18 S216 13, 240 18 S266 10, 280 7', 280, 7)}<path d="M0 35 C22 30, 38 35, 60 24 S101 27, 121 15 S166 25, 187 18 S232 24, 280 12" fill="none" stroke="rgba(20,33,58,.36)" stroke-width="1.7" stroke-dasharray="3 3"></path><path d="M0 48 C18 43, 38 45, 58 35 S98 34, 118 30 S154 38, 176 27 S220 32, 244 24 S266 25, 280 19" fill="none" stroke="rgba(30,168,160,.42)" stroke-width="1.5" stroke-dasharray="2 4"></path>`;
          case 'zone-meter':
            return `${rect(0, 23, 88, 11, 'rgba(30,168,160,.24)')}${rect(92, 23, 94, 11, 'rgba(247,181,0,.22)')}${rect(190, 23, 90, 11, 'rgba(239,63,95,.22)')}<path d="M212 15V42" stroke="#ef3f5f" stroke-width="3"></path><circle cx="212" cy="28" r="4" fill="#ffffff" stroke="#ef3f5f" stroke-width="2"></circle>`;
          case 'forecast-band':
            return `${rect(0, 16, 280, 27, 'rgba(30,168,160,.12)')}<path d="M0 41 C38 39, 62 36, 94 31 S142 28, 171 21 S230 16, 280 9" fill="none" stroke="#1ea8a0" stroke-width="2.4"></path><path d="M0 47 C38 45, 62 42, 94 37 S142 34, 171 28 S230 23, 280 16" fill="none" stroke="#ef3f5f" stroke-width="1.6" stroke-dasharray="3 3"></path><path d="M244 6V49" stroke="#ef3f5f" stroke-width="2"></path>`;
          case 'activity-strip':
            return [6, 12, 5, 19, 9, 3, 15, 7, 20, 4, 11, 2, 16, 6].map((value, index) => `<circle cx="${index * 21 + 7}" cy="${50 - value}" r="${Math.max(2, value / 4)}" fill="#1ea8a0" opacity="${.25 + value / 28}"></circle>`).join('');
          case 'spike-line':
            return `${line('M0 42 L20 34 L40 43 L60 22 L80 36 L100 31 L120 46 L140 7 L160 37 L180 29 L200 44 L220 14 L240 34 L260 26 L280 30', 140, 7)}<circle cx="220" cy="14" r="3.5" fill="#ffffff" stroke="#ef3f5f" stroke-width="2.4"></circle>`;
          case 'seven-day-strip':
            return [true, false, true, false, true, false, false].map((good, index) => `${rect(index * 39 + 5, 17, 27, 27, good ? 'rgba(30,168,160,.72)' : 'rgba(239,63,95,.35)')}${index === 6 ? '<rect x="239" y="11" width="39" height="39" rx="5" fill="none" stroke="#06B6D4" stroke-width="2"></rect>' : ''}`).join('');
          case 'mini-avatar-row':
            return [
              [52, '#1ea8a0', 'utensils.svg'],
              [140, '#f7b500', 'utensils.svg'],
              [228, '#ef3f5f', 'house.svg'],
            ].map(([x, color, icon]) => `<circle cx="${x}" cy="28" r="17" fill="${color}"></circle><image href="/assets/icons/lucide/${icon}" x="${x - 9}" y="19" width="18" height="18" style="filter:brightness(0) invert(1)"></image>`).join('');
          case 'income-comparison':
            return `${rect(44, 23, 52, 28, 'rgba(20,33,58,.22)')}${rect(116, 15, 52, 36, '#1ea8a0')}${rect(188, 10, 52, 41, '#1ea8a0')}`;
          default:
            return '';
        }
      }

      function populateFacts(panel, facts) {
        const container = panel.querySelector('.common-balance-mother-child-facts');
        const doc = panel.ownerDocument;
        container.replaceChildren(...facts.map((fact) => {
          const row = doc.createElement('div');
          row.className = `common-balance-mother-child-fact${fact.tone === 'expense' ? ' expense' : ''}`;
          if (fact.avatar) {
            row.classList.add('has-category-avatar');
            row.append(createFactAvatar(doc, fact.avatar), doc.createTextNode(fact.text));
          } else {
            row.textContent = fact.text;
          }
          return row;
        }));
      }

      function createFactAvatar(doc, avatar) {
        const badge = doc.createElement('span');
        badge.className = 'common-balance-mother-child-fact-avatar';
        badge.setAttribute('aria-hidden', 'true');
        badge.style.setProperty('--fact-avatar-color', avatar.color);

        const icon = doc.createElement('span');
        icon.className = 'slot-icon';
        icon.style.setProperty('--icon-url', `url('/assets/icons/lucide/${avatar.icon}')`);
        icon.style.setProperty('--icon-size', '9px');
        icon.style.setProperty('--icon-color', '#ffffff');
        badge.append(icon);
        return badge;
      }

      function populateVisual(panel, card) {
        const trend = panel.querySelector('.common-balance-mother-child-trend');
        if (card.hideStage2Visual || card.visual === 'transaction-event') {
          trend.remove();
          return;
        }
        trend.setAttribute('data-fastinfo-visual', card.visual);
        setText(trend, '.common-balance-mother-child-trend-head strong', card.visualTitle);
        setText(trend, '.common-balance-mother-child-trend-head span', card.visualRange);
        const axis = trend.querySelectorAll('.common-balance-mother-child-trend-axis span');
        if (axis[0]) axis[0].textContent = card.axisStart;
        if (axis[1]) axis[1].textContent = card.axisEnd;
        const svg = trend.querySelector('svg');
        svg.innerHTML = renderContextualVisual(card);
      }

      function attachTodayRedesignScrollInteraction(screen, headerViewport, transactionViewport) {
        const layout = screen.querySelector('.stage2-redesign-layout');
        const insightGrid = screen.querySelector('.stage2-redesign-insight-grid');
        const detailCarousel = screen.querySelector('.stage2-redesign-detail-carousel');
        const budgetPill = screen.querySelector('.stage2-redesign-budget-pill');
        const budgetPillBehavior = screen.dataset.todayBudgetPillBehavior || 'sticky';
        const keepsBudgetPill = budgetPillBehavior === 'sticky';
        const collapseDistance = 180;
        const expandedHeroHeight = 150;
        const collapsedHeroHeight = 104;
        const expandedInsightHeight = 128;
        const expandedDetailHeight = 210;
        const scrollStackGap = 11;
        const scrollContentHeroGap = 11;
        const compactBudgetPillHeight = 50;
        const collapsedHeaderContentGap = 4;
        const collapsedPostBudgetShift = -((expandedInsightHeight + (scrollStackGap * 2) + expandedDetailHeight) - collapseDistance - compactBudgetPillHeight - collapsedHeaderContentGap);
        const windowRef = screen.ownerDocument.defaultView;
        const reducedMotion = windowRef?.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
        if (!layout || !insightGrid || !detailCarousel || !budgetPill || !transactionViewport) {
          throw new Error('Today redesign scroll controller could not find its required surfaces');
        }

        const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
        let animationFrame = 0;

        const update = () => {
          animationFrame = 0;
          const scrollTop = Math.min(headerViewport.scrollTop, collapseDistance);
          if (headerViewport.scrollTop > collapseDistance) {
            headerViewport.scrollTop = collapseDistance;
          }
          const progress = clamp(scrollTop / collapseDistance);
          const insightProgress = clamp((progress - .03) / .62);
          const detailProgress = clamp((progress - .16) / .62);
          const pillProgress = keepsBudgetPill ? clamp((progress - .18) / .58) : 0;
          const disappearingPillActionGap = scrollContentHeroGap;
          const disappearingPillPostBudgetShift = -((expandedInsightHeight + (scrollStackGap * 2) + expandedDetailHeight) - scrollTop + scrollContentHeroGap - disappearingPillActionGap);
          const postBudgetShift = keepsBudgetPill ? collapsedPostBudgetShift : disappearingPillPostBudgetShift;
          const heroHeight = expandedHeroHeight - ((expandedHeroHeight - collapsedHeroHeight) * progress);
          const heroStatOpacity = 1 - clamp((progress - .08) / .52);

          layout.style.setProperty('--today-redesign-collapse-progress', progress.toFixed(3));
          layout.style.setProperty('--today-redesign-hero-height', `${heroHeight.toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-insight-opacity', (1 - insightProgress).toFixed(3));
          layout.style.setProperty('--today-redesign-insight-scale', (1 - (.1 * insightProgress)).toFixed(3));
          layout.style.setProperty('--today-redesign-insight-shift', `${(-18 * insightProgress).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-detail-opacity', (1 - detailProgress).toFixed(3));
          layout.style.setProperty('--today-redesign-detail-scale', (1 - (.04 * detailProgress)).toFixed(3));
          layout.style.setProperty('--today-redesign-detail-shift', `${(-24 * detailProgress).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-pill-opacity', pillProgress.toFixed(3));
          layout.style.setProperty('--today-redesign-pill-scale', (.96 + (.04 * pillProgress)).toFixed(3));
          layout.style.setProperty('--today-redesign-pill-shift', `${(-9 + (9 * pillProgress)).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-hero-stat-opacity', heroStatOpacity.toFixed(3));
          layout.style.setProperty('--today-redesign-hero-stat-shift', `${(10 * (1 - heroStatOpacity)).toFixed(2)}px`);
          layout.style.setProperty('--today-redesign-post-budget-shift', `${(postBudgetShift * detailProgress).toFixed(2)}px`);

          insightGrid.style.pointerEvents = insightProgress > .96 ? 'none' : 'auto';
          detailCarousel.style.pointerEvents = detailProgress > .96 ? 'none' : 'auto';
          budgetPill.style.pointerEvents = keepsBudgetPill && pillProgress > .12 ? 'auto' : 'none';
          budgetPill.setAttribute('aria-hidden', keepsBudgetPill && pillProgress > .12 ? 'false' : 'true');
          screen.dataset.todayRedesignState = progress > .98 ? 'collapsed' : progress > 0 ? 'collapsing' : 'expanded';
        };

        const updateTransactionScrollState = () => {
          const maxScrollTop = Math.max(0, transactionViewport.scrollHeight - transactionViewport.clientHeight);
          const scrollTop = transactionViewport.scrollTop;
          screen.dataset.todayTransactionScrollState = maxScrollTop === 0
            ? 'rest'
            : scrollTop <= 0
              ? 'top'
              : scrollTop >= maxScrollTop - 1
                ? 'end'
                : 'scrolling';
        };

        const scheduleUpdate = () => {
          if (animationFrame) return;
          animationFrame = windowRef.requestAnimationFrame(update);
        };

        const expand = () => {
          if (reducedMotion) {
            headerViewport.scrollTo({ top: 0, behavior: 'auto' });
            return;
          }
          headerViewport.scrollTo({ top: 0, behavior: 'smooth' });
        };

        headerViewport.addEventListener('scroll', scheduleUpdate, { passive: true });
        transactionViewport.addEventListener('scroll', updateTransactionScrollState, { passive: true });
        budgetPill.addEventListener('click', expand);
        update();
        updateTransactionScrollState();
      }

      function populateTrendAlternative(column, card) {
        const doc = column.ownerDocument;
        const screen = column.querySelector('[data-common-header-static-preview="strict-mother-child"]');
        const panel = column.querySelector('.common-balance-mother-child-panel');
        if (!panel) throw new Error('Color Lab B3M trend alternative panel was not found');

        column.setAttribute('data-stage2-alternative', 'trend-comparison');
        setText(column, '.screen-title', `B3M-A · ${card.title}`);
        screen?.setAttribute('data-stage2-alternative', 'trend-comparison');
        screen?.setAttribute('aria-label', `Balance ${card.title} két idősávos összevetés`);
        panel.classList.add('common-balance-trend-alternative');
        panel.setAttribute('aria-label', `${card.title} két idősávos összevetése`);

        const heading = createTrendAlternativeElement(doc, 'div', 'common-balance-trend-alternative-head');
        heading.append(
          createTrendAlternativeElement(doc, 'strong', '', card.title),
          createTrendAlternativeElement(doc, 'span', '', 'Változó költés'),
        );

        const windows = createTrendAlternativeElement(doc, 'div', 'common-balance-trend-alternative-windows');
        const previous = createTrendAlternativeElement(doc, 'article', 'common-balance-trend-alternative-window common-balance-trend-alternative-window--previous');
        previous.append(
          createTrendAlternativeElement(doc, 'span', '', 'Előző 30 nap'),
          createTrendAlternativeElement(doc, 'strong', '', '162 000 Ft'),
          createTrendAlternativeElement(doc, 'small', '', 'összehasonlítási alap'),
        );
        const bridge = createTrendAlternativeElement(doc, 'div', 'common-balance-trend-alternative-bridge');
        bridge.setAttribute('aria-hidden', 'true');
        const current = createTrendAlternativeElement(doc, 'article', 'common-balance-trend-alternative-window common-balance-trend-alternative-window--current');
        current.append(
          createTrendAlternativeElement(doc, 'span', '', 'Mostani 30 nap'),
          createTrendAlternativeElement(doc, 'strong', '', '191 100 Ft'),
          createTrendAlternativeElement(doc, 'small', '', 'jelenlegi gördülő ablak'),
        );
        windows.append(previous, bridge, current);

        const delta = createTrendAlternativeElement(doc, 'div', 'common-balance-trend-alternative-delta');
        const deltaCopy = doc.createElement('div');
        deltaCopy.append(
          createTrendAlternativeElement(doc, 'span', '', 'Eltérés a két ablak között'),
          createTrendAlternativeElement(doc, 'strong', '', '+29 100 Ft'),
        );
        delta.append(deltaCopy, createTrendAlternativeElement(doc, 'em', '', '+18%'));

          createTrendAlternativeElement(doc, 'span', '', 'Pulse akkor jelez'),
          createTrendAlternativeElement(doc, 'strong', '', '+15% és legalább +10 000 Ft felett'),
        );
        pulse.append(createTrendAlternativeElement(doc, 'i', ''), pulseCopy);

        panel.replaceChildren(
          heading,
          windows,
          delta,
          pulse,
          createTrendAlternativeElement(doc, 'div', 'common-balance-trend-alternative-scope', 'Gördülő ablakok, nem naptári hónapok. Fix és ismétlődő tételek kizárva.'),

      function buildTrendSparklineClipPath(values) {
        const bucketCount = 6;
        const buckets = Array.from({ length: bucketCount }, (_, bucketIndex) => {
          const start = Math.floor((bucketIndex * values.length) / bucketCount);
          const end = Math.floor(((bucketIndex + 1) * values.length) / bucketCount);
          const bucket = values.slice(start, end);
          return bucket.reduce((sum, value) => sum + value, 0) / bucket.length;
        });
        const minimum = Math.min(...buckets);
        const range = Math.max(...buckets) - minimum || 1;
        const points = buckets.map((value, index) => {
          const x = (index / (bucketCount - 1)) * 100;
          const y = 78 - (((value - minimum) / range) * 56);
          return `${x.toFixed(2)}% ${y.toFixed(2)}%`;
        });
        return `polygon(${points.join(', ')}, 100% 100%, 0 100%)`;
      }

      function formatAverageDailyForint(value) {
        return `${Math.round(value).toLocaleString('hu-HU').replace(/\u00a0/g, ' ')} Ft`;
      }

      function summarizeAverageDailyFixture() {
        const rollingTotal = averageDailyFixture.values.reduce((sum, value) => sum + value, 0);
        const average = rollingTotal / averageDailyFixture.values.length;
        const spikeThreshold = average * 1.5;
        const spikeDays = averageDailyFixture.values
          .map((value, index) => value > spikeThreshold ? { day: index + 1, value } : null)
          .filter((entry) => entry != null);
        const bufferDays = average > 0
          ? Math.round(Math.max(0, averageDailyFixture.balance) / average)
          : null;
        return {
          rollingTotal,
          average,
          spikeThreshold,
          spikeDays,
          bufferDays,
          highestDay: Math.max(...averageDailyFixture.values),
        };
      }

      function formatTodayRedesignForint(value) {
        return `${Math.round(value).toLocaleString('hu-HU').replace(/\u00a0/g, ' ')} Ft`;
      }

      function formatTodayRedesignSignedForint(value) {
        const sign = value > 0 ? '+' : value < 0 ? '-' : '';
        return `${sign}${formatTodayRedesignForint(Math.abs(value))}`;
      }

      function getTopMerchantDimension(dimensionId) {
        const dimension = topMerchantDimensions.find((entry) => entry.id === dimensionId);
        if (!dimension) throw new Error(`Unknown Top merchants dimension: ${dimensionId}`);
        return dimension;
      }

      function isTopMerchantTransactionInDimension(transaction, dimensionId) {
        getTopMerchantDimension(dimensionId);
        if (!transaction || !/^\d{4}-\d{2}-\d{2}$/.test(transaction.date || '')) {
          throw new Error('Top merchants transaction date is invalid');
        }
        if (dimensionId === 'all') return true;
        if (dimensionId === 'year') return transaction.date.startsWith(topMerchantReferenceYear);
        return transaction.date.startsWith(topMerchantReferenceMonth);
      }

      function summarizeTopMerchantsFixture(
        fixture = allTransactionMerchantFixture,
        dimensionId = topMerchantDefaultDimensionId,
      ) {
        if (!Array.isArray(fixture) || fixture.length === 0) {
          throw new Error('Top merchants requires complete transaction input');
        }

        const merchantsByName = new Map();
        for (const transaction of fixture) {
          if (!isTopMerchantTransactionInDimension(transaction, dimensionId)) continue;
          if (
            typeof transaction.merchant !== 'string' ||
            !transaction.merchant ||
            !Number.isFinite(transaction.amount)
          ) {
            throw new Error('Top merchants transaction input is invalid');
          }

          const merchant = merchantsByName.get(transaction.merchant) || {
            merchant: transaction.merchant,
            icon: transaction.icon,
            avatarColor: transaction.avatarColor,
            transactionCount: 0,
            totalAmount: 0,
          };
          merchant.transactionCount += 1;
          merchant.totalAmount += Math.abs(transaction.amount);
          merchantsByName.set(transaction.merchant, merchant);
        }

        return [...merchantsByName.values()]
          .sort((left, right) =>
            right.transactionCount - left.transactionCount ||
            right.totalAmount - left.totalAmount ||
            left.merchant.localeCompare(right.merchant, 'hu')
          )
          .slice(0, 5);
      }

      function summarizeNoSpendDimensionFixture(dimensionId = topMerchantDefaultDimensionId) {
        getTopMerchantDimension(dimensionId);
        const summary = noSpendDimensionFixture[dimensionId];
        if (
          !summary ||
          summary.noSpendDays < 0 ||
          summary.observedDays <= 0 ||
          summary.noSpendDays > summary.observedDays
        ) {
          throw new Error('No-spend dimension fixture is invalid');
        }
        return { ...summary };
      }

      function summarizeTrendComparisonFixture(series = trendDailySeriesFixture) {
        const previousTotal = series.previous.reduce((sum, value) => sum + value, 0);
        const currentTotal = series.current.reduce((sum, value) => sum + value, 0);
        const relativeChange = previousTotal > 0
          ? ((currentTotal - previousTotal) / previousTotal) * 100
          : 0;
        return {
          previousTotal,
          currentTotal,
          percentage: Math.round(Math.abs(relativeChange)),
          direction: relativeChange > 0 ? 'up' : relativeChange < 0 ? 'down' : 'flat',
        };
      }

      function getVariableBudgetDimension(dimensionId) {
        const dimension = variableBudgetDimensions.find((entry) => entry.id === dimensionId);
        if (!dimension) throw new Error('Unknown variable budget dimension: ' + dimensionId);
        return dimension;
      }

      function summarizeVariableBudgetDimensionFixture(dimensionId = variableBudgetDefaultDimensionId) {
        const dimension = getVariableBudgetDimension(dimensionId);
        const source = variableBudgetDimensionFixture[dimensionId];
        if (
          !source ||
          !Number.isFinite(source.remaining) ||
          !Number.isFinite(source.spent) ||
          !Number.isInteger(source.transactionCount) ||
          !Number.isFinite(source.budget) ||
          source.remaining < 0 ||
          source.spent < 0 ||
          source.transactionCount <= 0 ||
          source.budget <= 0 ||
          Math.abs(source.remaining + source.spent - source.budget) > .01
        ) {
          throw new Error('Variable budget dimension fixture is invalid');
        }
        const progress = Math.round((source.spent / source.budget) * 10000) / 100;
        if (progress < 0 || progress > 100) throw new Error('Variable budget progress is invalid');
        return {
          ...dimension,
          ...source,
          progress,
          progressLabel: source.progressLabel || String(Math.round(progress)) + '%',
        };
      }

      function summarizeTodayRedesignFixture() {
        const dailyCeiling = todayRedesignFixture.variableExpense + todayRedesignFixture.dailyRemaining;
        const progress = dailyCeiling > 0
          ? (todayRedesignFixture.variableExpense / dailyCeiling) * 100
          : 0;
        return {
          ...todayRedesignFixture,
          dailyCeiling,
          progress,
        };
      }

      function attachTodayTimeScopeDrawer(screen) {
        const timeScope = screen.querySelector('.stage2-redesign-time-scope');
        if (!timeScope) return;

        const drawerToggle = timeScope.querySelector('.stage2-redesign-time-scope-toggle');
        const selectedYear = timeScope.querySelector('[data-time-scope-selected-year="true"]');
        const yearRail = timeScope.querySelector('.stage2-redesign-time-scope-year-rail');
        const yearButtons = [...timeScope.querySelectorAll('.stage2-redesign-time-scope-year-pill')];
        const paginationDots = [...timeScope.querySelectorAll('.stage2-redesign-time-scope-pagination-dot')];
        const windowRef = screen.ownerDocument.defaultView;
        if (!drawerToggle || !selectedYear || !yearRail || !yearButtons.length || !paginationDots.length) {
          throw new Error('Today time-scope drawer could not find its required controls');
        }

        const centerSelectedYear = () => {
          const selectedButton = yearButtons.find((yearButton) => yearButton.getAttribute('aria-pressed') === 'true');
          if (!selectedButton) return;
          const left = Math.max(0, selectedButton.offsetLeft - ((yearRail.clientWidth - selectedButton.offsetWidth) / 2));
          yearRail.scrollTo({ left, behavior: 'auto' });
        };

        const setExpanded = (expanded) => {
          timeScope.setAttribute('data-time-scope-drawer-state', expanded ? 'expanded' : 'collapsed');
          drawerToggle.setAttribute('aria-expanded', String(expanded));
          drawerToggle.setAttribute('aria-label', expanded ? 'Év finomítás bezárása' : 'Év finomítás megnyitása');
          yearRail.setAttribute('aria-hidden', String(!expanded));
          for (const yearButton of yearButtons) yearButton.disabled = !expanded;
          if (expanded) windowRef?.requestAnimationFrame(centerSelectedYear);
        };

        const setSelectedYear = (year) => {
          timeScope.setAttribute('data-time-scope-selected-year', year);
          selectedYear.textContent = year;
          for (const yearButton of yearButtons) {
            yearButton.setAttribute('aria-pressed', String(yearButton.dataset.timeScopeYear === year));
          }
          for (const dot of paginationDots) {
            dot.setAttribute('data-time-scope-pagination-state', dot.dataset.timeScopePaginationYear === year ? 'active' : 'idle');
          }
          windowRef?.requestAnimationFrame(centerSelectedYear);
        };

        setExpanded(false);
        drawerToggle.addEventListener('click', () => {
          setExpanded(timeScope.getAttribute('data-time-scope-drawer-state') !== 'expanded');
        });
        for (const yearButton of yearButtons) {
          yearButton.addEventListener('click', () => {
            setSelectedYear(yearButton.dataset.timeScopeYear);
          });
        }
      }

        if (screen.dataset.todayBudgetPillBehavior === 'exit') {
          timeScopeDrawer = createTodayTimeScopeDrawer(doc);
        }

        const transactionSection = createTodayRedesignElement(doc, 'section', 'stage2-redesign-transaction-section');
        transactionSection.append(createTodayRedesignElement(doc, 'strong', 'stage2-redesign-transaction-heading', 'Tranzakciók'));
        const transactionViewport = createTodayRedesignElement(doc, 'div', 'stage2-redesign-transaction-viewport');
        transactionViewport.setAttribute('aria-label', 'Tranzakciós napló');
        transactionViewport.setAttribute('data-today-swipe-region', 'transactions');
        const transactionDays = createTodayRedesignElement(doc, 'div', 'stage2-redesign-transaction-days');
        const transactionColors = ['#ff4b78', '#42cf82', '#7858f4', '#f49b36', '#16b9d4'];
        let transactionColorIndex = 0;
        for (const day of todayRedesignTransactionDays) {
          const transactionDay = createTodayRedesignElement(doc, 'section', 'stage2-redesign-transaction-day');
          transactionDay.setAttribute('data-transaction-date', day.date);
          const dayTitle = createTodayRedesignElement(doc, 'strong', 'stage2-redesign-transaction-day-title', day.date);
          const dayCard = createTodayRedesignElement(doc, 'div', 'stage2-redesign-transaction-day-card');
          for (const transaction of day.transactions) {
            const row = createTodayRedesignElement(doc, 'article', 'stage2-redesign-transaction-row');
            row.setAttribute('aria-label', `${transaction.merchant}, ${transaction.category}, -${formatTodayRedesignForint(transaction.amount)}, ${transaction.time}`);
            const avatar = createTodayRedesignElement(doc, 'span', 'stage2-redesign-transaction-avatar');
            avatar.style.setProperty('--today-redesign-transaction-color', transactionColors[transactionColorIndex % transactionColors.length]);
            transactionColorIndex += 1;
            const icon = createTodayRedesignElement(doc, 'span', 'slot-icon');
            icon.style.setProperty('--icon-url', `url('/assets/icons/lucide/${transaction.icon}')`);
            icon.style.setProperty('--icon-color', '#ffffff');
            avatar.append(icon);
            const copy = createTodayRedesignElement(doc, 'div', 'stage2-redesign-transaction-copy');
            copy.append(
              createTodayRedesignElement(doc, 'strong', '', transaction.merchant),
              createTodayRedesignElement(doc, 'span', '', transaction.category),
            );
            const value = createTodayRedesignElement(doc, 'div', 'stage2-redesign-transaction-value');
            value.append(
              createTodayRedesignElement(doc, 'strong', '', `-${formatTodayRedesignForint(transaction.amount)}`),
              createTodayRedesignElement(doc, 'span', '', transaction.time),
            );
            row.append(avatar, copy, value, createTodayRedesignElement(doc, 'i', 'stage2-redesign-transaction-receipt'));
            dayCard.append(row);
          }
          transactionDay.append(dayTitle, dayCard);
          transactionDays.append(transactionDay);
        }
        transactionViewport.append(transactionDays);
        transactionSection.append(transactionViewport);

        const budgetPill = createTodayRedesignElement(doc, 'button', 'stage2-redesign-budget-pill');
        budgetPill.type = 'button';
        budgetPill.setAttribute('aria-label', `Napi keret, ${remainingText}. Vissza a teljes nézethez.`);
        budgetPill.setAttribute('aria-hidden', 'true');
        const budgetPillIcon = createTodayRedesignElement(doc, 'span', 'stage2-redesign-budget-pill-icon');
        const budgetPillSlot = createTodayRedesignElement(doc, 'span', 'slot-icon');
        budgetPillSlot.style.setProperty('--icon-url', "url('/assets/icons/lucide/shopping-cart.svg')");
        budgetPillSlot.style.setProperty('--icon-color', '#ffffff');
        budgetPillIcon.append(budgetPillSlot);
        budgetPill.append(
          budgetPillIcon,
          createTodayRedesignElement(doc, 'span', 'stage2-redesign-budget-pill-label', 'Napi keret'),
          createTodayRedesignElement(doc, 'strong', 'stage2-redesign-budget-pill-amount', remainingText),
          createTodayRedesignElement(doc, 'span', 'stage2-redesign-budget-pill-chevron', '⌄'),
        );

        const postBudgetContent = createTodayRedesignElement(doc, 'div', 'stage2-redesign-post-budget-content');
        if (timeScopeDrawer) {
          postBudgetContent.append(actions, monthSummary, searchRow, timeScopeDrawer, transactionSection);
        } else {
          postBudgetContent.append(actions, monthSummary, searchRow, transactionSection);
        }
        scrollContent.append(insightGrid, detailCarousel, postBudgetContent);
        scrollViewport.append(scrollContent);
        const heroOverlay = createTodayRedesignElement(doc, 'section', 'stage2-redesign-hero-overlay');
        heroOverlay.append(hero);
        layout.append(scrollViewport, topbar, heroOverlay, budgetPill, sourceBottomNav);
        screen.replaceChildren(layout);
        attachTodayRedesignScrollInteraction(screen, scrollViewport, transactionViewport);
        attachTodayTimeScopeDrawer(screen);
      }

      function createPulseForecastGallery(doc) {
        const gallery = doc.createElement('section');
        gallery.className = 'pulse-forecast-gallery';
        gallery.setAttribute('aria-label', 'Pulse forecast grafikonok');
        gallery.setAttribute('data-pulse-forecast-gallery', 'true');
        const row = doc.createElement('div');
        row.className = 'pulse-forecast-gallery-row';
        for (const forecast of pulseForecastGalleryFixture) {
          const card = doc.createElement('article');
          card.className = 'pulse-forecast-card';
          card.setAttribute('data-pulse-forecast-card', forecast.id);
          const header = doc.createElement('header');
          header.className = 'pulse-forecast-card-header';
          const title = doc.createElement('strong');
          title.textContent = forecast.title;
          const reference = doc.createElement('span');
          reference.textContent = forecast.reference;
          header.append(title, reference);
          const description = doc.createElement('p');
          description.className = 'pulse-forecast-description';
          description.textContent = forecast.description;
          card.append(
            header,
            createPulseForecastChart(doc, forecast.chart, forecast.ariaLabel || forecast.title + ' · ' + forecast.reference),
            description,
          );
          row.append(card);
        }
        gallery.append(row);
        return gallery;
      }

      function setB3MContent(column, card, index) {
        const screen = column.querySelector('[data-common-header-static-preview="strict-mother-child"]');
        const previous = catalog[(index + catalog.length - 1) % catalog.length];
        const next = catalog[(index + 1) % catalog.length];
        const stage1Cards = column.querySelectorAll('.common-balance-stage1-card-grid .fastinfo-chart-card');
        const panel = column.querySelector('.common-balance-mother-child-panel');
        const slotIcon = column.querySelector('.common-balance-mother-child-avatar .slot-icon');
        const childLayer = column.querySelector('.common-balance-mother-child-layer');
        const headingDot = panel?.querySelector('.common-balance-mother-child-heading i');

        column.dataset.cardId = card.id;
        setText(column, '.screen-title', `B3M · ${card.title}`);
        screen?.setAttribute('aria-label', `Balance strict mother-child ${card.title}`);
        screen?.setAttribute('data-balance-scope', 'overview');
        screen?.removeAttribute('data-query-scoped');

        setStage1Card(stage1Cards[0], previous);
        setStage1Card(stage1Cards[1], card);
        setStage1Card(stage1Cards[2], next);
        stage1Cards[1]?.setAttribute('data-balance-mother-child-parent', card.id);
        stage1Cards[1]?.setAttribute('aria-label', `${card.title} kiválasztott anya insight`);
        childLayer?.setAttribute('data-balance-mother-child-child', card.id);
        panel?.setAttribute('aria-label', `${card.title} részletei`);

        if (slotIcon) slotIcon.style.setProperty('--icon-url', `url('/assets/icons/lucide/${card.icon}')`);
        setText(panel, '.common-balance-mother-child-heading span', card.title);
        if (card.hideStage2StatusDot) headingDot?.remove();
        setText(panel, '.common-balance-mother-child-merchant strong', card.childName);
        setText(panel, '.common-balance-mother-child-merchant span', card.childMeta);
        setText(panel, '.common-balance-mother-child-amount', card.childValue);
        populateShare(panel, card.share);
        populateFacts(panel, card.facts);
        populateVisual(panel, card);
        if (card.id === categoryChangeCardId) populateCategoryChangeBase(panel, card);
      }

      function renderExactB3M(doc) {
        const viewport = doc.getElementById('zoomViewport');
        const host = doc.getElementById('zoomHost');
        const surface = doc.getElementById('zoomSurface');
        const sourceColumn = doc.querySelector('[data-common-header-static-preview-column="strict-mother-child"]');
        if (!viewport || !host || !surface || !sourceColumn) throw new Error('Color Lab B3M zoom source was not found');
        if (!sourceColumn.querySelector('.common-header-stage2-mother-child')) throw new Error('Color Lab B3M header component was not found');
        if (!sourceColumn.querySelector('.common-balance-mother-child-panel')) throw new Error('Color Lab B3M child panel was not found');
        installTodayRedesignStyles(doc);
        installTodayRedesignInteractionStyles(doc);
        installPulseForecastGalleryStyles(doc);

        const mode = doc.createElement('section');
        mode.className = 'common-header-mode';
        mode.setAttribute('data-common-header-mode', 'balance');
        mode.setAttribute('data-exact-b3m-gallery', 'true');
        mode.setAttribute('data-upper-insight-card', trendCardId);
        const trendCard = catalog.find((card) => card.id === trendCardId);
        const topCategoriesCard = catalog.find((card) => card.id === topCategoriesCardId);
        const categoryChangeCard = catalog.find((card) => card.id === categoryChangeCardId);
        const latestTransactionCard = catalog.find((card) => card.id === latestTransactionCardId);
        const upcomingRecurringCard = catalog.find((card) => card.id === upcomingRecurringCardId);
        const averageDailyCard = catalog.find((card) => card.id === averageDailyCardId);
        if (!trendCard) throw new Error(`Unknown card: ${trendCardId}`);
        if (!topCategoriesCard) throw new Error(`Unknown card: ${topCategoriesCardId}`);
        if (!categoryChangeCard) throw new Error(`Unknown card: ${categoryChangeCardId}`);
        if (!latestTransactionCard) throw new Error(`Unknown card: ${latestTransactionCardId}`);
        if (!upcomingRecurringCard) throw new Error(`Unknown card: ${upcomingRecurringCardId}`);
        if (!averageDailyCard) throw new Error(`Unknown card: ${averageDailyCardId}`);
        const carouselCards = catalog.filter((card) =>
          card.id !== trendCardId &&
          card.id !== topCategoriesCardId &&
          card.id !== categoryChangeCardId &&
          card.id !== latestTransactionCardId &&
          card.id !== upcomingRecurringCardId &&
          card.id !== noSpendCardId &&
          card.id !== averageDailyCardId &&
          card.id !== topMerchantCardId,
        );
        const carouselRow = doc.createElement('div');
        carouselRow.className = 'common-header-row';
        carouselRow.setAttribute('data-section-row', 'exact-b3m-carousel');

        carouselCards.forEach((card) => {
          if (card.id === todayRedesignCardId) {
            const todayB3mAColumn = sourceColumn.cloneNode(true);
            todayB3mAColumn.setAttribute('data-today-budget-pill-behavior', 'exit');
            todayB3mAColumn.setAttribute('data-stage2-alternative', 'today-budget-pill-exit');
            setB3MContent(todayB3mAColumn, card, catalog.indexOf(card));
            populateTodayRedesignScreen(todayB3mAColumn, card, topCategoriesCard, categoryChangeCard, latestTransactionCard, averageDailyCard, trendCard, upcomingRecurringCard);
            carouselRow.append(todayB3mAColumn);
            return;
          }
          const column = sourceColumn.cloneNode(true);
          setB3MContent(column, card, catalog.indexOf(card));
          carouselRow.append(column);
        });

        const pulseForecastGallery = createPulseForecastGallery(doc);
        mode.append(carouselRow, pulseForecastGallery);
        surface.replaceChildren(mode);
        const carouselColumnCount = carouselRow.children.length;
        const pulseGalleryWidth = (pulseForecastGalleryFixture.length * 252) + ((pulseForecastGalleryFixture.length - 1) * 16) + 48;
        surface.style.minWidth = `max(calc((var(--screen-w) * ${carouselColumnCount}) + ${28 * (carouselColumnCount - 1) + 48}px), ${pulseGalleryWidth}px)`;
        surface.style.minHeight = 'calc(var(--screen-h) + 338px)';
        surface.setAttribute('data-exact-b3m-gallery', 'true');
        doc.documentElement.setAttribute('data-balance-stage2-exact-b3m', 'true');

        const setCanvasZoom = doc.defaultView.setCanvasZoom;
        if (typeof setCanvasZoom === 'function') {
          setCanvasZoom(.5);
        } else {
          surface.style.setProperty('--canvas-zoom', '.5');
          host.style.width = `${surface.offsetWidth * .5}px`;
          host.style.height = `${surface.offsetHeight * .5}px`;
        }
        viewport.scrollTo({ left: 0, top: 0, behavior: 'auto' });
      }

      frame.addEventListener('load', () => {
        try {
          renderExactB3M(frame.contentDocument);
          frame.dataset.ready = 'true';
        } catch (error) {
          console.error(error);
          frame.style.visibility = 'visible';
        }
      }, { once: true });
    })();
  </script>
