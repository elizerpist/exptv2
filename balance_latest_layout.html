        const selectedYear = isSummaryToggle
          ? screen.querySelector('[data-today-time-scope-summary-label="true"]')
          : timeScope.querySelector('[data-time-scope-selected-year="true"]');
        const yearRail = timeScope.querySelector('.stage2-redesign-time-scope-year-rail');
        const yearButtons = [...timeScope.querySelectorAll('.stage2-redesign-time-scope-year-pill')];
        const paginationDots = [...timeScope.querySelectorAll('.stage2-redesign-time-scope-pagination-dot')];
        const windowRef = screen.ownerDocument.defaultView;
        const primaryCycle = Math.floor((Math.max(...yearButtons.map((button) => Number(button.dataset.timeScopeCycle || 0))) + 1) / 2);
        if (!selectedYear || !yearRail || !yearButtons.length || !paginationDots.length || (!isPermanent && !drawerToggle) || (isSummaryToggle && !summaryToggle)) {
          throw new Error('Today time-scope drawer could not find its required controls');
        }

        let settleTimer = 0;
        let centeredScrollLeft = 0;
        const primaryYearButton = (year) => yearButtons.find((button) =>
          button.dataset.timeScopeYear === year && Number(button.dataset.timeScopeCycle || 0) === primaryCycle,
        );
        const keepInfiniteTickerCentered = () => {
          if (!isSummaryToggle) return;
          const primaryButtons = yearButtons.filter((button) => Number(button.dataset.timeScopeCycle || 0) === primaryCycle);
          const nextCycleFirstButton = yearButtons.find((button) => Number(button.dataset.timeScopeCycle || 0) === primaryCycle + 1);
          const primaryFirstButton = primaryButtons[0];
          if (!primaryFirstButton || !nextCycleFirstButton) return;
          const cycleWidth = nextCycleFirstButton.offsetLeft - primaryFirstButton.offsetLeft;
          if (cycleWidth <= 0) return;
          if (yearRail.scrollLeft < primaryFirstButton.offsetLeft - cycleWidth) {
            yearRail.scrollLeft += cycleWidth;
            centeredScrollLeft += cycleWidth;
          } else if (yearRail.scrollLeft > primaryFirstButton.offsetLeft + cycleWidth) {
            yearRail.scrollLeft -= cycleWidth;
            centeredScrollLeft -= cycleWidth;
          }
        };
        const updateTickerProximity = () => {
          const primaryButtons = yearButtons.filter((button) => Number(button.dataset.timeScopeCycle || 0) === primaryCycle);
          const slotDistance = primaryButtons.length > 1
            ? Math.max(1, primaryButtons[1].offsetLeft - primaryButtons[0].offsetLeft)
            : 1;
          const railCenter = yearRail.scrollLeft + (yearRail.clientWidth / 2);
          for (const yearButton of yearButtons) {
            const distance = Math.abs((yearButton.offsetLeft + (yearButton.offsetWidth / 2)) - railCenter);
            const scale = Math.max(.72, 1 - (Math.min(1, distance / (slotDistance * 2)) * .28));
            yearButton.style.setProperty('--time-scope-pill-scale', scale.toFixed(3));
          }
        };
        const centerSelectedYear = () => {
          const selectedButton = yearButtons.find((yearButton) => yearButton.getAttribute('aria-pressed') === 'true');
          if (!selectedButton) return;
          const left = Math.max(0, selectedButton.offsetLeft - ((yearRail.clientWidth - selectedButton.offsetWidth) / 2));
          centeredScrollLeft = left;
          yearRail.scrollTo({ left, behavior: 'auto' });
          updateTickerProximity();
        };

        const setExpanded = (expanded) => {
          const nextExpanded = isSummaryToggle ? expanded : isPermanent || expanded;
          timeScope.setAttribute('data-time-scope-drawer-state', nextExpanded ? 'expanded' : 'collapsed');
          if (drawerToggle) {
            drawerToggle.setAttribute('aria-expanded', String(nextExpanded));
            drawerToggle.setAttribute('aria-label', nextExpanded ? 'Év finomítás bezárása' : 'Év finomítás megnyitása');
          }
          if (summaryToggle) {
            summaryToggle.setAttribute('aria-expanded', String(nextExpanded));
            summaryToggle.setAttribute('aria-label', nextExpanded ? 'Év finomítás bezárása' : 'Év finomítás megnyitása');
          }
          yearRail.setAttribute('aria-hidden', String(!nextExpanded));
          for (const yearButton of yearButtons) yearButton.disabled = !nextExpanded;
          if (nextExpanded) windowRef?.requestAnimationFrame(centerSelectedYear);
        };

        const setSelectedYear = (year) => {
          const selectedButton = primaryYearButton(year);
          if (!selectedButton) return;
          timeScope.setAttribute('data-time-scope-selected-year', year);
          selectedYear.textContent = isSummaryToggle ? `${year} · Aktuális hónap` : year;
          for (const yearButton of yearButtons) {
            yearButton.setAttribute('aria-pressed', String(yearButton === selectedButton));
          }
          for (const dot of paginationDots) {
            dot.setAttribute('data-time-scope-pagination-state', dot.dataset.timeScopePaginationYear === year ? 'active' : 'idle');
          }
          centerSelectedYear();
        };

        const selectAdjacentYear = (direction) => {
          const activeButton = yearButtons.find((yearButton) => yearButton.getAttribute('aria-pressed') === 'true');
          if (!activeButton) return;
          const activeIndex = yearButtons.indexOf(activeButton);
          const adjacentButton = yearButtons[activeIndex + direction];
          if (!adjacentButton) return;
          setSelectedYear(adjacentButton.dataset.timeScopeYear);
        };

        const applyTickerThreshold = () => {
          const activeButton = yearButtons.find((yearButton) => yearButton.getAttribute('aria-pressed') === 'true');
          if (!activeButton) return;
          const activeIndex = yearButtons.indexOf(activeButton);
          const residual = yearRail.scrollLeft - centeredScrollLeft;
          const nextButton = yearButtons[activeIndex + (residual >= 0 ? 1 : -1)];
          if (!nextButton) return;
          const triggerDistance = Math.abs(nextButton.offsetLeft - activeButton.offsetLeft) / 2;
          if (residual >= triggerDistance) {
            selectAdjacentYear(1);
            return;
          }
          if (residual <= -triggerDistance) {
            selectAdjacentYear(-1);
          }
        };

        setExpanded(isSummaryToggle ? startsExpanded : isPermanent || startsExpanded);
        if (summaryToggle) {
          summaryToggle.addEventListener('click', () => {
            setExpanded(timeScope.getAttribute('data-time-scope-drawer-state') !== 'expanded');
          });
        }
        if (drawerToggle) {
          drawerToggle.addEventListener('click', () => {
            setExpanded(timeScope.getAttribute('data-time-scope-drawer-state') !== 'expanded');
          });
        }
        for (const yearButton of yearButtons) {
          yearButton.addEventListener('click', () => {
            setSelectedYear(yearButton.dataset.timeScopeYear);
          });
        }
        if (isSummaryToggle) {
          yearRail.addEventListener('scroll', () => {
            keepInfiniteTickerCentered();
            updateTickerProximity();
            applyTickerThreshold();
            if (settleTimer) windowRef?.clearTimeout(settleTimer);
            settleTimer = windowRef?.setTimeout(() => {
              windowRef?.requestAnimationFrame(centerSelectedYear);
            }, 90) || 0;
          }, { passive: true });
        }
      }

      function createTodayRedesignInsightCard(doc, config) {
        const {
          id,
          variant = '',
          title,
          icon,
          iconColor = '#5f55ec',
          iconGlyph,
          value,
          secondary,
          layout = 'three-line',
          direction = null,
          ghostTransactionsIncluded = true,
        } = config;
        const card = createTodayRedesignElement(
          doc,
          'article',
          `stage2-redesign-insight-card ${variant}`.trim(),
        );
        card.setAttribute('data-insight-card', id);
        card.setAttribute('data-insight-layout', layout);
        const head = createTodayRedesignElement(doc, 'div', 'stage2-redesign-insight-head');
        const iconWrap = createTodayRedesignElement(doc, 'span', 'stage2-redesign-insight-icon');
        if (icon) {
          const slot = createTodayRedesignElement(doc, 'span', 'slot-icon');
          slot.style.setProperty('--icon-url', `url('/assets/icons/lucide/${icon}')`);
          slot.style.setProperty('--icon-color', iconColor);
          iconWrap.append(slot);
        } else {
          iconWrap.append(createTodayRedesignElement(doc, 'span', 'stage2-redesign-insight-icon-glyph', iconGlyph || '•'));
        }
        head.append(iconWrap, createTodayRedesignElement(doc, 'strong', 'stage2-redesign-insight-title', title));

        const body = createTodayRedesignElement(doc, 'div', 'stage2-redesign-insight-body');
        const valueElement = createTodayRedesignElement(doc, 'strong', 'stage2-redesign-insight-value', value);
        if (direction) {
          const directionGlyph = direction === 'up' ? '↑' : direction === 'down' ? '↓' : '→';
          const directionElement = createTodayRedesignElement(doc, 'span', 'stage2-redesign-insight-direction', directionGlyph);
          directionElement.setAttribute('data-direction', direction);
          directionElement.setAttribute('aria-hidden', 'true');
          valueElement.append(directionElement);
        }
        const secondaryElement = createTodayRedesignElement(doc, 'span', 'stage2-redesign-insight-meta', secondary);
        body.append(valueElement, secondaryElement);

        const ghostToggle = createTodayRedesignElement(doc, 'button', 'stage2-redesign-insight-ghost-toggle');
        ghostToggle.type = 'button';
        ghostToggle.setAttribute('data-ghost-transaction-toggle', id);

        const setGhostTransactionsIncluded = (nextValue) => {
          includeGhostTransactions = Boolean(nextValue);
          card.setAttribute('data-include-ghost-transactions', String(includeGhostTransactions));

        };
        ghostToggle.addEventListener('click', () => setGhostTransactionsIncluded(!includeGhostTransactions));
        setGhostTransactionsIncluded(includeGhostTransactions);
        card.append(head, body, ghostToggle);
        return { card, body, valueElement, secondaryElement, ghostToggle, setGhostTransactionsIncluded };

      function installB3MA3IncomeWallet(doc, permanentBalanceColumn) {
        if (
          !doc ||
          !permanentBalanceColumn ||
          permanentBalanceColumn.dataset.stage2Alternative !== 'today-time-rail-permanent'
        ) {
          throw new Error('Income wallet requires the permanent B3M-A3 column');
        }
        const incomeActions = Array.from(
          permanentBalanceColumn.querySelectorAll('.stage2-redesign-income-action'),
        );
        if (incomeActions.length !== 1) {
          throw new Error('Income wallet requires exactly one B3M-A3 income action');
        }
        const incomeAction = incomeActions[0];
        const arrows = Array.from(incomeAction.querySelectorAll('.stage2-redesign-action-arrow'));
        if (arrows.length !== 1) {
          throw new Error('Income wallet requires exactly one B3M-A3 income action arrow');
        }
        const actionArts = Array.from(incomeAction.querySelectorAll('.stage2-redesign-action-art'));
        if (actionArts.length !== 1) {
          throw new Error('Income wallet requires exactly one B3M-A3 income action art');
        }
        if (!incomeAction.parentElement) {
          throw new Error('B3M-A3 income action grid was not found');
        }
        const arrow = arrows[0];
        const actionArt = actionArts[0];

        const shell = doc.createElement('div');
        shell.className = 'stage2-redesign-income-wallet-shell';
        shell.setAttribute('data-b3ma3-income-wallet-shell', 'true');

      function installB3MA3ExpenseBag(doc, permanentBalanceColumn) {
        if (
          !doc ||
          !permanentBalanceColumn ||
          permanentBalanceColumn.dataset.stage2Alternative !== 'today-time-rail-permanent'
        ) {
          throw new Error('Expense bag requires the permanent B3M-A3 column');
        }
        const expenseActions = Array.from(
          permanentBalanceColumn.querySelectorAll('.stage2-redesign-expense-action'),
        );
        if (expenseActions.length !== 1) {
          throw new Error('Expense bag requires exactly one B3M-A3 expense action');
        }
        const expenseAction = expenseActions[0];
        const arrows = Array.from(expenseAction.querySelectorAll('.stage2-redesign-action-arrow'));
        if (arrows.length !== 1) {
          throw new Error('Expense bag requires exactly one B3M-A3 expense action arrow');
        }
        const actionArts = Array.from(expenseAction.querySelectorAll('.stage2-redesign-action-art'));
        if (actionArts.length !== 1) {
          throw new Error('Expense bag requires exactly one B3M-A3 expense action art');
        }
        if (!expenseAction.parentElement) {
          throw new Error('B3M-A3 expense action grid was not found');
        }
        const arrow = arrows[0];
        const actionArt = actionArts[0];

        const shell = doc.createElement('div');
        shell.className = 'stage2-redesign-expense-bag-shell';
        shell.setAttribute('data-b3ma3-expense-bag-shell', 'true');
        const bagClip = doc.createElement('span');
        bagClip.className = 'stage2-redesign-expense-bag-clip';
        bagClip.setAttribute('aria-hidden', 'true');
        bagClip.setAttribute('data-b3ma3-expense-bag-clip', 'true');
        const bag = createB3MA3AdaptiveExpenseBag(doc);
        bagClip.append(bag);
        arrow.remove();
        actionArt.remove();
        expenseAction.replaceWith(shell);
        shell.append(expenseAction, bagClip);
        expenseAction.setAttribute('data-b3ma3-expense-bag-host', 'true');
        return bag;
      }

      function installB3MA3ActionToggle(doc, permanentBalanceColumn) {
        const allowsDerivedClone = arguments[2] === true;
        if (
          !doc ||
          !permanentBalanceColumn ||
          (!allowsDerivedClone &&
            permanentBalanceColumn.dataset.stage2Alternative !== 'today-time-rail-permanent')
        ) {
          throw new Error('Action toggle requires the permanent B3M-A3 column');
        }

        const actionGrids = Array.from(
          permanentBalanceColumn.querySelectorAll('.stage2-redesign-action-grid'),
        );
        const incomeShells = Array.from(
          permanentBalanceColumn.querySelectorAll('.stage2-redesign-income-wallet-shell'),
        );
        const expenseShells = Array.from(
          permanentBalanceColumn.querySelectorAll('.stage2-redesign-expense-bag-shell'),
        );
        if (actionGrids.length !== 1 || incomeShells.length !== 1 || expenseShells.length !== 1) {
          throw new Error('Action toggle requires exactly one retained action grid and two adaptive shells');
        }

        const actionGrid = actionGrids[0];
        const incomeShell = incomeShells[0];
        const expenseShell = expenseShells[0];
        const incomeActions = Array.from(
          incomeShell.querySelectorAll('.stage2-redesign-income-action'),
        );
        const expenseActions = Array.from(
          expenseShell.querySelectorAll('.stage2-redesign-expense-action'),
        );
        if (incomeActions.length !== 1 || expenseActions.length !== 1) {
          throw new Error('Action toggle requires exactly one semantic button in each adaptive shell');
        }

        const incomeAction = incomeActions[0];
        const expenseAction = expenseActions[0];
        const setActionState = (shell, action, isActive) => {
          const state = isActive ? 'active' : 'inactive';
          shell.setAttribute('data-b3ma3-action-state', state);
          action.setAttribute('data-b3ma3-action-state', state);
          action.setAttribute('aria-pressed', String(isActive));
        };
        const restartActionPulse = (shell) => {
          incomeShell.removeAttribute('data-b3ma3-action-pulse');
          expenseShell.removeAttribute('data-b3ma3-action-pulse');
          void shell.offsetWidth;
          shell.setAttribute('data-b3ma3-action-pulse', 'true');
        };
        const setActiveAction = (nextAction, shouldPulse = false) => {
          if (nextAction !== 'income' && nextAction !== 'expense') {
            throw new Error('Active B3M-A3 action must be income or expense');
          }
          const incomeIsActive = nextAction === 'income';
          actionGrid.setAttribute('data-b3ma3-active-action', nextAction);
          setActionState(incomeShell, incomeAction, incomeIsActive);
          setActionState(expenseShell, expenseAction, !incomeIsActive);
          if (shouldPulse) {
            restartActionPulse(incomeIsActive ? incomeShell : expenseShell);
          }
          return nextAction;
        };

        actionGrid.setAttribute('role', 'group');
        actionGrid.setAttribute('aria-label', 'Tranzakció típusa');
        actionGrid.setAttribute('data-b3ma3-action-toggle', 'true');
        incomeAction.addEventListener('click', () => setActiveAction('income', true));
        expenseAction.addEventListener('click', () => setActiveAction('expense', true));
        setActiveAction('income');
        return Object.freeze({ setActiveAction });
      }

      function populateTodayRedesignScreen(column, card, topCategoriesCard, categoryChangeCard, latestTransactionCard, averageDailyCard, trendCard, upcomingRecurringCard) {
        const { doc, screen, sourceBrand, sourceBottomNav } = prepareTodayRedesignScreen(column, card);
        const summary = summarizeTodayRedesignFixture();
        if (!topCategoriesCard || !Array.isArray(topCategoriesCard.categoryPeriods) || topCategoriesCard.categoryPeriods.length !== 3) {
          throw new Error('Today redesign requires three structured Top categories period facts');
        }
        if (!categoryChangeCard) {
          throw new Error('Today redesign requires the category-change catalog card');
        }
        if (!latestTransactionCard) {
          throw new Error('Today redesign requires the Latest transaction catalog card');
        }
        if (!averageDailyCard) {
          throw new Error('Today redesign requires the Average daily catalog card');
        }
        if (!trendCard) {
          throw new Error('Today redesign requires the 30-day rhythm catalog card');
        }
        if (!upcomingRecurringCard || !upcomingRecurringCard.childName || !upcomingRecurringCard.motherValue || !upcomingRecurringCard.upcomingDate) {
          throw new Error('Today redesign requires the upcoming recurring transaction catalog card');
        }
        if (!sourceBottomNav) throw new Error('Today redesign requires the B3M bottom navigation');
        sourceBottomNav.setAttribute('data-b3m-shared-bottom-nav', 'true');
        const topCategoryPeriods = topCategoriesCard.categoryPeriods;
        const balanceText = `-${formatTodayRedesignForint(summary.balance)}`;
        const reserveText = `${summary.reservePercent}%`;
        const incomeText = `${summary.incomeRatio}%`;
        const expenseText = `${summary.expenseRatio}%`;
        const largestCategoryText = summary.largestCategory;
        const remainingText = formatTodayRedesignForint(summary.dailyRemaining);
        const monthText = `-${formatTodayRedesignForint(summary.monthTotal)}`;

        const layout = createTodayRedesignElement(doc, 'main', 'stage2-redesign-layout');
        const scrollViewport = createTodayRedesignElement(doc, 'section', 'stage2-redesign-scroll-viewport');
        scrollViewport.setAttribute('aria-label', 'Mai költés görgethető tartalom');

        const topbar = createTodayRedesignElement(doc, 'header', 'stage2-redesign-topbar');
        const brand = sourceBrand || createTodayRedesignElement(doc, 'div', 'stage2-redesign-brand');
        brand.className = 'stage2-redesign-brand';

          const brandCopy = createTodayRedesignElement(doc, 'div', 'spendee-copy');

        topbar.append(brand);

        const hero = createTodayRedesignElement(doc, 'section', 'stage2-redesign-balance-hero');
        hero.style.setProperty('--today-redesign-reserve', reserveText);
        const reserve = createTodayRedesignElement(doc, 'div', 'stage2-redesign-reserve');
        reserve.append(
          createTodayRedesignElement(doc, 'span', 'stage2-redesign-hero-stat-title', 'Tartalék'),
          (() => {
            const value = createTodayRedesignElement(doc, 'div', 'stage2-redesign-reserve-value');

            meter.append(createTodayRedesignElement(doc, 'i', ''));

        );
        const ratio = createTodayRedesignElement(doc, 'div', 'stage2-redesign-ratio');

        hero.append(

      function createPulseForecastGallery(doc) {
        const gallery = doc.createElement('section');
        gallery.className = 'pulse-forecast-gallery';
        gallery.setAttribute('aria-label', 'Pulse forecast grafikonok');
        gallery.setAttribute('data-pulse-forecast-gallery', 'true');
        const row = doc.createElement('div');
        row.className = 'pulse-forecast-gallery-row';
        for (const forecast of pulseForecastGalleryFixture) {
          const card = doc.createElement('article');
          card.className = 'pulse-forecast-card';
          card.setAttribute('data-pulse-forecast-card', forecast.id);
          const header = doc.createElement('header');
          header.className = 'pulse-forecast-card-header';
          const title = doc.createElement('strong');
          title.textContent = forecast.title;
          const reference = doc.createElement('span');
          reference.textContent = forecast.reference;
          header.append(title, reference);
          const description = doc.createElement('p');
          description.className = 'pulse-forecast-description';
          description.textContent = forecast.description;
          card.append(
            header,
            createPulseForecastChart(doc, forecast.chart, forecast.ariaLabel || forecast.title + ' · ' + forecast.reference),
            description,
          );
          row.append(card);
        }
        gallery.append(row);
        return gallery;
      }

      function setB3MContent(column, card, index) {
        const screen = column.querySelector('[data-common-header-static-preview="strict-mother-child"]');
        const previous = catalog[(index + catalog.length - 1) % catalog.length];
        const next = catalog[(index + 1) % catalog.length];
        const stage1Cards = column.querySelectorAll('.common-balance-stage1-card-grid .fastinfo-chart-card');
        const panel = column.querySelector('.common-balance-mother-child-panel');
        const slotIcon = column.querySelector('.common-balance-mother-child-avatar .slot-icon');
        const childLayer = column.querySelector('.common-balance-mother-child-layer');
        const headingDot = panel?.querySelector('.common-balance-mother-child-heading i');

        column.dataset.cardId = card.id;
        setText(column, '.screen-title', `B3M · ${card.title}`);
        screen?.setAttribute('aria-label', `Balance strict mother-child ${card.title}`);
        screen?.setAttribute('data-balance-scope', 'overview');
        screen?.removeAttribute('data-query-scoped');

        setStage1Card(stage1Cards[0], previous);
        setStage1Card(stage1Cards[1], card);
        setStage1Card(stage1Cards[2], next);
        stage1Cards[1]?.setAttribute('data-balance-mother-child-parent', card.id);
        stage1Cards[1]?.setAttribute('aria-label', `${card.title} kiválasztott anya insight`);

      function clampRasterClayUnit(value) {
        return Math.min(1, Math.max(0, value));
      }

      function smoothRasterClayAlpha(value, low, high) {
        const unit = clampRasterClayUnit((value - low) / (high - low));
        return unit * unit * (3 - (2 * unit));
      }

      function mapRasterClayPixel(mode, red, green, blue) {
        const luminance = ((0.2126 * red) + (0.7152 * green) + (0.0722 * blue)) / 255;

        if (mode === 'mask') {
          const alpha = smoothRasterClayAlpha(luminance, 0.04, 0.96);
          return [242, 41, 134, Math.round(alpha * 255)];
        }

        if (mode === 'shadow') {
          const alpha = Math.pow(smoothRasterClayAlpha(1 - luminance, 0.015, 0.78), 0.9) * 0.78;
          return [70, 18, 45, Math.round(clampRasterClayUnit(alpha) * 255)];
        }

        if (mode === 'glow') {
          const alpha = Math.pow(smoothRasterClayAlpha(luminance, 0.025, 0.95), 1.1) * 0.88;
          return [255, 255, 255, Math.round(clampRasterClayUnit(alpha) * 255)];
        }

        throw new Error('Unknown raster clay layer: ' + mode);
      }

      function loadRasterClaySource(doc, source) {
        return new Promise((resolve, reject) => {
          const image = new doc.defaultView.Image();
          image.decoding = 'async';
          image.addEventListener('load', () => resolve(image), { once: true });
          image.addEventListener('error', () => reject(new Error('Raster clay source failed to load: ' + source)), { once: true });
          image.src = source;
        });
      }

      async function renderRasterClayComposite(doc, stack, status) {
        const rasterClayLayerFixture = Object.freeze([
          { mode: 'mask', source: '/assets/clay-raster/mask-source.jpg' },
          { mode: 'shadow', source: '/assets/clay-raster/shadow-source.png' },
          { mode: 'glow', source: '/assets/clay-raster/glow-source.png' },
        ]);
        const crop = Object.freeze({ x: 0.14, y: 0.14, width: 0.72, height: 0.72 });

        try {
          const loadedLayers = await Promise.all(
            rasterClayLayerFixture.map(async ({ mode, source }) => ({
              mode,
              image: await loadRasterClaySource(doc, source),
            })),
          );

          loadedLayers.forEach(({ mode, image }) => {
            const canvas = stack.querySelector(`[data-raster-clay-layer="${mode}"]`);
            if (!canvas) throw new Error('Raster clay canvas was not found: ' + mode);
            canvas.width = 512;
            canvas.height = 512;
            const context = canvas.getContext('2d', { willReadFrequently: true });
            if (!context) throw new Error('Raster clay canvas context was not available: ' + mode);
            context.clearRect(0, 0, 512, 512);
            context.drawImage(
              image,
              image.naturalWidth * crop.x,
              image.naturalHeight * crop.y,
              image.naturalWidth * crop.width,
              image.naturalHeight * crop.height,
              0,
              0,
              512,
              512,
            );

            const imageData = context.getImageData(0, 0, 512, 512);
            const pixels = imageData.data;
            for (let index = 0; index < pixels.length; index += 4) {
              const mapped = mapRasterClayPixel(mode, pixels[index], pixels[index + 1], pixels[index + 2]);
              pixels[index] = mapped[0];
              pixels[index + 1] = mapped[1];
              pixels[index + 2] = mapped[2];
              pixels[index + 3] = mapped[3];
            }
            context.putImageData(imageData, 0, 0);
          });

          stack.setAttribute('data-raster-clay-ready', 'true');
          status.dataset.state = 'ready';
          status.textContent = '3 alpha layer · pixelazonosan illesztve';
        } catch (error) {
          stack.setAttribute('data-raster-clay-error', 'true');
          status.dataset.state = 'error';
          status.textContent = 'A raszteres alpha-kompozit nem tölthető be.';
          console.error(error);
        }
      }

      function createRasterClayTestRow(doc) {
        const row = doc.createElement('div');
        row.className = 'common-header-row';
        row.setAttribute('data-section-row', 'exact-b3m-raster-clay-test');

        const stack = doc.createElement('div');
        stack.className = 'raster-clay-stack';
        stack.setAttribute('aria-label', 'Három átlátszó képrétegből felépített rózsaszín clay boríték');

        const layerModes = ['mask', 'shadow', 'glow'];
        layerModes.forEach((mode) => {
          const canvas = doc.createElement('canvas');
          canvas.className = 'raster-clay-layer';
          canvas.setAttribute('data-raster-clay-layer', mode);
          canvas.setAttribute('aria-hidden', 'true');

        });

        const status = doc.createElement('div');
        status.className = 'raster-clay-test-status';
        status.setAttribute('role', 'status');
        status.setAttribute('aria-live', 'polite');
        status.dataset.state = 'loading';
        status.textContent = 'Alpha layerek feldolgozása…';

        tile.append(stack);
        panel.append(caption, tile, status);
        row.append(panel);
        void renderRasterClayComposite(doc, stack, status);
        return row;
      }

      function colorInkscapeEmbossPaths(paths, pathColor) {
        const pathList = Array.from(paths || []);
        if (pathList.length !== 2) {
          throw new Error('Inkscape emboss SVG must contain exactly two paths');
        }
        pathList.forEach((path) => {
          path.setAttribute('fill', pathColor);
          path.style.setProperty('fill', pathColor, 'important');
        });
        return pathList.length;
      }

      function colorInkscapeEmbossMaterialFloods(floods, materialColor) {
        const floodList = Array.from(floods || []);
        if (floodList.length !== 2) {
          throw new Error('Inkscape emboss SVG must contain exactly two material floods');
        }
        floodList.forEach((flood) => {
          flood.setAttribute('flood-color', materialColor);
        });
        return floodList.length;
      }

      function configureInkscapeEmbossObject(doc, object, pathColor, materialColor, status) {
        object.addEventListener('load', () => {
          try {
            const svgDocument = object.contentDocument;
            if (!svgDocument) throw new Error('Inkscape emboss SVG document is not same-origin');
            const paths = svgDocument.querySelectorAll('path');
            const materialFloods = svgDocument.querySelectorAll('feFlood[result="result6"]');
            if (paths.length !== 2) {
              throw new Error('Inkscape emboss SVG must contain exactly two paths');
            }
            if (materialFloods.length !== 2) {
              throw new Error('Inkscape emboss SVG must contain exactly two material floods');
            }
            colorInkscapeEmbossPaths(paths, pathColor);
            colorInkscapeEmbossMaterialFloods(materialFloods, materialColor);
            object.setAttribute('data-inkscape-emboss-ready', 'true');
            status.dataset.state = 'ready';
            status.textContent = '2 path · 2 material flood';
          } catch (error) {
            object.setAttribute('data-inkscape-emboss-error', 'true');
            status.dataset.state = 'error';
            status.textContent = 'Az SVG dombornyomás nem tölthető be.';
            console.error(error);
          }
        }, { once: true });
        object.addEventListener('error', () => {

      function createInkscapeEmbossTestRow(doc) {
        const variants = Object.freeze([
          {
            id: 'material-match',
            label: 'Anyagazonos path',
            pathColor: '#4B659A',
            materialColor: '#4B659A',
            isButton: false,
          },
          {
            id: 'grey-50',
            label: 'Grey 50 path',
            pathColor: '#F9FAFB',
            materialColor: '#4B659A',
            isButton: false,
          },
          {
            id: 'purple-button',
            label: 'Lila emboss gomb',
            pathColor: '#7558F5',
            materialColor: '#7558F5',
            isButton: true,
          },
        ]);

        const row = doc.createElement('div');
        row.className = 'common-header-row';
        row.setAttribute('data-section-row', 'exact-b3m-inkscape-emboss-test');
        row.setAttribute('data-inkscape-emboss-test-row', 'true');

        const panel = doc.createElement('section');
        panel.className = 'inkscape-emboss-test-panel';
        panel.setAttribute('aria-labelledby', 'inkscapeEmbossTestHeading');

        const caption = doc.createElement('h2');
        caption.id = 'inkscapeEmbossTestHeading';
        caption.className = 'inkscape-emboss-test-caption';
        caption.textContent = 'Inkscape dombornyomott SVG';

        const rail = doc.createElement('div');
        rail.className = 'inkscape-emboss-variant-rail';

        variants.forEach((variant) => {
          const figure = doc.createElement('figure');
          figure.className = 'inkscape-emboss-variant';
          figure.setAttribute('data-inkscape-emboss-variant', variant.id);

          const tile = doc.createElement(variant.isButton ? 'button' : 'div');
          tile.className = 'inkscape-emboss-tile' + (variant.isButton ? ' inkscape-emboss-tile-purple' : '');
          if (variant.isButton) {
            tile.type = 'button';
            tile.setAttribute('aria-label', variant.label);
          }
          tile.setAttribute('data-inkscape-emboss-path-color', variant.pathColor);
          tile.setAttribute('data-inkscape-emboss-material-color', variant.materialColor);

          const object = doc.createElement('object');
          object.className = 'inkscape-emboss-object';
          object.type = 'image/svg+xml';
          if (variant.isButton) {
            object.setAttribute('aria-hidden', 'true');
            object.setAttribute('inert', '');
          } else {
            object.setAttribute('aria-label', variant.label + ' dombornyomott boríték');
            object.setAttribute('tabindex', '-1');
          }
          object.textContent = 'Dombornyomott SVG előnézet';

          const label = doc.createElement('figcaption');
          label.className = 'inkscape-emboss-variant-label';
          label.textContent = variant.label;

          const status = doc.createElement('div');
          status.className = 'inkscape-emboss-status';
          status.setAttribute('role', 'status');
          status.setAttribute('aria-live', 'polite');
          status.dataset.state = 'loading';
          status.textContent = 'SVG filter betöltése…';

          tile.append(object);
          figure.append(tile, label, status);
          rail.append(figure);
          configureInkscapeEmbossObject(doc, object, variant.pathColor, variant.materialColor, status);
        });

        panel.append(caption, rail);
        row.append(panel);
        return row;
      }

      function renderStandaloneB3MA3(doc) {
        const root = doc.querySelector('[data-b3ma3-standalone-root="true"]');
        if (!root) throw new Error('Standalone B3M-A3 root is missing');
        const card = catalog.find((entry) => entry.id === todayRedesignCardId);
        const trendCard = catalog.find((entry) => entry.id === trendCardId);
        const topCategoriesCard = catalog.find((entry) => entry.id === topCategoriesCardId);
        const categoryChangeCard = catalog.find((entry) => entry.id === categoryChangeCardId);
        const latestTransactionCard = catalog.find((entry) => entry.id === latestTransactionCardId);
        const upcomingRecurringCard = catalog.find((entry) => entry.id === upcomingRecurringCardId);
        const averageDailyCard = catalog.find((entry) => entry.id === averageDailyCardId);
        if (!card || !trendCard || !topCategoriesCard || !categoryChangeCard || !latestTransactionCard || !upcomingRecurringCard || !averageDailyCard) {
          throw new Error('Standalone B3M-A3 fixture is incomplete');
        }

        installTodayRedesignStyles(doc);
        installTodayRedesignInteractionStyles(doc);
        installStandaloneB3MA3Styles(doc);
        const column = createStandaloneB3MA3Column(doc);
        populateTodayRedesignScreen(column, card, topCategoriesCard, categoryChangeCard, latestTransactionCard, averageDailyCard, trendCard, upcomingRecurringCard);
        installB3MA3IncomeWallet(doc, column);
        installB3MA3ExpenseBag(doc, column);
        installB3MA3ActionToggle(doc, column);
        root.replaceChildren(column);
      }

      function renderExactB3M(doc) {
        const viewport = doc.getElementById('zoomViewport');
        const host = doc.getElementById('zoomHost');
        const surface = doc.getElementById('zoomSurface');
        const sourceColumn = doc.querySelector('[data-common-header-static-preview-column="strict-mother-child"]');
        if (!viewport || !host || !surface || !sourceColumn) throw new Error('Color Lab B3M zoom source was not found');
        if (!sourceColumn.querySelector('.common-header-stage2-mother-child')) throw new Error('Color Lab B3M header component was not found');
        if (!sourceColumn.querySelector('.common-balance-mother-child-panel')) throw new Error('Color Lab B3M child panel was not found');
        installTodayRedesignStyles(doc);
        installTodayRedesignInteractionStyles(doc);
        installBudgetCloneStyles(doc);
        installBudget3DCloneStyles(doc);
        installLucideClayTestStyles(doc);
        installRasterClayCompositeStyles(doc);
        installInkscapeEmbossTestStyles(doc);
        installC4WReferenceStyles(doc);
        installMindModePrototypeStyles(doc);

        const mode = doc.createElement('section');
        mode.className = 'common-header-mode';
        mode.setAttribute('data-common-header-mode', 'balance');
        mode.setAttribute('data-exact-b3m-gallery', 'true');
        mode.setAttribute('data-upper-insight-card', trendCardId);
        const trendCard = catalog.find((card) => card.id === trendCardId);
        const topCategoriesCard = catalog.find((card) => card.id === topCategoriesCardId);
        const categoryChangeCard = catalog.find((card) => card.id === categoryChangeCardId);
        const latestTransactionCard = catalog.find((card) => card.id === latestTransactionCardId);
        const upcomingRecurringCard = catalog.find((card) => card.id === upcomingRecurringCardId);
        const averageDailyCard = catalog.find((card) => card.id === averageDailyCardId);
        if (!trendCard) throw new Error(`Unknown card: ${trendCardId}`);
        if (!topCategoriesCard) throw new Error(`Unknown card: ${topCategoriesCardId}`);
        if (!categoryChangeCard) throw new Error(`Unknown card: ${categoryChangeCardId}`);
        if (!latestTransactionCard) throw new Error(`Unknown card: ${latestTransactionCardId}`);
        if (!upcomingRecurringCard) throw new Error(`Unknown card: ${upcomingRecurringCardId}`);
        if (!averageDailyCard) throw new Error(`Unknown card: ${averageDailyCardId}`);
        const carouselCards = catalog.filter((card) =>
          card.id !== trendCardId &&
          card.id !== topCategoriesCardId &&
          card.id !== categoryChangeCardId &&
          card.id !== latestTransactionCardId &&
          card.id !== upcomingRecurringCardId &&
          card.id !== noSpendCardId &&
          card.id !== averageDailyCardId &&
          card.id !== topMerchantCardId,
        );
        const carouselRow = doc.createElement('div');
        carouselRow.className = 'common-header-row';
        carouselRow.setAttribute('data-section-row', 'exact-b3m-carousel');
        let permanentBalanceColumn = null;

        carouselCards.forEach((card) => {
          if (card.id === todayRedesignCardId) {
            const permanentTimeRailColumn = sourceColumn.cloneNode(true);
            permanentTimeRailColumn.setAttribute('data-today-budget-pill-behavior', 'exit');
            permanentTimeRailColumn.setAttribute('data-today-redesign-density', 'time-rail-compact');
            permanentTimeRailColumn.setAttribute('data-today-time-scope-default', 'collapsed');
            permanentTimeRailColumn.setAttribute('data-today-time-scope-mode', 'permanent');
            permanentTimeRailColumn.setAttribute('data-today-time-scope-visibility', 'summary-toggle');
            permanentTimeRailColumn.setAttribute('data-stage2-alternative', 'today-time-rail-permanent');
            setB3MContent(permanentTimeRailColumn, card, catalog.indexOf(card));
            populateTodayRedesignScreen(permanentTimeRailColumn, card, topCategoriesCard, categoryChangeCard, latestTransactionCard, averageDailyCard, trendCard, upcomingRecurringCard);
            permanentBalanceColumn = permanentTimeRailColumn;
            carouselRow.append(permanentTimeRailColumn);
            return;
          }
          const column = sourceColumn.cloneNode(true);
          setB3MContent(column, card, catalog.indexOf(card));
          carouselRow.append(column);
        });

        const budgetComparisonRow = doc.createElement('div');
        budgetComparisonRow.className = 'common-header-row';
        budgetComparisonRow.setAttribute('data-section-row', 'exact-b3m-budget-comparison');
        if (!permanentBalanceColumn) throw new Error('The permanent B3M-A3 source was not created');
        installB3MA3IncomeWallet(doc, permanentBalanceColumn);
        installB3MA3ExpenseBag(doc, permanentBalanceColumn);
        installB3MA3ActionToggle(doc, permanentBalanceColumn);
        const c4wColumn = createStaticC4WReferenceScreen(doc, sourceColumn);
        const c4wReferenceScreen = c4wColumn.querySelector('[data-c4w-reference-screen="true"]');
        if (!c4wReferenceScreen) throw new Error('The in-page C4W reference screen was not created');
        const budgetColumn = createBudgetModeScreen(doc, permanentBalanceColumn, c4wReferenceScreen);
        const budget3dColumn = createBudget3DModeScreen(doc, budgetColumn);
        budgetComparisonRow.append(budgetColumn, budget3dColumn, c4wColumn);
        const mindPrototypeRow = doc.createElement('div');
        mindPrototypeRow.className = 'common-header-row';
        mindPrototypeRow.setAttribute('data-section-row', 'exact-b3m-mind-prototype');
        const ds2aColumn = createStaticDS2AReferenceScreen(doc);
        const mindPrototypeColumn = createMindModePrototypeScreen(doc, budgetColumn, ds2aColumn);
        const mindAnnualMonthcardsColumn = createMindAnnualMonthcardPrototypeScreen(doc, mindPrototypeColumn);
        const mindAnnualThreeColumnColumn = createMindAnnualThreeColumnPrototypeScreen(doc, mindAnnualMonthcardsColumn);
        mindPrototypeRow.append(mindPrototypeColumn, mindAnnualMonthcardsColumn, mindAnnualThreeColumnColumn, ds2aColumn);
        const mindSumOverviewRow = doc.createElement('div');
        mindSumOverviewRow.className = 'common-header-row';
        mindSumOverviewRow.setAttribute('data-section-row', 'exact-b3m-mind-sum-overview');
        const mindAnnualSumGridColumn = createMindAnnualSumGridPrototypeScreen(doc, mindAnnualThreeColumnColumn);
        mindSumOverviewRow.append(mindAnnualSumGridColumn);
        const mindMonthlyOverviewRow = doc.createElement('div');
        mindMonthlyOverviewRow.className = 'common-header-row';
        mindMonthlyOverviewRow.setAttribute('data-section-row', 'exact-b3m-mind-month-overview');
        const mindMonthlyActivityColumn = createMindMonthlyActivityPrototypeScreen(doc, mindAnnualSumGridColumn);
        mindMonthlyOverviewRow.append(mindMonthlyActivityColumn);
        const lucideClayTestRow = createLucideClayTestRow(doc);
        const rasterClayTestRow = createRasterClayTestRow(doc);
        const inkscapeEmbossTestRow = createInkscapeEmbossTestRow(doc);
        mode.append(carouselRow, budgetComparisonRow, mindPrototypeRow, mindSumOverviewRow, mindMonthlyOverviewRow, lucideClayTestRow, rasterClayTestRow, inkscapeEmbossTestRow);
        surface.replaceChildren(mode);
        const carouselColumnCount = carouselRow.children.length;
        const budgetComparisonWidth = (3 * 412) + (2 * 28) + 48;
        const mindPrototypeWidth = (mindPrototypeRow.children.length * 412) + (28 * (mindPrototypeRow.children.length - 1)) + 48;
        const widestComparisonWidth = Math.max(budgetComparisonWidth, mindPrototypeWidth);
        surface.style.minWidth = 'max(calc((var(--screen-w) * ' + carouselColumnCount + ') + ' + (28 * (carouselColumnCount - 1) + 48) + 'px), ' + widestComparisonWidth + 'px)';
        surface.style.minHeight = 'calc((var(--screen-h) * 5) + 1440px)';
        surface.setAttribute('data-exact-b3m-gallery', 'true');
        doc.documentElement.setAttribute('data-balance-stage2-exact-b3m', 'true');

        const setCanvasZoom = doc.defaultView.setCanvasZoom;
        if (typeof setCanvasZoom === 'function') {
          setCanvasZoom(.5);
        } else {
          surface.style.setProperty('--canvas-zoom', '.5');
          host.style.width = `${surface.offsetWidth * .5}px`;
          host.style.height = `${surface.offsetHeight * .5}px`;
        }
        viewport.scrollTo({ left: 0, top: 0, behavior: 'auto' });
      }

      frame.addEventListener('load', () => {
        try {
          renderExactB3M(frame.contentDocument);
          frame.dataset.ready = 'true';
        } catch (error) {
          console.error(error);
          frame.style.visibility = 'visible';
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
