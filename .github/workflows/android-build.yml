name: Exptv2 Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        run: |
          cd android
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare debug APK release file
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-debug.apk build/release/exptv2-debug.apk

      - name: Publish latest debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: build/release/exptv2-debug.apk
        run: |
          SAFE_REF="$(printf '%s' "$GITHUB_REF_NAME" | tr '/_' '--' | tr -cd '[:alnum:]-')"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            RELEASE_TAG="debug-latest"
            APK_NAME="exptv2-debug.apk"
            RELEASE_TITLE="Latest debug APK"
          else
            RELEASE_TAG="debug-latest-${SAFE_REF}"
            APK_NAME="exptv2-debug-${SAFE_REF}.apk"
            RELEASE_TITLE="Latest debug APK (${GITHUB_REF_NAME})"
          fi
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${RELEASE_TAG}" --force
          NOTES="Latest debug APK built from ${GITHUB_REF_NAME} commit ${GITHUB_SHA}."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete-asset "$RELEASE_TAG" "$APK_NAME" --yes >/dev/null 2>&1 || true
            gh release upload "$RELEASE_TAG" "$APK_PATH#$APK_NAME" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK_PATH#$APK_NAME" \
              --prerelease \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES"
          fi
          echo "Direct APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
