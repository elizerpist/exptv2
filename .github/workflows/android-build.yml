name: Exptv2 Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPTV2_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EXPTV2_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXPTV2_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EXPTV2_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/exptv2-debug.keystore
          cat > android/key.properties <<EOF
          storeFile=app/exptv2-debug.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare debug APK release file
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-debug.apk build/release/exptv2-debug.apk

      - name: Publish latest debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: build/release/exptv2-debug.apk
          APK_NAME: exptv2-debug.apk
        run: |
          git tag -f debug-latest "$GITHUB_SHA"
          git push origin refs/tags/debug-latest --force
          NOTES="Latest debug APK built from ${GITHUB_REF_NAME} commit ${GITHUB_SHA}."
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release delete-asset debug-latest "$APK_NAME" --yes >/dev/null 2>&1 || true
            gh release upload debug-latest "$APK_PATH" --clobber
            gh release edit debug-latest \
              --title "Latest debug APK" \
              --notes "$NOTES"
          else
            gh release create debug-latest "$APK_PATH" \
              --prerelease \
              --title "Latest debug APK" \
              --notes "$NOTES"
          fi
          echo "Direct APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/debug-latest/${APK_NAME}"
