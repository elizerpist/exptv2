name: Exptv2 Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare debug APK artifact
        run: |
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk build/artifacts/exptv2-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exptv2-debug-apk
          path: build/artifacts/exptv2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: build/artifacts/exptv2-debug.apk
        run: |
          git tag -f debug-latest "$GITHUB_SHA"
          git push origin refs/tags/debug-latest --force
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release delete-asset debug-latest app-debug.apk --yes >/dev/null 2>&1 || true
            gh release upload debug-latest "$APK_PATH" --clobber
            gh release edit debug-latest \
              --title "Latest debug APK" \
              --notes "Latest debug APK built from main commit $GITHUB_SHA."
          else
            gh release create debug-latest "$APK_PATH" \
              --prerelease \
              --title "Latest debug APK" \
              --notes "Latest debug APK built from main commit $GITHUB_SHA."
          fi
