name: Exptv2 Android APK Build

on:
  push:
    branches:
      - main
      - integrated-latest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          java -version
          flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Enforce Balance V3 release gate before APK build
        run: tool/check_balance_v3_gate.sh --check docs/superpowers/checklists/bugfix20260726v3.md

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPTV2_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EXPTV2_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXPTV2_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EXPTV2_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/exptv2-debug.keystore
            cat > android/key.properties <<EOF
          storeFile=app/exptv2-debug.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "Android signing secrets are not fully configured; using default debug signing."
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Enforce Balance V3 release gate before artifact preparation
        run: tool/check_balance_v3_gate.sh --check docs/superpowers/checklists/bugfix20260726v3.md

      - name: Prepare debug APK release file
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="exptv2-debug-${SHORT_SHA}.apk"
          APK_PATH="build/release/${APK_NAME}"
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK_PATH"
          {
            echo "APK_NAME=$APK_NAME"
            echo "APK_PATH=$APK_PATH"
          } >> "$GITHUB_ENV"

      - name: Enforce Balance V3 release gate before release upload
        run: tool/check_balance_v3_gate.sh --check docs/superpowers/checklists/bugfix20260726v3.md

      - name: Publish latest debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f debug-latest "$GITHUB_SHA"
          git push origin refs/tags/debug-latest --force
          NOTES="Latest debug APK built from ${GITHUB_REF_NAME} commit ${GITHUB_SHA}."
          if gh release view debug-latest >/dev/null 2>&1; then
            while IFS= read -r ASSET_NAME; do
              case "$ASSET_NAME" in
                exptv2-debug*.apk)
                  gh release delete-asset debug-latest "$ASSET_NAME" --yes >/dev/null 2>&1 || true
                  ;;
              esac
            done < <(gh release view debug-latest --json assets --jq '.assets[].name')
            gh release upload debug-latest "$APK_PATH" --clobber
            gh release edit debug-latest \
              --title "Latest debug APK" \
              --notes "$NOTES"
          else
            gh release create debug-latest "$APK_PATH" \
              --prerelease \
              --title "Latest debug APK" \
              --notes "$NOTES"
          fi
          echo "Direct APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/debug-latest/${APK_NAME}"
