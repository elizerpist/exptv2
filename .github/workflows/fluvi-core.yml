name: R42 matched R41 and R42 wake blocks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-wakes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
      - uses: actions/checkout@v5
        with:
          ref: 97f9704120e2ae997185ea6e35fbc053e1d7f0ab
          path: app-r41
      - uses: actions/checkout@v5
        with:
          ref: 1584ccb020a8500efd5f9c67eac8ebd4830b1271
          path: app-r42
      - name: Free disposable runner space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Prefer Maven Central storage mirror
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/r42-mirror.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
                  gradlePluginPortal()
                  google()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
              }
          }
          GRADLE
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run alternating real-service wake blocks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r42-matched-wakes.sh" build
          script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r42-matched-wakes.sh" run
      - name: Preserve all attempted blocks and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r42-matched-wakes-${{ github.run_id }}
          path: ${{ runner.temp }}/r42-matched-wakes/**
          if-no-files-found: warn
          retention-days: 14
