name: R37 paired natural wake controls
on:
  workflow_dispatch:
    inputs:
      app_sha:
        type: string
        required: true
      harness_sha:
        type: string
        required: true
      baseline:
        type: boolean
        default: false
      native_diagnostic:
        type: boolean
        default: true
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_SHA: ${{ inputs.app_sha }}
      HARNESS_SHA: ${{ inputs.harness_sha }}
      BASELINE: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: 3a8c355caaccf1519d25edf042c2cf04dd7f9e38
          path: base
          fetch-depth: 0
      - name: Free disposable runner space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Prefer Maven Central storage mirror
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/r37-mirror.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
                  gradlePluginPortal()
                  google()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
              }
          }
          GRADLE
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile and exercise real service on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r37-ab-driver.sh" build
          script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r37-ab-driver.sh" run
      - name: Retain controls and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r37-paired-wakes-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r37-ab/*.txt
            ${{ runner.temp }}/r37-ab/*.tar
            ${{ runner.temp }}/r37-ab/*.log
            ${{ runner.temp }}/r37-ab/*.sha256
            ${{ runner.temp }}/r37-ab/preflight/**
          if-no-files-found: warn
          retention-days: 14
