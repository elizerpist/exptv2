name: R52 signed stock withdrawal
on:
  workflow_dispatch:
    inputs:
      app_sha:
        required: true
        type: string
      apk:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
permissions:
  contents: read
jobs:
  four-lockscreen-styles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_SHA: ${{ inputs.app_sha }}
      APK_URL: ${{ inputs.apk }}
      APK_HASH: ${{ inputs.sha256 }}
      APK_SIZE: ${{ inputs.size }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the signed artifact and exact-source silhouette
        run: |
          mkdir -p evidence
          bash .github/r52-stock/verify-apk.sh "$APK_URL" "$APK_HASH" "$APK_SIZE" "$APP_SHA" "$RUNNER_TEMP/human.apk"
          git fetch --depth=1 origin "$APP_SHA"
          git show "$APP_SHA:android/wa-lockscreen/src/main/res/drawable-nodpi/wa_fluvi_logo_mask.png" \
            | cmp - .github/r52-stock/expected-lock-mask.png
          bash .github/r52-stock/prepare-runner.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: >-
            python3 .github/r52-stock/mask_controls.py --apk "$RUNNER_TEMP/human.apk"
            --observer "$RUNNER_TEMP/observer.apk" --output evidence/styles --sha "$APP_SHA"
            --mask .github/r52-stock/expected-lock-mask.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52-four-styles-${{ inputs.app_sha }}
          path: evidence/
          if-no-files-found: warn
