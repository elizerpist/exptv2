name: R22.4 matched capture OFF versus LIGHT overhead
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  overhead:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_SHA: ad1eac09442cb8d78a992874d22157fe6bd5a05f
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Build exact application before test-only observer
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d" "$RUNNER_TEMP/r224-overhead/build"
          cp "$GITHUB_WORKSPACE/harness/scripts/r22-3-plugin-repos.init.gradle" "$HOME/.gradle/init.d/fluvi-repositories.gradle"
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd android && ./gradlew :app:assembleDebug --no-daemon --max-workers=3 --console=plain) 2>&1 | tee "$RUNNER_TEMP/r224-overhead/build/app.log"
          sha256sum build/app/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/r224-overhead/build/app-before.txt"
          python3 "$GITHUB_WORKSPACE/harness/scripts/r22-4-overhead-overlay.py"
          python3 "$GITHUB_WORKSPACE/harness/scripts/r22-4-export-preflight-overlay.py"
          git diff > "$RUNNER_TEMP/r224-overhead/build/test-only.patch"
          test "$(git diff --name-only | wc -l)" = 2
          git diff --name-only | grep -Fx 'android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardR12ServiceTimingInstrumentationTest.kt'
          git diff --name-only | grep -Fx 'android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardCardDiagnosticsInstrumentationTest.kt'
          (cd android && ./gradlew :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain) 2>&1 | tee "$RUNNER_TEMP/r224-overhead/build/test.log"
          sha256sum -c "$RUNNER_TEMP/r224-overhead/build/app-before.txt"
          sha256sum build/app/outputs/apk/debug/app-debug.apk build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/r224-overhead/build/apks.txt"
          printf 'app=%s\nharness=%s\n' "$APP_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/r224-overhead/build/source.txt"
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 0666 /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Measure one matched OFF/LIGHT unheld workload
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$GITHUB_WORKSPACE/harness/scripts/r22-4-export-preflight.sh" && bash "$GITHUB_WORKSPACE/harness/scripts/r22-4-overhead-run.sh"
      - name: Preserve both arms and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r224-overhead-${{ github.run_id }}
          path: ${{ runner.temp }}/r224-overhead/**
          if-no-files-found: warn
          retention-days: 30
