name: R50 signed update control
on:
  workflow_dispatch:
    inputs:
      app_sha:
        required: true
        type: string
      artifact:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_SHA: ${{ inputs.app_sha }}
      APK_ARTIFACT: ${{ inputs.artifact }}
      APK_SHA256: ${{ inputs.sha256 }}
      APK_SIZE: ${{ inputs.size }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - name: Validate the two actual signed APKs
        run: bash .github/r50-upgrade/verify-update.sh download
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Update stock Android 17 in place
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash .github/r50-upgrade/verify-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r50-signed-update-${{ github.run_id }}
          path: r50-upgrade-evidence/
          if-no-files-found: warn
