name: R55 exact-source Dart graph and two product Copy suites
on:
  push:
    branches: ['orchestration/r55-graph-and-copy']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SOURCE: 8ddf2946ea3918a55f73330640edb3536d2fffc2
      TOOLING: e86ab3bb92e5f30e69af57b498ac1ba6d9addbe8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
          path: source
          fetch-depth: 2
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TOOLING }}
          path: graph-tools
          sparse-checkout: tools/codegraph
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Verify the clean product source and resolve its locked dependencies
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^)" = 41add67b7f4d4ecdf7a0a48abff64ca85364ac9e
          git diff --check HEAD^ HEAD
          bash scripts/verify-fluvi-boundaries.sh
          flutter pub get --enforce-lockfile
          flutter --version
          dart --version
          mkdir -p "$GITHUB_WORKSPACE/evidence"
      - name: Exercise the actual product settings and debug console Copy paths
        working-directory: source
        run: flutter test --no-pub --reporter expanded test/core/debug/debug_lockscreen_capture_test.dart test/features/header_orb/presentation/header_orb_setup_page_test.dart | tee "$GITHUB_WORKSPACE/evidence/flutter-copy.txt"
      - name: Recreate the raw exact-source index
        if: ${{ !cancelled() }}
        working-directory: source
        run: |
          git diff --exit-code HEAD
          dart pub global activate scip_dart 1.6.2
          dart pub global run scip_dart .
          sha256sum index.scip | tee "$GITHUB_WORKSPACE/evidence/index.sha256"
          git diff --exit-code HEAD
      - name: Emit and validate the graph from the real index
        if: ${{ !cancelled() }}
        working-directory: graph-tools/tools/codegraph
        run: |
          set -euo pipefail
          dart pub get --enforce-lockfile
          dart analyze
          dart test -r expanded | tee "$GITHUB_WORKSPACE/evidence/graph-tests.txt"
          src="$GITHUB_WORKSPACE/source"
          out="$GITHUB_WORKSPACE/evidence/graph"
          dart run bin/fluvi_codegraph.dart generate --source-root "$src" --index "$src/index.scip" \
            --graph "$out" --source-head "$SOURCE" --source-ref "$SOURCE" \
            --expected-index-sha256 "$(cut -d' ' -f1 "$GITHUB_WORKSPACE/evidence/index.sha256")"
          dart run bin/fluvi_codegraph.dart query --graph "$out" --symbol CopyLastUnlock > "$GITHUB_WORKSPACE/evidence/copy-query.txt"
          python3 - "$out" "$SOURCE" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          receipt = json.loads((root/'manifest.json').read_text())
          assert receipt['source_head'] == sys.argv[2]
          assert receipt['source_parent'] == '41add67b7f4d4ecdf7a0a48abff64ca85364ac9e'
          for row in receipt['artifacts']:
              for name in row['paths']:
                  assert (root/name).is_file(), name
          print(receipt['source_head'], receipt['index_sha256'], receipt['document_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r55-exact-graph-and-copy-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
