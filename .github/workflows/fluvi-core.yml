name: R40 R39 provenance causal A-B LIGHT FULL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: enabled
            sha: fd7112e4e52952caaee1f740526c87f10ddc7cb2
          - name: disabled
            sha: fd7112e4e52952caaee1f740526c87f10ddc7cb2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: aec2f7dca02501bed621abc32348dd19912542a5
          path: __r40fixture
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Compile exact source and retain APK pair
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.sha }}
          R40_SWITCH: ${{ matrix.name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$RUNNER_TEMP/pair" "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/r38-mirror.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories { maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }; gradlePluginPortal(); google() }
            settings.dependencyResolutionManagement.repositories { maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') } }
          }
          GRADLE
          fixture="$GITHUB_WORKSPACE/__r40fixture"
          test "$(git -C "$fixture" rev-parse HEAD)" = aec2f7dca02501bed621abc32348dd19912542a5
          for file in FluviKeyguardCardService.kt KeyguardCardSurface.kt KeyguardWindowSnapshotReader.kt KeyguardR40FixtureSwitch.kt; do
            cp "$fixture/android/app/src/main/kotlin/com/fluvi/app/lockscreen/$file" "android/app/src/main/kotlin/com/fluvi/app/lockscreen/$file"
          done
          cp "$fixture/android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardFirstAuthorizedOrbInstrumentationTest.kt" android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/
          if [[ "$R40_SWITCH" = disabled ]]; then
            sed -i 's/const val ENABLED = true/const val ENABLED = false/' android/app/src/main/kotlin/com/fluvi/app/lockscreen/KeyguardR40FixtureSwitch.kt
          fi
          cat android/app/src/main/kotlin/com/fluvi/app/lockscreen/KeyguardR40FixtureSwitch.kt > "$RUNNER_TEMP/pair/switch.txt"
          git diff -- android/app/src > "$RUNNER_TEMP/pair/fixture.patch"
          sha256sum android/app/src/main/kotlin/com/fluvi/app/lockscreen/{FluviKeyguardCardService,KeyguardCardSurface,KeyguardWindowSnapshotReader,KeyguardR40FixtureSwitch}.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardFirstAuthorizedOrbInstrumentationTest.kt > "$RUNNER_TEMP/pair/fixture-sha256.txt"
          flutter pub get > "$RUNNER_TEMP/pair/pub.log" 2>&1
          (cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain) > "$RUNNER_TEMP/pair/build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/pair/build.log"; exit 1; }
          cp build/app/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pair/app.apk"
          cp build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/pair/test.apk"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/pair/source.txt"
          sha256sum "$RUNNER_TEMP/pair/"*.apk > "$RUNNER_TEMP/pair/pair.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r40-causal-pair-${{ matrix.name }}
          path: ${{ runner.temp }}/pair/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: r40-causal-pair-*
          path: ${{ runner.temp }}/pairs
      - name: Sign the disposable emulator pairs with one test key
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r38-compare"; mkdir -p "$out"
          keytool -genkeypair -keystore "$out/test.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Disposable R38 Test' -keyalg RSA -validity 7 >/dev/null 2>&1
          signer=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          for mode in enabled disabled; do
            pair="$RUNNER_TEMP/pairs/r40-causal-pair-$mode"
            mkdir -p "$out/$mode"
            cp "$pair/source.txt" "$out/$mode/source.txt"
            for apk in app test; do
              "$signer" sign --ks "$out/test.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$out/$mode/$apk.apk" "$pair/$apk.apk"
              "$signer" verify "$out/$mode/$apk.apk"
            done
            sha256sum "$out/$mode/"*.apk > "$out/$mode/pair.sha256"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real unheld wake trials on one API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$GITHUB_WORKSPACE/.github/scripts/r38-unheld.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r40-causal-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r38-compare/**/*.txt
            ${{ runner.temp }}/r38-compare/**/*.tar
          if-no-files-found: warn
          retention-days: 14
