name: R16 Owned Layer Panel Controls (test orchestration only)
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
      native_scope:
        type: string
        default: r12_contract
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  r16-owned-layer-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable runtime source and harness identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 7c49a22386296ed0285552384c519da87d0bd468 HEAD -- android/app/src/main android/app/src/debug android/app/src/profile android/app/src/release android/app/build.gradle.kts lib shaders pubspec.yaml pubspec.lock
          printf 'app_source=7c49a22386296ed0285552384c519da87d0bd468\nharness_source=%s\n' "$GITHUB_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: ./.github/actions/setup-fluvi-flutter
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run stock and owned real-panel controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -accel on
            -no-snapshot -noaudio -no-boot-anim -camera-back none
            -partition-size 4096
          pre-emulator-launch-script: >-
            cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain
          script: bash scripts/test-keyguard-r16-panel.sh
      - name: Preserve panel evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-owned-layer-panel-${{ github.sha }}-run-${{ github.run_id }}
          path: |
            android/keyguard-r16-panel/**
            build/app/reports/androidTests/**
            build/app/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 30
