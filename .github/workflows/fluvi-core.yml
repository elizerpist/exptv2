name: R44 Android 17 service and evidence controls
run-name: ${{ inputs.test_scope }} app ${{ inputs.app_sha }}
on:
  workflow_dispatch:
    inputs:
      app_sha:
        type: string
        required: true
      harness_sha:
        type: string
        required: true
      baseline:
        type: boolean
        default: false
      test_scope:
        type: string
        default: ordered
      candidate_sha256:
        type: string
        default: '26315d180d094392ef0c7e14f1f39b1c596e2938ce5c127e3d463dfc576f7428'
      candidate_size:
        type: string
        default: '121006864'
      candidate_url:
        type: string
        default: ''
      baseline_apk:
        type: string
        default: 'r44_2_owner'
      stage_sha256:
        type: string
        default: ''
      stage_size:
        type: string
        default: '0'
      stage_nonce:
        type: string
        default: ''
      test_sha256:
        type: string
        default: ''
      test_size:
        type: string
        default: '0'
      native_diagnostic:
        type: boolean
        default: true
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  service:
    if: ${{ !startsWith(inputs.test_scope, 'r47_ui_') && !startsWith(inputs.test_scope, 'r46_ui_') && !startsWith(inputs.test_scope, 'r45_ui_') && inputs.test_scope != 'r47_update_route' && inputs.test_scope != 'update_probe' && inputs.test_scope != 'r43_update' && inputs.test_scope != 'r44_update' && inputs.test_scope != 'r448_update_routes' && inputs.test_scope != 'r448_update_restart' && inputs.test_scope != 'r449_ui_fluvi' && inputs.test_scope != 'r449_ui_wa' && inputs.test_scope != 'r446_update_once' && inputs.test_scope != 'r446_update_arm' && inputs.test_scope != 'r44_update_reopen' && inputs.test_scope != 'r44_update_private' && inputs.test_scope != 'r43_flutter' && inputs.test_scope != 'r47_animated_flutter' && inputs.test_scope != 'r47_paired_ci' && inputs.test_scope != 'r47_evidence_archive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_SHA: ${{ inputs.app_sha }}
      HARNESS_SHA: ${{ inputs.harness_sha }}
      BASELINE: ${{ inputs.baseline }}
      TEST_SCOPE: ${{ inputs.test_scope }}
      FLUVI_R448_SAFE_SAMPLE_ONLY: ${{ (inputs.test_scope == 'r448_safe_only' || inputs.test_scope == 'r45_wa_session' || inputs.test_scope == 'r45_wa_session_diag' || inputs.test_scope == 'r448_stock_wa' || inputs.test_scope == 'r449_session_diag' || inputs.test_scope == 'r449_stock_diag') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
      - uses: actions/checkout@v5
        if: ${{ inputs.baseline || inputs.test_scope == 'r48_private_admission' }}
        with:
          ref: ${{ env.HARNESS_SHA }}
          path: harness
      - name: Free disposable runner space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Prefer Maven Central storage mirror
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/r37-mirror.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
                  gradlePluginPortal()
                  google()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
              }
          }
          GRADLE
      - name: Run exact-source Android JVM unit gates
        if: ${{ inputs.test_scope == 'units' }}
        shell: bash
        working-directory: app
        run: |
          mkdir -p "$RUNNER_TEMP/r37-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/r37-evidence/unit-source.txt"
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get > "$RUNNER_TEMP/r37-evidence/unit-pub-get.log" 2>&1
          rc=0
          # Robolectric fetches its platform independently of Gradle's
          # repositories. Use the same public Maven Central mirror when its
          # default repo1 endpoint is rate-limited on a disposable runner.
          (cd android && JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2" ./gradlew :app:testDebugUnitTest :fluvi-core:testDebugUnitTest --continue --no-daemon --max-workers=3 --console=plain) > "$RUNNER_TEMP/r37-evidence/unit.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/r37-evidence/unit-exit.txt"
          for path in build/app/test-results build/fluvi-core/test-results; do
            if [[ -d "$path" ]]; then
              mkdir -p "$RUNNER_TEMP/r37-evidence/$(dirname "$path")"
              cp -a "$path" "$RUNNER_TEMP/r37-evidence/$path"
            fi
          done
          tail -100 "$RUNNER_TEMP/r37-evidence/unit.log"
          exit "$rc"
      - name: Set up image-analysis Python
        if: ${{ inputs.test_scope == 'r47_frame_correlation' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic-frame analysis dependency
        if: ${{ inputs.test_scope == 'r47_frame_correlation' }}
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Ensure video decoder is available
        if: ${{ inputs.test_scope == 'r47_frame_correlation' }}
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Enable KVM
        if: ${{ inputs.test_scope != 'units' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile and exercise real service on API 37
        if: ${{ inputs.test_scope != 'units' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r37-driver.sh" build
          script: >-
            if [ "$TEST_SCOPE" = r47_frame_correlation ]; then bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r47-frame-correlation.sh"; else bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r37-driver.sh" run; fi
      - name: Retain compact synthetic frame summaries
        if: always() && inputs.test_scope == 'r47_frame_correlation'
        uses: actions/upload-artifact@v4
        with:
          name: r47-correlation-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r37-evidence/*.txt
            ${{ runner.temp }}/r37-evidence/*.log
            ${{ runner.temp }}/r37-evidence/correlation/*.txt
            ${{ runner.temp }}/r37-evidence/correlation/*.json
            ${{ runner.temp }}/r37-evidence/correlation/*.log
            ${{ runner.temp }}/r37-evidence/correlation/**/*.txt
            ${{ runner.temp }}/r37-evidence/correlation/**/frame-extract-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain controls and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r40-service-${{ github.run_id }}
          path: ${{ runner.temp }}/r37-evidence/**
          if-no-files-found: warn
          retention-days: 14

  update-probe:
    if: ${{ inputs.test_scope == 'update_probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_SHA: ${{ inputs.app_sha }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      CANDIDATE_SIZE: ${{ inputs.candidate_size }}
      TEST_SHA256: ${{ inputs.test_sha256 }}
      TEST_SIZE: ${{ inputs.test_size }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: orchestrator
          fetch-depth: 1
      - name: Create ephemeral encryption key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/r41-update" "$RUNNER_TEMP/r41-key"
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/r41-update/private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/r41-update/private.pem" -pubout -out "$RUNNER_TEMP/r41-key/public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: r41-update-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/r41-key/public.pem
          retention-days: 1
      - name: Retrieve encrypted exact APK
        shell: bash
        run: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r42-update-probe.sh" retrieve
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Verify downloaded APK identities
        shell: bash
        run: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r42-update-probe.sh" verify
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install R40 and update on disposable API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r42-update-probe.sh" install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r41-update-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r41-update/evidence/**
          if-no-files-found: warn
          retention-days: 14

  r43-update:
    if: ${{ inputs.test_scope == 'r43_update' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_SHA: ${{ inputs.app_sha }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      CANDIDATE_SIZE: ${{ inputs.candidate_size }}
      CANDIDATE_URL: ${{ inputs.candidate_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the signed R42 and update on API 37
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r43-update.sh" prepare
          script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r43-update.sh" run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r43-update-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r43-update/*.txt
            ${{ runner.temp }}/r43-update/*.xml
          if-no-files-found: warn
          retention-days: 14

  r44-update:
    if: ${{ startsWith(inputs.test_scope, 'r47_ui_') || startsWith(inputs.test_scope, 'r46_ui_') || startsWith(inputs.test_scope, 'r45_ui_') || inputs.test_scope == 'r47_update_route' || inputs.test_scope == 'r44_update' || inputs.test_scope == 'r448_update_routes' || inputs.test_scope == 'r448_update_restart' || inputs.test_scope == 'r449_ui_fluvi' || inputs.test_scope == 'r449_ui_wa' || inputs.test_scope == 'r446_update_once' || inputs.test_scope == 'r446_update_arm' || inputs.test_scope == 'r44_update_reopen' || inputs.test_scope == 'r44_update_private' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      APP_SHA: ${{ inputs.app_sha }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      CANDIDATE_SIZE: ${{ inputs.candidate_size }}
      CANDIDATE_URL: ${{ inputs.candidate_url }}
      R44_BASELINE: ${{ inputs.baseline_apk }}
      R44_STAGE_SHA256: ${{ inputs.stage_sha256 }}
      R44_STAGE_SIZE: ${{ inputs.stage_size }}
      FLUVI_R44_STAGE_KEY: ${{ secrets.FLUVI_R44_UPDATE_STAGE_KEY }}
      R44_STAGE_NONCE: ${{ inputs.stage_nonce }}
      R44_PRIVATE: ${{ inputs.test_scope == 'r44_update_private' || inputs.test_scope == 'r47_update_route' || startsWith(inputs.test_scope, 'r47_ui_') }}
      R47_ROUTE_UPDATE_CHECK: ${{ inputs.test_scope == 'r47_update_route' }}
      R44_REOPEN_ONLY: ${{ inputs.test_scope == 'r44_update_reopen' }}
      R446_UI_PROBE: ${{ inputs.test_scope == 'r446_update_once' || inputs.test_scope == 'r446_update_arm' }}
      R446_ARM_ONLY: ${{ inputs.test_scope == 'r446_update_arm' }}
      R448_UI_PROBE: ${{ inputs.test_scope == 'r448_update_routes' || inputs.test_scope == 'r448_update_restart' }}
      R448_RESTART_PROBE: ${{ inputs.test_scope == 'r448_update_restart' }}
      R449_UI_ROUTE: ${{ inputs.test_scope == 'r449_ui_fluvi' && 'FLUVI_STREAM' || inputs.test_scope == 'r449_ui_wa' && 'WIDGETS_ANYWHERE' || '' }}
      R45_UI_ROUTE: ${{ startsWith(inputs.test_scope, 'r45_ui_fluvi_') && 'FLUVI_STREAM' || startsWith(inputs.test_scope, 'r45_ui_wa_') && 'WIDGETS_ANYWHERE' || '' }}
      R45_UI_ACTION: ${{ contains(inputs.test_scope, '_session_') && 'SESSION' || 'ONE_WAKE' }}
      R45_UI_SHAPE: ${{ endsWith(inputs.test_scope, '_circle') && 'CIRCLE' || 'ORB' }}
      R46_UI_ROUTE: ${{ (startsWith(inputs.test_scope, 'r46_ui_fluvi') || startsWith(inputs.test_scope, 'r47_ui_fluvi')) && 'FLUVI_STREAM' || (startsWith(inputs.test_scope, 'r46_ui_wa') || startsWith(inputs.test_scope, 'r47_ui_wa')) && 'WIDGETS_ANYWHERE' || '' }}
      R47_REQUIRE_ACTIVE_HEADER: ${{ startsWith(inputs.test_scope, 'r47_ui_') }}
      R46_LONG: ${{ endsWith(inputs.test_scope, '_long') }}
      R46_SINGLE: ${{ endsWith(inputs.test_scope, '_single') }}
      R46_MULTI_ONLY: ${{ endsWith(inputs.test_scope, '_multi') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
      - name: Ensure lossless patch tool is available
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - name: Prepare private signed update fixture
        if: ${{ inputs.test_scope == 'r44_update_private' || inputs.test_scope == 'r47_update_route' || startsWith(inputs.test_scope, 'r47_ui_') }}
        run: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r44-private-handshake.sh"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the signed R43 and update on API 37
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          # The real dashboard honors Android's reduced-motion setting. Keep
          # the device's default animation scale for the R47 motion trial.
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r44-update.sh" prepare
          script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r44-update.sh" run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r44-update-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r44-update/*.txt
            ${{ runner.temp }}/r44-update/*.xml
            ${{ runner.temp }}/r44-update/*.json
            ${{ runner.temp }}/r44-update/*.png
            ${{ runner.temp }}/r44-update/r449frames/*.png
            ${{ runner.temp }}/r44-update/r45frames/**/*.png
            ${{ runner.temp }}/r44-update/r46frames/**/*.png
          if-no-files-found: warn
          retention-days: 14

  r47-evidence-archive:
    if: ${{ inputs.test_scope == 'r47_evidence_archive' }}
    name: Preserve synthetic R47 trial ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: ['45948179372', '45949821696', '45951672202']
    steps:
      - name: Retrieve original trial evidence
        uses: actions/download-artifact@v4
        with:
          repository: elizerpist/exptv2
          run-id: ${{ matrix.run }}
          name: r40-service-${{ matrix.run }}
          path: ${{ runner.temp }}/r47-retained
          github-token: ${{ github.token }}
      - name: Verify evidence contains no APK and record file hashes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/r47-retained"
          if find "$root" -type f \( -iname '*.apk' -o -iname '*.aab' \) -print -quit | grep -q .; then
            echo 'APK in source evidence; refusing to archive' >&2
            exit 1
          fi
          while IFS= read -r -d '' tarfile; do
            if ! tar -tf "$tarfile" > "$RUNNER_TEMP/r47-tar-list.txt" 2>/dev/null; then
              echo 'Uninspectable archive; refusing to archive' >&2
              exit 1
            fi
            if grep -Ei '\.(apk|aab)$' "$RUNNER_TEMP/r47-tar-list.txt"; then
              echo 'APK nested in source evidence; refusing to archive' >&2
              exit 1
            fi
          done < <(find "$root" -type f -name '*.tar' -print0)
          (cd "$root" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/r47-retained-hashes.txt"
          cp "$RUNNER_TEMP/r47-retained-hashes.txt" "$root/retained-hashes.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: r47-synthetic-evidence-retained-${{ matrix.run }}
          path: ${{ runner.temp }}/r47-retained/**
          if-no-files-found: error
          retention-days: 90

  r47-paired-ci:
    if: ${{ inputs.test_scope == 'r47_paired_ci' }}
    name: R47 paired ${{ matrix.kind }} on one API35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        kind: [native, dashboard]
    env:
      PAIR_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
      - uses: actions/checkout@v5
        with:
          ref: fd74df6057793f6fdd12e0ccb61a20bdbfdd7f20
          path: baseline
      - uses: actions/checkout@v5
        with:
          ref: af20365a5ec96ff92b35321a03c0a2679ee7d2fd
          path: app
      - name: Free space on disposable runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Prefer Maven Central storage mirror
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/r47-mirror.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
                  gradlePluginPortal()
                  google()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { name = 'MavenCentralStorageMirror'; url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
              }
          }
          GRADLE
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Execute both exact sources on the same emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r47-paired-ci.sh" build-baseline || true
          script: bash "$GITHUB_WORKSPACE/orchestrator/.github/scripts/r47-paired-ci.sh" run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r47-paired-${{ matrix.kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r47-paired-${{ matrix.kind }}/**
          if-no-files-found: warn
          retention-days: 30

  r47-animated-flutter:
    if: ${{ inputs.test_scope == 'r47_animated_flutter' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: orchestrator
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.app_sha }}
          path: app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Diagnose the real animated header frame preparer
        shell: bash
        working-directory: app
        env:
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$RUNNER_TEMP/r47-animated"
          fixture="$GITHUB_WORKSPACE/orchestrator/.github/fixtures/r47_animated_frame_diagnostic_test.dart"
          sha256sum "$fixture" > "$RUNNER_TEMP/r47-animated/fixture.sha256"
          cp "$fixture" test/app/platform/r47_animated_frame_diagnostic_test.dart
          printf 'app=%s\nharness=%s\n' "$APP_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/r47-animated/source.txt"
          flutter pub get > "$RUNNER_TEMP/r47-animated/pub-get.log" 2>&1
          flutter test test/app/platform/r47_animated_frame_diagnostic_test.dart --reporter expanded 2>&1 | tee "$RUNNER_TEMP/r47-animated/test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r47-animated-flutter-${{ github.run_id }}
          path: ${{ runner.temp }}/r47-animated/**
          if-no-files-found: warn
          retention-days: 14

  r43-flutter:
    if: ${{ inputs.test_scope == 'r43_flutter' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_SHA: ${{ inputs.app_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Analyze and test the exact R43 console bridge
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get
          flutter analyze lib/core/debug/debug_console.dart lib/core/diagnostics/keyguard_timing_capture_bridge.dart test/core/debug/keyguard_timing_capture_console_test.dart test/core/diagnostics/keyguard_timing_capture_bridge_test.dart
          flutter test test/core/debug/keyguard_timing_capture_console_test.dart test/core/diagnostics/keyguard_timing_capture_bridge_test.dart --reporter expanded
