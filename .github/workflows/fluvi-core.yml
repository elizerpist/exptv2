name: R16 Exact-Source Code Graph (orchestration only)
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  r16-exact-source-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_SHA: 7c49a22386296ed0285552384c519da87d0bd468
      TOOLING_BASE: cb2793dd5718344e586a40d4a24e25955d4ec5a1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TOOLING_BASE }}
          path: tooling
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Generate exact-source Dart index
        shell: bash
        run: |
          set -euo pipefail
          cd app
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          dart pub global activate scip_dart 1.6.2
          dart pub global run scip_dart ./
          test -s index.scip
          sha256sum index.scip > "$RUNNER_TEMP/r16-index-sha256.txt"
      - name: Test and generate graph
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/app"
          tooling_dir="$GITHUB_WORKSPACE/tooling"
          test "$(git -C "$tooling_dir" rev-parse HEAD)" = "$TOOLING_BASE"
          cd "$tooling_dir/tools/codegraph"
          dart pub get
          dart analyze
          dart test
          dart run bin/fluvi_codegraph.dart generate --index "$source_dir/index.scip" --graph "$tooling_dir/docs/codegraph" --source-root "$source_dir" --source-head "$APP_SHA" --source-ref "$APP_SHA" | tee "$RUNNER_TEMP/r16-graph-generation.txt"
          dart run bin/fluvi_codegraph.dart query --graph "$tooling_dir/docs/codegraph" --symbol KeyguardTimingCaptureBridge > "$RUNNER_TEMP/r16-graph-query.txt"
          python3 - "$tooling_dir/docs/codegraph" "$APP_SHA" "$source_dir/index.scip" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);m=json.loads((root/'manifest.json').read_text())
          assert m['source_head']==m['source_ref']==sys.argv[2]
          assert m['scip_dart_version']=='1.6.2'
          assert m['index_sha256']==hashlib.sha256(pathlib.Path(sys.argv[3]).read_bytes()).hexdigest()
          count=0
          for name in ('symbols','refs','edges'):
              index=json.loads((root/(name+'.index.json')).read_text())
              assert sum(x['record_count'] for x in index['shards'])==index['record_count']
              for x in index['shards']:
                  data=(root/x['path']).read_bytes()
                  assert hashlib.sha256(data).hexdigest()==x['sha256']
                  assert data.count(b'\n')==x['record_count']
                  count+=1
          print('verified_shards=',count,'documents=',m['document_count'],'repo_symbols=',m['repository_defined_symbol_count'])
          PY
          report="$tooling_dir/docs/codegraph-r16-owned-layer-7c49a223.md"
          printf '# R16 owned-layer source graph and native inventory\n\nApplication source: `%s`\n\n' "$APP_SHA" > "$report"
          printf 'The Dart SCIP manifest is `docs/codegraph/manifest.json`; Kotlin has no SCIP coverage and the following is source navigation, not a generated call graph. The output/host lifecycle is Main-owned and visual presentation remains an independently measured outcome.\n\n' >> "$report"
          printf '```text\n' >> "$report"
          (cd "$source_dir" && grep -nE 'readSystemWindows\(|selectedRootOnly|revokeCurrent\(|surfaceChanged\(|surfaceDestroyed\(|surfaceRedrawNeededAsync\(|class KeyguardOrbOwnedOutput|fun (borrow|releaseBorrow|retire|disposeIfReady|clearHost|draw|surfaceReady|surfaceDestroyed)|R16_LAYER|r16PinLateOperation|PixelCopy.request' android/app/src/main/kotlin/com/fluvi/app/lockscreen/{FluviKeyguardCardService,KeyguardCardWindow,KeyguardCardSettings}.kt android/app/src/main/kotlin/com/fluvi/app/lockscreen/material/{KeyguardOrbOwnedOutput,KeyguardOrbSurfacePresenter,KeyguardOrbSurfaceWorker,KeyguardOrbSurfaceMetrics}.kt) >> "$report"
          printf '\n```\n' >> "$report"
          cp "$RUNNER_TEMP/r16-graph-query.txt" "$tooling_dir/docs/codegraph-r16-query-7c49a223.txt"
          sha256sum "$tooling_dir/docs/codegraph/manifest.json" > "$RUNNER_TEMP/r16-manifest-sha256.txt"
      - name: Publish graph to independent immutable tooling branch
        shell: bash
        run: |
          set -euo pipefail
          cd tooling
          git config user.name 'Fluvi Graph Bot'
          git config user.email 'fluvi-graph@users.noreply.github.com'
          git add docs/codegraph docs/codegraph-r16-owned-layer-7c49a223.md docs/codegraph-r16-query-7c49a223.txt
          git diff --cached --check
          git commit -m 'graph: index R16 owned-layer application source [skip ci]'
          git rev-parse HEAD | tee "$RUNNER_TEMP/r16-graph-commit.txt"
          test -z "$(git ls-remote origin refs/heads/tooling/r16-owned-layer-7c49a2238629)"
          git push origin HEAD:refs/heads/tooling/r16-owned-layer-7c49a2238629
      - name: Preserve graph and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-graph-7c49a2238629-run-${{ github.run_id }}
          path: |
            tooling/docs/codegraph/**
            tooling/docs/codegraph-r16-*.md
            tooling/docs/codegraph-r16-*.txt
            ${{ runner.temp }}/r16-*.txt
          if-no-files-found: warn
          retention-days: 30
