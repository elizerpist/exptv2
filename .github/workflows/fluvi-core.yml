name: R44 Android 17 exact-source code graph
on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Exact R44 application source SHA
        type: string
        required: true
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_SHA: ${{ inputs.app_sha }}
      TOOLING_BASE: b3847093bcc9a6aae80c329b8ad5f1844bab32c5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TOOLING_BASE }}
          path: tooling
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Generate and verify exact source graph
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r34-graph"; mkdir -p "$out"
          source_dir="$GITHUB_WORKSPACE/app"; tooling_dir="$GITHUB_WORKSPACE/tooling"
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$APP_SHA"
          test "$(git -C "$tooling_dir" rev-parse HEAD)" = "$TOOLING_BASE"
          (cd "$source_dir" && flutter pub get && test -z "$(git status --porcelain --untracked-files=no)" && dart pub global activate scip_dart 1.6.2 && dart pub global run scip_dart ./)
          sha256sum "$source_dir/index.scip" > "$out/index-sha256.txt"
          cd "$tooling_dir/tools/codegraph"
          dart pub get
          dart analyze > "$out/analyze.txt" 2>&1
          dart test > "$out/test.txt" 2>&1
          dart run bin/fluvi_codegraph.dart generate --index "$source_dir/index.scip" --graph "$tooling_dir/docs/codegraph" --source-root "$source_dir" --source-head "$APP_SHA" --source-ref "$APP_SHA" > "$out/generate.txt"
          for symbol in KeyguardTimingCaptureBridge KeyguardTimingCaptureSnapshot DebugConsoleDialog; do
            printf '\n## %s\n' "$symbol"
            dart run bin/fluvi_codegraph.dart query --graph "$tooling_dir/docs/codegraph" --symbol "$symbol"
          done > "$tooling_dir/docs/codegraph-r44-android17-query.txt"
          python3 - "$tooling_dir/docs/codegraph" "$APP_SHA" "$source_dir/index.scip" > "$out/verification.txt" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); m=json.loads((root/'manifest.json').read_text())
          assert m['source_head']==m['source_ref']==sys.argv[2]
          assert m['scip_dart_version']=='1.6.2'
          assert m['index_sha256']==hashlib.sha256(pathlib.Path(sys.argv[3]).read_bytes()).hexdigest()
          shards=0
          for name in ('symbols','refs','edges'):
              index=json.loads((root/(name+'.index.json')).read_text())
              assert sum(x['record_count'] for x in index['shards'])==index['record_count']
              for x in index['shards']:
                  data=(root/x['path']).read_bytes()
                  assert hashlib.sha256(data).hexdigest()==x['sha256']
                  assert data.count(b'\n')==x['record_count']
                  shards+=1
          print('source=',sys.argv[2],'shards=',shards,'documents=',m['document_count'],'repo_symbols=',m['repository_defined_symbol_count'])
          PY
          report="$tooling_dir/docs/codegraph-r44-android17-inventory.md"
          printf '# R44 exact-source authorization inventory\n\nApplication source: `%s`\n\n' "$APP_SHA" > "$report"
          printf 'The SCIP graph covers Dart only. Kotlin lines below are direct source navigation, not generated edges or proof of runtime behavior. Native submission and transaction receipts are not physical pixels.\n\n```text\n' >> "$report"
          (cd "$source_dir" && git grep -n -E 'KeyguardR44|r44[A-Z_]|r447|R44_|KeyguardFirstAuthorizedOrb|KeyguardInspectionFreshness|KeyguardWindowSnapshotReader|KeyguardSurfaceClassifier|inspectSurface|readSystemWindows|recordR44|KeyguardCardVisibilityPolicy|setR44SyntheticTrial|startCapture|freezeCapture|formatReport' -- android/app/src/main/kotlin/com/fluvi/app/lockscreen android/app/src/test/kotlin/com/fluvi/app/lockscreen android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen) >> "$report"
          printf '\n```\n' >> "$report"
          sha256sum "$tooling_dir/docs/codegraph/manifest.json" > "$out/manifest-sha256.txt"
          printf 'source_dir=%s\ntooling_dir=%s\n' "$source_dir" "$tooling_dir" > "$out/paths.txt"
      - name: Publish separate graph commit
        shell: bash
        run: |
          set -euo pipefail
          cd tooling
          git config user.name 'Fluvi Graph Bot'
          git config user.email 'fluvi-graph@users.noreply.github.com'
          git add docs/codegraph docs/codegraph-r44-android17-inventory.md docs/codegraph-r44-android17-query.txt
          git diff --cached --check
          git commit -m 'graph: index R44 Android 17 exact source [skip ci]'
          git rev-parse HEAD > "$RUNNER_TEMP/r34-graph/graph-commit.txt"
          graph_ref="tooling/r44-7-android17-${APP_SHA:0:12}"
          test -z "$(git ls-remote origin "refs/heads/$graph_ref")"
          git push origin "HEAD:refs/heads/$graph_ref"
      - name: Preserve graph receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r34-stock-graph-${{ github.run_id }}
          path: |
            tooling/docs/codegraph/**
            tooling/docs/codegraph-r44-android17-*
            ${{ runner.temp }}/r34-graph/**
          if-no-files-found: warn
          retention-days: 30
