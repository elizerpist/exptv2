name: R27 Exact-Source Code Graph (orchestration only)
on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Full immutable combined application SHA
        type: string
        required: true
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  r27-exact-source-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_SHA: ${{ inputs.app_sha }}
      TOOLING_BASE: f28fadc75e399868b8541a7d5617977b2a7de877
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TOOLING_BASE }}
          path: tooling
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Generate exact-source Dart index
        shell: bash
        run: |
          set -euo pipefail
          cd app
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          dart pub global activate scip_dart 1.6.2
          dart pub global run scip_dart ./
          test -s index.scip
          sha256sum index.scip > "$RUNNER_TEMP/r22-index-sha256.txt"
      - name: Test and generate graph
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/app"
          tooling_dir="$GITHUB_WORKSPACE/tooling"
          test "$(git -C "$tooling_dir" rev-parse HEAD)" = "$TOOLING_BASE"
          cd "$tooling_dir/tools/codegraph"
          dart pub get
          dart analyze
          dart test
          dart run bin/fluvi_codegraph.dart generate --index "$source_dir/index.scip" --graph "$tooling_dir/docs/codegraph" --source-root "$source_dir" --source-head "$APP_SHA" --source-ref "$APP_SHA" | tee "$RUNNER_TEMP/r22-graph-generation.txt"
          for symbol in KeyguardTimingCaptureBridge KeyguardTimingCaptureSnapshot DebugConsoleDialog; do
            printf '\n## %s\n' "$symbol"
            dart run bin/fluvi_codegraph.dart query --graph "$tooling_dir/docs/codegraph" --symbol "$symbol"
          done > "$RUNNER_TEMP/r22-graph-query.txt"
          printf 'source_dir=%s\ntooling_dir=%s\n' "$source_dir" "$tooling_dir" > "$RUNNER_TEMP/r22-worktrees.txt"
          python3 - "$tooling_dir/docs/codegraph" "$APP_SHA" "$source_dir/index.scip" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);m=json.loads((root/'manifest.json').read_text())
          assert m['source_head']==m['source_ref']==sys.argv[2]
          assert m['scip_dart_version']=='1.6.2'
          assert m['index_sha256']==hashlib.sha256(pathlib.Path(sys.argv[3]).read_bytes()).hexdigest()
          count=0
          for name in ('symbols','refs','edges'):
              index=json.loads((root/(name+'.index.json')).read_text())
              assert sum(x['record_count'] for x in index['shards'])==index['record_count']
              for x in index['shards']:
                  data=(root/x['path']).read_bytes()
                  assert hashlib.sha256(data).hexdigest()==x['sha256']
                  assert data.count(b'\n')==x['record_count']
                  count+=1
          print('verified_shards=',count,'documents=',m['document_count'],'repo_symbols=',m['repository_defined_symbol_count'])
          PY
          report="$tooling_dir/docs/codegraph-r27-orb-inventory.md"
          printf '# R27 opening and ORB source graph and native inventory\n\nApplication source: `%s`\n\n' "$APP_SHA" > "$report"
          printf 'The Dart SCIP manifest is `docs/codegraph/manifest.json`; Kotlin has no SCIP coverage and the following is source navigation, not a generated call graph. The output/host lifecycle is Main-owned and visual presentation remains an independently measured outcome.\n\n' >> "$report"
          printf 'R27 source navigation covers ordered DIRECT admission and terminal withdrawal, the one-reader null-child handoff, owner-scoped public-program warmup and bounded R22/R26/R27 export. STOCK remains separately governed by its existing publication policy. The line inventory is source navigation, not runtime or physical-pixel proof.\n\n' >> "$report"
          printf '```text\n' >> "$report"
          if command -v rg >/dev/null 2>&1; then search=(rg -n); else search=(grep -nE); fi
          (cd "$source_dir" && "${search[@]}" 'KeyguardOpeningInspectionHandoff|PostClaimSnapshot|observePostClaimOffer|recordR22PostClaim|flushR22PostClaim|cutR22DiagnosticCapture|openingHandoff|claimOpeningYield|openingYieldHint|handoffOpening|abandonOpeningTransferIfActive|abandonSessionIfActive|R22_ACQUISITION|R22_CORE|recordOpeningAcquisition|offerRejection|processInspectionQueue|inspectSurface|visibleIds|markNativeApplyReturned|arbitrateIngress|revealSubmitted|recordR21|r21CoreRecord|R21_|nativeApplied|reserveBeforeMain|startR18|applyInspection|readSystemWindows|R18_PIPELINE|R19_|R20_|firstPhysical|allocatedAt|r20AllocatedAt|reservedReq|firstAuthorizedOrb|advanceR20First|invalidateR20Scene|requireRead|sceneSerial|FirstPaintTicket|authorizeDirectFirst|prepareHiddenDirect|beginDirectPresentation|queueReveal|crossSubmitBoundary|sealR18|class KeyguardFirstAuthorizedOrb|class KeyguardOrbPresentationCoordinator|class KeyguardOrbInertHost|class KeyguardOrbDirectOutput|class KeyguardOrbR18Presenter|fun (stage|reveal|retire|seal|dispose|borrow|releaseBorrow)|addTransactionCompletedListener|presentFence|draw|surfaceReady' android/app/src/main/kotlin/com/fluvi/app/lockscreen/{FluviKeyguardCardService,KeyguardCardWindow,KeyguardCardSettings,KeyguardSystemState,KeyguardWindowSnapshotReader,KeyguardCardInspectionQueue,KeyguardOpeningInspectionHandoff,KeyguardInspectionFreshness,KeyguardFirstAuthorizedOrb,KeyguardOrbInertHost,KeyguardOrbPresentationCoordinator}.kt android/app/src/main/kotlin/com/fluvi/app/lockscreen/material/{KeyguardOrbDirectOutput,KeyguardOrbR18Presenter,KeyguardOrbSurfacePresenter,KeyguardOrbSurfaceWorker,KeyguardOrbSurfaceMaterial,KeyguardOrbSurfaceMetrics}.kt) >> "$report"
          (cd "$source_dir" && "${search[@]}" 'r22SupersededOpening|r22YieldedWalk|r22StableOpening|r22UnstagedOpening|r22PostClaimQueueEvidence|stalePressureCannotRestoreFullContentAfterPrivacyAndSizeChanges|independentOpeningScene|independentShadeWindow|postClaimObserved|awaitServiceMatch|verifyExclusionPixels|returnedMainIsConsumedBeforeYield|pendingAfterClaimIsReported|r21SubmittedPanel|r21PanelCancels|r21PanelRetires|r21PhoneShape|r21SubmittedDirect|r21Exclusion|r20AuthorizedFullFirstMiss|r20ExactAuthorizedPosterHit|r20FailedFirstLock|r20HeldFirstWrite|r20FirstFrameBreakdown|r12PreparedPictureMatchesCanonical' android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardOrbPresentationPipelineInstrumentationTest.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardFirstAuthorizedOrbInstrumentationTest.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardCardDiagnosticsInstrumentationTest.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardR22FirstInspectionFixture.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardR22VisualCalibration.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardR22RecoveryInstrumentationTest.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/material/KeyguardHeaderMaterialViewInstrumentationTest.kt android/app/src/test/kotlin/com/fluvi/app/lockscreen/KeyguardR22PostClaimEvidenceTest.kt android/app/src/test/kotlin/com/fluvi/app/lockscreen/KeyguardR22ReaderHandoffTest.kt) >> "$report"
          printf '\n# R22.4 source-derived ownership and framework callbacks\n' >> "$report"
          (cd "$source_dir" && "${search[@]}" 'OpeningEvidence|openingEligibleCheckpoint|captureOriginalOpeningEvidence|r22AFirstRoot|r22AFirstChild|r22AInvalid|r22ACheckpoint|pressureProgress|noteAcceptedReleaseProgress|translucentSteadySkipped|onReleaseBoundary|replayEarlyRelease|publishSteady|consumeRelease|awaitFence|finishFence|evaluatePressure|PassiveStandby|passiveStandby|passiveBacking|passiveClear|gatePassiveReplacement|dispatchDraw|configurePassive|clearPassive|confirmPassive|onIsolatedOrbFirstCommitted|reconcileIsolatedOrbTarget|onIsolatedOrbFailure|onDetached|dispose|retire\(|hideLayer|release|fence' android/app/src/main/kotlin/com/fluvi/app/lockscreen/{KeyguardCardInteractionLayout,KeyguardCardWindow,FluviKeyguardCardService,KeyguardCardSettings}.kt android/app/src/main/kotlin/com/fluvi/app/lockscreen/material/{KeyguardCardMaterialController,KeyguardOrbBufferRenderer}.kt) >> "$report"
          (cd "$source_dir" && "${search[@]}" 'independentlyWalkActiveTree|isolatedNeutralRecoveryAtCommittedResizedBounds|isolatedStandbyBlackReturnAndHide|getUiAutomation|FLAG_DONT_SUPPRESS|KeyguardR22VisualCalibration|takeScreenshot|r22CalibrationPreserves|isolatedOpaqueOrbHasNeutralParentAtRetire|isolatedStandbyPreservesAuthorizedComposition|stalePressureCannotRestore|passiveStandbyExport|r22PassiveStandby' android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/{KeyguardR22FirstInspectionFixture,KeyguardR22VisualCalibration,KeyguardFirstAuthorizedOrbInstrumentationTest,KeyguardCardDiagnosticsInstrumentationTest}.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/material/KeyguardHeaderMaterialViewInstrumentationTest.kt) >> "$report"
          (cd "$source_dir" && "${search[@]}" 'synchronousSteadyReceipt|earlyValidFence|wrongLeaseSlotOrUse|firstDirectPath|priorAcceptedUse|failureBeforeApply|throwingObserver|actualWorkerMixedSize|translucentSteadyLeaves|twoSlotLimit|cleanOriginalOffersAtPostMarker|incompleteOriginalChildCannot' android/app/src/test/kotlin/com/fluvi/app/lockscreen/material/{KeyguardOrbSteadyCapacityTest,KeyguardOrbPressurePolicyTest}.kt android/app/src/test/kotlin/com/fluvi/app/lockscreen/KeyguardR22ReaderHandoffTest.kt) >> "$report"
          printf '\n# R22.4 source-derived restriction, evidence and safety controls\n' >> "$report"
          (cd "$source_dir" && "${search[@]}" 'WindowRestriction|TransitionTrace|newTransitionTrace|reportTransitionTrace|showOrUpdate|failRestrictedUpdate|secureRebindRequired|updateLayoutSettings|enterRestrictiveTransition|finishRestrictiveTransition|restrictiveHideFailed|restrictionEvidence|onIsolatedOrbFirstCommitted|onIsolatedOrbPressure|onDetached|onLayerHideSubmitted|hideLayer|worker.retire|R22_4_TRANSITION|r224Transitions' android/app/src/main/kotlin/com/fluvi/app/lockscreen/{KeyguardCardWindow,KeyguardCardSettings,FluviKeyguardCardService}.kt android/app/src/main/kotlin/com/fluvi/app/lockscreen/material/{KeyguardCardMaterialController,KeyguardOrbBufferRenderer}.kt) >> "$report"
          (cd "$source_dir" && "${search[@]}" 'attachedOrbRestrictionPrecedesFailedLayout|r22_4RepeatedRestrictionAndFreshFullKeepSameRoot|r22_4FailedNeutralBindCannotReviveHiddenRoot|r22_4DetachedDuringFailedLayoutAllowsCleanNextAttach|r22_4BoundedResizedPrivacyStrip|r22_4NeutralMotionUsesIndependentPhaseReferences|r224RestrictionEvidence|isolatedNeutralRecoveryAtCommittedResizedBounds' android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/material/KeyguardHeaderMaterialViewInstrumentationTest.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardCardDiagnosticsInstrumentationTest.kt) >> "$report"
          printf '\n# R25 exact-source ownership, tests and bounded export\n' >> "$report"
          (cd "$source_dir" && "${search[@]}" 'KeyguardOpeningPublication|handoffCompleted|canPublishCompleted|r25BuildSnapshotLocked|r25CompleteLocked|r25PromoteWaitingLocked|r25PostDrain|r25DrainOnMain|r25FallbackDrain|r25RequestExclusionCheck|recordR25|R25_OPENING|R25_CORE|reduceR25|isUnclaimedReadCurrent|processInspectionQueue|scheduleEvaluationCommon|reserveR18WakeBeforeMain|applyCompletedInspection|applyInspection|hideImmediately|inspectionFreshness|firstAuthorizedOrb' android/app/src/main/kotlin/com/fluvi/app/lockscreen/{FluviKeyguardCardService,KeyguardCardInspectionQueue,KeyguardOpeningPublication,KeyguardFirstAuthorizedOrb,KeyguardCardSettings}.kt) >> "$report"
          (cd "$source_dir" && "${search[@]}" 'class KeyguardOpeningPublicationTest|successorStartsWhileFirstMainNoticeIsHeld|pendingBeforeCompletion|mainClaimMakesLaterOffer|oldWakeNotice|failedPost|class KeyguardR25ServiceInstrumentationTest|heldCompletePositive|heldPositiveCannot|r25OpeningSummary' android/app/src/test/kotlin/com/fluvi/app/lockscreen/KeyguardOpeningPublicationTest.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/{KeyguardR25ServiceInstrumentationTest,KeyguardCardDiagnosticsInstrumentationTest}.kt) >> "$report"
          printf '\n# R27 direct ordering, incomplete transfer, shader warmup and diagnostics\n' >> "$report"
          (cd "$source_dir" && "${search[@]}" 'KeyguardR27VirginDirectPolicy|DIRECT_ORDERED|r25CompleteLocked|r25CompatibleLocked|processInspectionQueue|applyCompletedInspection|scheduleR19Join|sealR18|hideImmediately|recordOpeningAcquisition|r27|firstAuthorizedOrb|INCOMPLETE_NULL_CHILD|firstIncompleteReason|claimOpeningYield|handoffOpening|requireRead|readFinished' android/app/src/main/kotlin/com/fluvi/app/lockscreen/{FluviKeyguardCardService,KeyguardWindowSnapshotReader,KeyguardOpeningInspectionHandoff,KeyguardCardInspectionQueue,KeyguardFirstAuthorizedOrb,KeyguardCardSettings}.kt) >> "$report"
          (cd "$source_dir" && "${search[@]}" 'KeyguardOrbProgramSelector|KeyguardOrbDirectProgramWarmup|retireWhenSettled|prepareHiddenDirect|authorizeDirectFirst|prewarmDirect|prepareAuthorized|WarmProgram|warmProgram|r27Warm|KeyguardHeaderShader|KeyguardOrbSurfacePainter|blankBindPending|dispose|revoke' android/app/src/main/kotlin/com/fluvi/app/lockscreen/material/{KeyguardOrbDirectProgramWarmup,KeyguardShaderArtifactStore,KeyguardOrbR18Presenter,KeyguardOrbSurfacePresenter,KeyguardOrbSurfaceWorker,KeyguardOrbSurfaceMaterial,KeyguardHeaderMaterialView}.kt) >> "$report"
          (cd "$source_dir" && "${search[@]}" 'KeyguardR27VirginDirectPolicyTest|reservedBeforeMainAdoptionRetainsExactVirginTarget|adoptedBeforeOwnerPublicationUsesOnlyExactRetainedRoute|incompleteOriginal|incompleteWithout|incompleteWrong|incompleteException|decisiveMarkerBefore|r27Warm|r27NoReady|r26Visible|r26ExactDirect|pendingDirectWaits|stableDirectUses|replacedAToBToA|retirementCloses' android/app/src/test/kotlin/com/fluvi/app/lockscreen/{KeyguardR22ReaderHandoffTest,KeyguardOpeningInspectionHandoffTest,KeyguardR27VirginDirectPolicyTest}.kt android/app/src/test/kotlin/com/fluvi/app/lockscreen/material/{KeyguardOrbWarmupOwnershipTest,KeyguardOrbProgramSelectorTest}.kt android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/{KeyguardR26DirectOrderingInstrumentationTest,KeyguardFirstAuthorizedOrbInstrumentationTest,KeyguardOrbPresentationPipelineInstrumentationTest,KeyguardCardDiagnosticsInstrumentationTest}.kt) >> "$report"
          printf '\n```\n' >> "$report"
          cp "$RUNNER_TEMP/r22-graph-query.txt" "$tooling_dir/docs/codegraph-r27-orb-query.txt"
          sha256sum "$tooling_dir/docs/codegraph/manifest.json" > "$RUNNER_TEMP/r22-manifest-sha256.txt"
      - name: Publish graph to independent immutable tooling branch
        shell: bash
        run: |
          set -euo pipefail
          cd tooling
          git config user.name 'Fluvi Graph Bot'
          git config user.email 'fluvi-graph@users.noreply.github.com'
          git add docs/codegraph docs/codegraph-r27-orb-inventory.md docs/codegraph-r27-orb-query.txt
          git diff --cached --check
          git commit -m 'graph: index R27 combined exact-source ORB application [skip ci]'
          git rev-parse HEAD | tee "$RUNNER_TEMP/r22-graph-commit.txt"
          graph_ref="tooling/r27-orb-${APP_SHA:0:12}"
          test -z "$(git ls-remote origin "refs/heads/$graph_ref")"
          git push origin "HEAD:refs/heads/$graph_ref"
      - name: Preserve graph and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r27-graph-${{ inputs.app_sha }}-run-${{ github.run_id }}
          path: |
            tooling/docs/codegraph/**
            tooling/docs/codegraph-r27-*.md
            tooling/docs/codegraph-r27-*.txt
            ${{ runner.temp }}/r22-*.txt
          if-no-files-found: warn
          retention-days: 30
