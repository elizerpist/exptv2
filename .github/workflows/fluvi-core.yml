name: R49 signed update control
on:
  workflow_dispatch:
    inputs:
      app_sha:
        required: true
        type: string
      nonce:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
jobs:
  signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      APP_SHA: ${{ inputs.app_sha }}
      R44_STAGE_NONCE: ${{ inputs.nonce }}
      CANDIDATE_SHA256: ${{ inputs.sha256 }}
      CANDIDATE_SIZE: ${{ inputs.size }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - name: Receive the exact signed APK privately
        run: bash .github/scripts/r49-private-handshake.sh
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Update genuine signed R48 in the stock disposable profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash .github/scripts/r49-verify-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r49-signed-upgrade-${{ github.run_id }}
          path: r49-upgrade-evidence/
