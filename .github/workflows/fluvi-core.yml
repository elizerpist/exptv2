name: R49 stock fixture retry
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  test-wa-host:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: '37.0'
            host: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-35
      - uses: actions/download-artifact@v4
        with:
          name: r49-human-builder-a614bf74f7a0b17d3ebc822daf167fba331ee6af
          run-id: 46015919896
          github-token: ${{ github.token }}
      - name: Prepare a disposable install of the same compiled product
        run: |
          mkdir -p r49-device-evidence
          keytool -genkeypair -keystore "$RUNNER_TEMP/r49-test.jks" -storepass android -keypass android \
            -alias fixture -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=R49 Disposable Test'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/r49-test.jks" \
            --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/r49-fixture.apk" \
            build/app/outputs/flutter-apk/app-profile.apk
          sha256sum build/app/outputs/flutter-apk/app-profile.apk "$RUNNER_TEMP/r49-fixture.apk" \
            | tee r49-device-evidence/apks.sha256
          echo "FLUVI_R49_FIXTURE_APK=$RUNNER_TEMP/r49-fixture.apk" >> "$GITHUB_ENV"
      - name: Build the fixture-only hierarchy observer and match fixture signatures
        run: |
          bash scripts/r49-fixture/build-observer.sh "$RUNNER_TEMP/observer"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/r49-test.jks" \
            --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/r49-observer.apk" \
            "$RUNNER_TEMP/observer/observer-unsigned.apk"
          sha256sum "$RUNNER_TEMP/r49-observer.apk" build/app/outputs/flutter-apk/r49-control{,-test}.apk \
            >> r49-device-evidence/apks.sha256
      - name: Verify the unmodified WA release for the independent control
        if: matrix.host == 'release'
        run: |
          curl --disable --fail --silent --show-error --location --retry 2 \
            https://github.com/zacharee/LockscreenWidgets/releases/download/4.7.5/WidgetsAnywhere_4.7.5-release.apk \
            --output "$RUNNER_TEMP/wa-release.apk"
          printf '%s  %s\n' 7cccb3e34a2b80107c8c41cbe76548023a821580456f442674b68d1281df4429 \
            "$RUNNER_TEMP/wa-release.apk" | sha256sum --check
          echo "FLUVI_R49_EXTERNAL_WA=$RUNNER_TEMP/wa-release.apk" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the screenshot sampler
        run: python -m pip install Pillow==11.3.0
      - name: Exercise the installed single-APK host
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.system == '37.0' && 36 || 35 }}
          system-image-api-level: ${{ matrix.system }}
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: >-
            test -s "$FLUVI_R49_FIXTURE_APK" && test -s build/app/outputs/flutter-apk/r49-control.apk
          script: >-
            python3 scripts/test-r49-host-device.py "$FLUVI_R49_FIXTURE_APK" "${{ matrix.system }}" r49-device-evidence
            --control-apk build/app/outputs/flutter-apk/r49-control.apk
            --control-test build/app/outputs/flutter-apk/r49-control-test.apk
            --observer "$RUNNER_TEMP/r49-observer.apk"
            ${FLUVI_R49_EXTERNAL_WA:+--external-wa "$FLUVI_R49_EXTERNAL_WA"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r49-host-${{ matrix.host }}-${{ matrix.system }}-a614bf74f7a0
          path: r49-device-evidence/
          if-no-files-found: warn
