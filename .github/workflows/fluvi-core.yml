name: R55 signed upgrade and matched masked stock unlock
on:
  workflow_dispatch:
    inputs:
      app_sha:
        required: true
        type: string
      apk:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
permissions:
  contents: read
jobs:
  stock:
    strategy:
      fail-fast: false
      matrix:
        lane: [upgrade, masked]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .github/r55:.github/r52-stock:.github/r53-unlock:.github/r54-unlock
      APP_SHA: ${{ inputs.app_sha }}
      APP_BYTES: ${{ inputs.size }}
      APP_HASH: ${{ inputs.sha256 }}
      APP_URL: ${{ inputs.apk }}
      LANE: ${{ matrix.lane }}
      REFERENCE_SHA: b3c6fe33267fa19e4853fe03b551ef27fec7dbd6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independently downloaded products and prepare the existing observer
        run: |
          mkdir -p evidence
          bash .github/r52-stock/verify-apk.sh "$APP_URL" "$APP_HASH" "$APP_BYTES" "$APP_SHA" "$RUNNER_TEMP/fluvi.apk"
          bash .github/r53-unlock/reference/verify.sh \
            https://media.githubusercontent.com/media/elizerpist/exptv2/ac3c7adeb9d90e69b01ed670e5c06d6911367cd2/Fluvi_R53_Reference_b3c6fe33267f.apk \
            3bbeda3c9555a56c3bf194c00844164f0bcf93c24e11099fec7f7e7da6dacb54 16811 "$REFERENCE_SHA" \
            9260dbbf7fcbe03f1f0bf4218a3c3ddc892dba1ae86f50b88434719f7daf6d54 "$RUNNER_TEMP/reference.apk"
          if [[ "$LANE" == upgrade ]]; then
            bash .github/r52-stock/verify-apk.sh \
              https://media.githubusercontent.com/media/elizerpist/exptv2/f09afc9ba70b8d9e9d9bc3e5c6d200ddc05d2eca/Fluvi_R54_HUMAN_41add67b7f4d.apk \
              bbc23b647e65bfda9fe29d16bac3b5c98a7f6ae111755d9a4c9337d7c7903c80 \
              114043547 41add67b7f4d4ecdf7a0a48abff64ca85364ac9e "$RUNNER_TEMP/r54.apk"
          fi
          bash .github/r52-stock/prepare-runner.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: |
            if [[ "$LANE" == upgrade ]]; then
              python3 .github/r55/upgrade_ambient.py --sha "$APP_SHA" --baseline "$RUNNER_TEMP/r54.apk" --apk "$RUNNER_TEMP/fluvi.apk" --observer "$RUNNER_TEMP/observer.apk" --output evidence/upgrade
            else
              python3 .github/r53-unlock/run_unlock.py --app-sha "$APP_SHA" --apk "$RUNNER_TEMP/fluvi.apk" --observer "$RUNNER_TEMP/observer.apk" --reference "$RUNNER_TEMP/reference.apk" --reference-sha "$REFERENCE_SHA" --output evidence/unlock
            fi
      - if: always()
        run: bash .github/r53-unlock/export_trace.sh evidence/unlock
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r55-${{ matrix.lane }}-${{ inputs.app_sha }}
          path: evidence/
          if-no-files-found: error
