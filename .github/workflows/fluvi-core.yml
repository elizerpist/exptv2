name: R51 exact signed stock transitions
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Signed stock baseline or candidate.
        required: true
        type: choice
        options: [baseline, candidate]
      app_sha:
        required: true
        type: string
      apk:
        description: Immutable anonymous APK URL.
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
permissions:
  contents: read
jobs:
  transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        system: ['37.0', '35']
    env:
      APP_SHA: ${{ inputs.app_sha }}
      APK_URL: ${{ inputs.apk }}
      APK_HASH: ${{ inputs.sha256 }}
      APK_SIZE: ${{ inputs.size }}
      MODE: ${{ inputs.mode }}
      STOCK_API: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the full anonymous owner binary
        shell: bash
        run: |
          mkdir -p evidence
          [[ "$APK_URL" =~ ^https://media\.githubusercontent\.com/media/elizerpist/exptv2/[0-9a-f]{40}/[A-Za-z0-9_]+\.apk$ ]]
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ && "$APK_HASH" =~ ^[0-9a-f]{64}$ && "$APK_SIZE" =~ ^[0-9]+$ ]]
          curl --disable --silent --show-error --fail --location --proto '=https' \
            "$APK_URL" -o "$RUNNER_TEMP/human.apk"
          test "$(wc -c < "$RUNNER_TEMP/human.apk")" = "$APK_SIZE"
          printf '%s  %s\n' "$APK_HASH" "$RUNNER_TEMP/human.apk" | sha256sum -c | tee evidence/apks.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs --verbose "$RUNNER_TEMP/human.apk" \
            | tee evidence/signer.txt | grep 'Signer #1 certificate SHA-256 digest: faedbe8483532ebb1412bf4d8387c36ff6bbcd4b1da560ba0eabbaea9bad49fb'
          python - "$RUNNER_TEMP/human.apk" "$APP_SHA" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert apk.testzip() is None
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                  lib = apk.read(f'lib/{abi}/libapp.so')
                  assert sys.argv[2].encode() in lib and b'HUMAN_DIAGNOSTIC' in lib
          PY
          printf '%s\n' "$APP_SHA" > evidence/source.txt
      - name: Build independent UI and paste witness
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0
          bash scripts/r49-fixture/build-observer.sh "$RUNNER_TEMP/observer"
          keytool -genkeypair -keystore "$RUNNER_TEMP/observer.jks" -alias fixture -storepass android \
            -keypass android -dname 'CN=Fluvi disposable observer' -keyalg RSA -validity 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/observer.jks" \
            --ks-pass pass:android --out "$RUNNER_TEMP/observer.apk" "$RUNNER_TEMP/observer/observer-unsigned.apk"
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Separate visible-start unlock, sleep and clipboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.system == '37.0' && 36 || 35 }}
          system-image-api-level: ${{ matrix.system }}
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash .github/r51-stock/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r51-${{ inputs.mode }}-${{ matrix.system }}-${{ inputs.app_sha }}
          path: evidence/
          if-no-files-found: warn
