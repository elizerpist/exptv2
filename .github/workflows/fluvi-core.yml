name: R18 exact-source stock-candidate service comparison (orchestration only)
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  r18-stock-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_SHA: 8a7186a4144822a25970079f3a2a374bddcfc737
      BASE_SHA: 7c49a22386296ed0285552384c519da87d0bd468
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: stock
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Verify clean source and apply test-only fixture overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r18-ab"
          for checkout in candidate stock; do
            if [ "$checkout" = candidate ]; then expected="$APP_SHA"; else expected="$BASE_SHA"; fi
            test "$(git -C "$checkout" rev-parse HEAD)" = "$expected"
            test -z "$(git -C "$checkout" status --porcelain --untracked-files=no)"
            (cd "$checkout" && flutter pub get)
            python3 harness/scripts/r18-ab-patch-fixture.py "$checkout"
            git -C "$checkout" diff --name-only > "$RUNNER_TEMP/r18-ab/$checkout-modified-files.txt"
            test "$(cat "$RUNNER_TEMP/r18-ab/$checkout-modified-files.txt")" = android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardR12ServiceTimingInstrumentationTest.kt
            git -C "$checkout" diff > "$RUNNER_TEMP/r18-ab/$checkout-fixture.patch"
          done
          printf 'candidate=%s\nstock=%s\nharness=%s\n' "$APP_SHA" "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/r18-ab/identity.txt"
      - name: Build stock and candidate debug test pairs
        shell: bash
        run: |
          set -euo pipefail
          for checkout in stock candidate; do
            (cd "$checkout/android" && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain) 2>&1 | tee "$RUNNER_TEMP/r18-ab/$checkout-build.log"
          done
      - name: Install independent video decoding dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -c 'import PIL' || python3 -m pip install --user 'Pillow==11.3.0'
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 0666 /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Collect counterbalanced stock and candidate real-service cycles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: cd "$GITHUB_WORKSPACE/candidate" && bash "$GITHUB_WORKSPACE/harness/scripts/r18-ab-collect.sh"
      - name: Preserve all source, device and raw comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-stock-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r18-ab/**
            candidate/android/keyguard-r15-comparison/**
          if-no-files-found: warn
          retention-days: 30
