name: R16 Flutter Tests with Original Candidate Workflow
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  r16-flutter-with-real-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify application source and restore the actual candidate workflow for source-boundary tests
        run: |
          set -euo pipefail
          app=7c49a22386296ed0285552384c519da87d0bd468
          git diff --quiet "$app" HEAD -- android/app/src/main android/app/src/debug android/app/src/profile android/app/src/release android/app/build.gradle.kts lib shaders pubspec.yaml pubspec.lock
          git show "$app:.github/workflows/fluvi-core.yml" > .github/workflows/fluvi-core.yml
          git diff --exit-code "$app" -- .github/workflows/fluvi-core.yml
          printf 'app_source=%s\nharness_source=%s\n' "$app" "$GITHUB_SHA"
          sha256sum .github/workflows/fluvi-core.yml
      - uses: ./.github/actions/setup-fluvi-flutter
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos
      - name: Targeted diagnostics and architecture tests
        if: always()
        run: flutter test test/core/diagnostics/keyguard_timing_capture_bridge_test.dart test/core/debug/keyguard_timing_capture_console_test.dart test/boundary/keyguard_first_render_architecture_boundary_test.dart --reporter expanded
      - name: Fast Flutter suite
        if: always()
        run: bash scripts/test-fluvi-fast.sh --reporter expanded
