name: Fluvi Verification

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_nightly:
        description: Run the exhaustive nightly lane.
        required: false
        default: false
        type: boolean
      run_baseline_profile:
        description: Run the fixed historical baseline comparison.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  dashboard-paths:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.changes.outputs.profile || steps.non_pr.outputs.profile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            profile:
              - 'lib/features/dashboard/**'
              - 'android/**'
              - 'integration_test/dashboard_interaction_profile_test.dart'
              - 'integration_test/support/**'
              - 'test_driver/dashboard_profile_driver.dart'
              - 'scripts/run-dashboard-profile.sh'
              - 'scripts/build-human-diagnostic-apk.sh'
              - '.github/workflows/fluvi-core.yml'

      - id: non_pr
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        shell: bash
        run: echo 'profile=true' >> "$GITHUB_OUTPUT"

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Verify Flutter/core boundary
        run: ./scripts/verify-fluvi-boundaries.sh

      - name: Run clean Room core tests
        working-directory: android
        run: ./gradlew :fluvi-core:testDebugUnitTest --no-daemon

      - name: Run native dashboard bridge tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload native SQL and stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-native-test-results-${{ github.sha }}
          path: |
            build/fluvi-core/test-results/testDebugUnitTest
            build/fluvi-core/reports/tests/testDebugUnitTest
            build/app/test-results/testDebugUnitTest
            build/app/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  test-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos

      - name: Run curated Flutter correctness suite
        run: ./scripts/test-fluvi-fast.sh

  test-flutter-nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)
    needs: test-flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Run full non-golden Flutter suite
        run: |
          find test -type f -name '*_test.dart' \
            ! -name '*_golden_test.dart' -print0 \
            | xargs -0 flutter test

  test-native-nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)
    needs: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Run exhaustive native unit suite
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

  build-human-diagnostic-apk:
    needs: [test-core, test-flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Build human physical-device diagnostic APK
        env:
          FLUVI_BUILD_COMMIT: ${{ github.sha }}
        run: ./scripts/build-human-diagnostic-apk.sh

      - name: Name human diagnostic APK
        id: apk_name
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk_name="fluvi_HUMAN_DIAGNOSTIC_${short_sha}.apk"
          mv build/app/outputs/flutter-apk/app-profile.apk \
            "build/app/outputs/flutter-apk/${apk_name}"
          printf 'apk_name=%s\nrelease_tag=fluvi-human-diagnostic-%s\n' \
            "$apk_name" "$short_sha" >> "$GITHUB_OUTPUT"

      - name: Publish direct APK download
        id: publish_apk
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk_name.outputs.apk_name }}
          RELEASE_TAG: ${{ steps.apk_name.outputs.release_tag }}
        shell: bash
        run: |
          apk_path="build/app/outputs/flutter-apk/${APK_NAME}"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Fluvi human diagnostic profile ${GITHUB_SHA::7}" \
              --notes "Human-operated physical diagnostic profile APK for ${GITHUB_SHA}" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" --clobber

          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          printf 'download_url=%s\n' "$download_url" >> "$GITHUB_OUTPUT"

          {
            echo "### Fluvi human physical-device diagnostic profile APK"
            echo
            echo "[Download ${APK_NAME}](${download_url})"
          } >> "$GITHUB_STEP_SUMMARY"

  run-dashboard-profile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.dashboard-paths.outputs.profile == 'true'
    needs: [test-core, test-flutter, dashboard-paths]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          lscpu
          profile_curl_home="$RUNNER_TEMP/fluvi-profile-curl"
          mkdir -p "$profile_curl_home"
          printf '%s\n' \
            'retry = 5' \
            'retry-all-errors' \
            'retry-delay = 2' \
            'continue-at = -' \
            > "$profile_curl_home/.curlrc"
          printf 'CURL_HOME=%s\n' "$profile_curl_home" >> "$GITHUB_ENV"

      - name: Run A-J dashboard profile gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -accel on
            -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          pre-emulator-launch-script: >-
            flutter build apk --profile
            --target=integration_test/dashboard_interaction_profile_test.dart
            --dart-define=FLUVI_VERBOSE_FLOW=false
            --dart-define=FLUVI_RAIL_FLIGHT_RECORDER=true
            --dart-define=FLUVI_PHYSICAL_RAIL_DIAGNOSTICS=true
            --dart-define=FLUVI_ONSCREEN_DIAGNOSTICS=true
            --dart-define=FLUVI_BUILD_PURPOSE=automated_profile_test
            --dart-define=FLUVI_AUTOMATED_SCENARIO_RUNNER_PRESENT=true
            --dart-define=FLUVI_AUTOMATED_INPUT_DRIVER_ACTIVE=true
            --dart-define=FLUVI_BUILD_COMMIT=${{ github.sha }}
            && (cd android && ./gradlew --stop)
          script: >-
            ./scripts/run-dashboard-profile.sh
            --use-application-binary=build/app/outputs/flutter-apk/app-profile.apk

      - name: Name automated profile test harness
        if: always()
        shell: bash
        run: |
          harness_path="build/app/outputs/flutter-apk/app-profile.apk"
          if [[ -f "$harness_path" ]]; then
            mv "$harness_path" \
              "build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_${GITHUB_SHA::7}.apk"
          fi

      - name: Upload automated profile test harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluvi_AUTOMATED_TEST_HARNESS_${{ github.sha }}
          path: build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_${{ github.sha }}.apk
          if-no-files-found: warn

      - name: Upload dashboard profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-profile-results-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_${{ github.sha }}.apk
            build/dashboard_profile_*.json
            build/dashboard-profile-diagnostics
            scripts/run-dashboard-profile.sh
            test_driver/dashboard_profile_driver.dart
          if-no-files-found: warn

  run-dashboard-profile-baseline:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_baseline_profile)
    needs: [test-core, test-flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fb6aaec4573fd8728bfc5e1f14ca062ec74fd0fe
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          lscpu
          profile_curl_home="$RUNNER_TEMP/fluvi-profile-curl"
          mkdir -p "$profile_curl_home"
          printf '%s\n' \
            'retry = 5' \
            'retry-all-errors' \
            'retry-delay = 2' \
            'continue-at = -' \
            > "$profile_curl_home/.curlrc"
          printf 'CURL_HOME=%s\n' "$profile_curl_home" >> "$GITHUB_ENV"

      - name: Run milestone baseline profile
        id: baseline-profile
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -accel on
            -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          pre-emulator-launch-script: >-
            flutter build apk --profile
            --target=integration_test/dashboard_interaction_profile_test.dart
            --dart-define=FLUVI_VERBOSE_FLOW=false
            --dart-define=FLUVI_RAIL_FLIGHT_RECORDER=true
            --dart-define=FLUVI_PHYSICAL_RAIL_DIAGNOSTICS=true
            --dart-define=FLUVI_ONSCREEN_DIAGNOSTICS=true
            --dart-define=FLUVI_BUILD_PURPOSE=automated_profile_test
            --dart-define=FLUVI_AUTOMATED_SCENARIO_RUNNER_PRESENT=true
            --dart-define=FLUVI_AUTOMATED_INPUT_DRIVER_ACTIVE=true
            --dart-define=FLUVI_BUILD_COMMIT=${{ github.sha }}
            && (cd android && ./gradlew --stop)
          script: >-
            ./scripts/run-dashboard-profile.sh
            --use-application-binary=build/app/outputs/flutter-apk/app-profile.apk

      - name: Verify milestone baseline evidence
        if: always()
        shell: bash
        run: |
          evidence_file="$(find build -maxdepth 2 -type f -name 'dashboard_profile_*.json' -print -quit)"
          if [[ -z "$evidence_file" ]]; then
            echo "Milestone baseline produced no profile evidence." >&2
            exit 1
          fi
          printf 'baseline_profile_step_outcome=%s\n' '${{ steps.baseline-profile.outcome }}' \
            > build/dashboard_profile_baseline_step_outcome.txt

      - name: Name milestone automated profile test harness
        if: always()
        shell: bash
        run: |
          harness_path="build/app/outputs/flutter-apk/app-profile.apk"
          if [[ -f "$harness_path" ]]; then
            mv "$harness_path" \
              "build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_fb6aaec.apk"
          fi

      - name: Upload milestone automated profile test harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluvi_AUTOMATED_TEST_HARNESS_fb6aaec
          path: build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_fb6aaec.apk
          if-no-files-found: warn

      - name: Upload milestone baseline profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-profile-baseline-fb6aaec
          path: |
            build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_fb6aaec.apk
            build/dashboard_profile_*.json
            build/dashboard-profile-diagnostics
            build/dashboard_profile_baseline_step_outcome.txt
          if-no-files-found: warn
