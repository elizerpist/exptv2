name: R20 independent Maven availability probe
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  repository-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the three previously rate-limited immutable POM URLs
        shell: bash
        run: |
          set -euo pipefail
          for module in kotlin-stdlib kotlin-gradle-plugins-bom kotlin-gradle-plugin-api; do
            url="https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/$module/2.0.21/$module-2.0.21.pom"
            status=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            printf '%s %s\n' "$module" "$status"
            test "$status" = 200
          done
