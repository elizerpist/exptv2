name: Fluvi Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Verify Flutter/core boundary
        run: ./scripts/verify-fluvi-boundaries.sh

      - name: Run clean Room core tests
        working-directory: android
        run: ./gradlew :fluvi-core:testDebugUnitTest --no-daemon

      - name: Run native dashboard bridge tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload native SQL and stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-native-test-results-${{ github.sha }}
          path: |
            build/fluvi-core/test-results/testDebugUnitTest
            build/fluvi-core/reports/tests/testDebugUnitTest
            build/app/test-results/testDebugUnitTest
            build/app/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  test-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos

      - name: Test Flutter app
        run: |
          find test -type f -name '*_test.dart' \
            ! -name '*_golden_test.dart' -print0 \
            | xargs -0 flutter test

  build-diagnostic-apk:
    needs: [test-core, test-flutter, run-dashboard-profile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Build physical-device diagnostic APK
        run: >-
          flutter build apk --profile
          --dart-define=FLUVI_SEED_DEMO=true
          --dart-define=FLUVI_PHYSICAL_RAIL_DIAGNOSTICS=true
          --dart-define=FLUVI_VERBOSE_FLOW=false

      - name: Name diagnostic APK
        id: apk_name
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk_name="fluvi_${short_sha}.apk"
          mv build/app/outputs/flutter-apk/app-profile.apk \
            "build/app/outputs/flutter-apk/${apk_name}"
          printf 'apk_name=%s\nrelease_tag=fluvi-diagnostic-%s\n' \
            "$apk_name" "$short_sha" >> "$GITHUB_OUTPUT"

      - name: Publish direct APK download
        id: publish_apk
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk_name.outputs.apk_name }}
          RELEASE_TAG: ${{ steps.apk_name.outputs.release_tag }}
        shell: bash
        run: |
          apk_path="build/app/outputs/flutter-apk/${APK_NAME}"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Fluvi diagnostic profile ${GITHUB_SHA::7}" \
              --notes "Physical-device rail diagnostic profile APK for ${GITHUB_SHA}" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" --clobber

          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          printf 'download_url=%s\n' "$download_url" >> "$GITHUB_OUTPUT"

          {
            echo "### Fluvi physical-device diagnostic profile APK"
            echo
            echo "[Download ${APK_NAME}](${download_url})"
          } >> "$GITHUB_STEP_SUMMARY"

  run-dashboard-profile:
    needs: [test-core, test-flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          lscpu
          profile_curl_home="$RUNNER_TEMP/fluvi-profile-curl"
          mkdir -p "$profile_curl_home"
          printf '%s\n' \
            'retry = 5' \
            'retry-all-errors' \
            'retry-delay = 2' \
            'continue-at = -' \
            > "$profile_curl_home/.curlrc"
          printf 'CURL_HOME=%s\n' "$profile_curl_home" >> "$GITHUB_ENV"

      - name: Run A-J dashboard profile gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -accel on
            -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          pre-emulator-launch-script: >-
            flutter build apk --profile
            --target=integration_test/dashboard_interaction_profile_test.dart
            --dart-define=FLUVI_VERBOSE_FLOW=false
            --dart-define=FLUVI_RAIL_FLIGHT_RECORDER=true
            --dart-define=FLUVI_PHYSICAL_RAIL_DIAGNOSTICS=true
            && (cd android && ./gradlew --stop)
          script: >-
            ./scripts/run-dashboard-profile.sh
            --use-application-binary=build/app/outputs/flutter-apk/app-profile.apk

      - name: Upload dashboard profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-profile-results-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-profile.apk
            build/dashboard_profile_*.json
            build/dashboard-profile-diagnostics
            scripts/run-dashboard-profile.sh
            test_driver/dashboard_profile_driver.dart
          if-no-files-found: warn

  run-dashboard-profile-baseline:
    needs: [test-core, test-flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          ref: f33152b1657d0916eef68c6ffb7ca89697320a51
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          lscpu
          profile_curl_home="$RUNNER_TEMP/fluvi-profile-curl"
          mkdir -p "$profile_curl_home"
          printf '%s\n' \
            'retry = 5' \
            'retry-all-errors' \
            'retry-delay = 2' \
            'continue-at = -' \
            > "$profile_curl_home/.curlrc"
          printf 'CURL_HOME=%s\n' "$profile_curl_home" >> "$GITHUB_ENV"

      - name: Run milestone baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -accel on
            -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          pre-emulator-launch-script: >-
            flutter build apk --profile
            --target=integration_test/dashboard_interaction_profile_test.dart
            --dart-define=FLUVI_VERBOSE_FLOW=false
            --dart-define=FLUVI_RAIL_FLIGHT_RECORDER=true
            --dart-define=FLUVI_PHYSICAL_RAIL_DIAGNOSTICS=true
            && (cd android && ./gradlew --stop)
          script: >-
            ./scripts/run-dashboard-profile.sh
            --use-application-binary=build/app/outputs/flutter-apk/app-profile.apk

      - name: Upload milestone baseline profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-profile-baseline-f33152b
          path: |
            build/app/outputs/flutter-apk/app-profile.apk
            build/dashboard_profile_*.json
            build/dashboard-profile-diagnostics
          if-no-files-found: warn
