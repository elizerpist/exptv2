name: R40 profile APK update over installed R39
on:
  workflow_dispatch:
    inputs:
      apk_url:
        type: string
        required: true
      apk_sha:
        type: string
        required: true
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  update:
    env:
      APK_URL: ${{ inputs.apk_url }}
      APK_SHA: ${{ inputs.apk_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download and verify the exact signed public APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r36-update"
          cd "$RUNNER_TEMP/r36-update"
          curl --fail --location --silent --show-error 'https://media.githubusercontent.com/media/elizerpist/exptv2/0f6426f6a31c819d1e199564603b88b53d55927b/fluvi_R39_HUMAN_fd7112e4e529.apk' -o old.apk
          curl --fail --location --silent --show-error "$APK_URL" -o new.apk
          printf '%s  %s\n' 67dad10fc014970e2b10e812eab42a8b75ac88ba8b3875f6c41c08d288da9481 old.apk "$APK_SHA" new.apk | sha256sum -c | tee hashes.txt
          signer=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs old.apk > old-signer.txt
          "$signer" verify --print-certs new.apk > new-signer.txt
          for file in old-signer.txt new-signer.txt; do grep -F 'faedbe8483532ebb1412bf4d8387c36ff6bbcd4b1da560ba0eabbaea9bad49fb' "$file"; done
      - name: Prepare single-shell update control
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/r36-update/control.sh" <<'CONTROL'
          set -euo pipefail
          out="$RUNNER_TEMP/r36-update"
          for ((bootwait=0; bootwait<45; bootwait++)); do
            [[ "$(adb shell getprop init.svc.bootanim | tr -d '\r')" = stopped ]] && break
            sleep 1
          done
          sleep 15
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          adb install -r "$out/old.apk" > "$out/old-install.txt" 2>&1
          trap 'adb logcat -d -v threadtime > "$out/logcat.txt" 2>&1 || true; adb shell dumpsys activity activities > "$out/last-activities.txt" 2>&1 || true' EXIT
          wait_for_app() {
            label="$1"
            launches=0
            : > "$out/${label}-launch.txt"
            for ((attempt=0; attempt<90; attempt++)); do
              if (( launches < 3 )) && { (( attempt == 0 )) || { (( attempt % 10 == 0 )) && ! adb shell pidof com.fluvi.app >/dev/null 2>&1; }; }; then
                launches=$((launches+1))
                printf 'LAUNCH_ATTEMPT=%s\n' "$launches" >> "$out/${label}-launch.txt"
                adb shell am start -W -n com.fluvi.app/.MainActivity >> "$out/${label}-launch.txt" 2>&1 || true
              fi
              adb shell dumpsys activity activities > "$out/${label}-activities.txt" 2>&1 || true
              if grep -Ei '(mResumedActivity|topResumedActivity).*com\.fluvi\.app/\.MainActivity' "$out/${label}-activities.txt" >/dev/null && adb shell pidof com.fluvi.app >/dev/null 2>&1; then
                printf '%s\n' "${label}_RESUMED" >> "$out/${label}-launch.txt"
                return 0
              fi
              sleep 1
            done
            return 1
          }
          wait_for_app old
          adb shell run-as com.fluvi.app mkdir -p files
          printf '%s' R39_TO_R40_UPDATE_SENTINEL | adb shell run-as com.fluvi.app tee files/r40_update_sentinel >/dev/null
          adb shell am force-stop com.fluvi.app
          # Configure the existing normal entry using synthetic demo settings in
          # this disposable emulator; the update below must preserve them.
          adb shell run-as com.fluvi.app mkdir -p shared_prefs
          printf '%s' '<?xml version="1.0" encoding="utf-8" standalone="yes"?><map><boolean name="requested" value="true"/><boolean name="details" value="true"/><string name="presentationMode">orb</string><string name="animationMode">orbOnly</string><long name="generation" value="1"/></map>' | adb shell run-as com.fluvi.app tee shared_prefs/fluvi_native_keyguard_card.xml >/dev/null
          adb install -r "$out/new.apk" > "$out/new-install.txt" 2>&1
          actual=$(adb shell run-as com.fluvi.app cat files/r40_update_sentinel | tr -d '\r')
          test "$actual" = R39_TO_R40_UPDATE_SENTINEL
          adb shell am force-stop com.fluvi.app
          adb shell run-as com.fluvi.app cat shared_prefs/fluvi_native_keyguard_card.xml > "$out/preserved-orb-settings.txt"
          grep -q 'name="requested" value="true"' "$out/preserved-orb-settings.txt"
          grep -q '<string name="presentationMode">orb</string>' "$out/preserved-orb-settings.txt"
          wait_for_app new
          printf '%s\n' 'UPDATE_INSTALL_PASS sentinel=preserved orbSettings=preserved launch=ok API=35' > "$out/upgrade-result.txt"
          adb shell settings put secure enabled_accessibility_services com.fluvi.app/.lockscreen.FluviKeyguardCardService
          adb shell settings put secure accessibility_enabled 1
          adb shell input keyevent KEYCODE_HOME
          adb shell locksettings set-disabled false
          sleep 15
          adb shell input keyevent KEYCODE_SLEEP
          sleep 3
          adb shell input keyevent KEYCODE_WAKEUP
          sleep 5
          adb shell dumpsys accessibility > "$out/orb-accessibility.txt"
          for ((windowwait=0; windowwait<15; windowwait++)); do
            adb shell dumpsys window windows > "$out/orb-windows.txt"
            awk '/^  Window #[0-9]+ Window[{].*FluviKeyguardCard[}]/ { found=1 } found && /^  Window #[0-9]+/ && !/FluviKeyguardCard/ { exit } found { print }' "$out/orb-windows.txt" > "$out/orb-window-control.txt"
            if grep -q 'Surface: shown=true.*HAS_DRAWN' "$out/orb-window-control.txt" && grep -q 'isVisible=true' "$out/orb-window-control.txt"; then break; fi
            sleep 1
          done
          adb shell dumpsys window policy > "$out/orb-policy.txt"
          adb shell screencap -p /sdcard/r38-orb.png
          adb pull /sdcard/r38-orb.png "$out/orb.png" >/dev/null
          grep -F 'com.fluvi.app/com.fluvi.app.lockscreen.FluviKeyguardCardService' "$out/orb-accessibility.txt" >/dev/null
          grep -q 'Surface: shown=true.*HAS_DRAWN' "$out/orb-window-control.txt"
          grep -q 'isVisible=true' "$out/orb-window-control.txt"
          printf '%s\n' 'UPDATE_INSTALL_PASS sentinel=preserved launch=ok accessibility=connected window=visible_drawn ORB_pixels=UNVERIFIED API=35' > "$out/result.txt"
          CONTROL
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install fd7112e4, preserve sentinel, update and launch R40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$RUNNER_TEMP/r36-update/control.sh"
      - name: Retain non-sensitive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r40-profile-update-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r36-update/*.txt
            ${{ runner.temp }}/r36-update/*.png
          if-no-files-found: warn
          retention-days: 14
