name: R52 withdrawal stock witness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - name: Prepare decoder and runner
        run: |
          command -v ffmpeg || { sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends ffmpeg; }
          python3 -m pip install --user --break-system-packages Pillow==11.3.0
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash .github/r52-stock/preflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52-stock-video-calibration
          path: evidence/
          if-no-files-found: warn
