name: Fluvi Verification

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_nightly:
        description: Run the exhaustive nightly lane.
        required: false
        default: false
        type: boolean
      run_baseline_profile:
        description: Run the fixed historical baseline comparison.
        required: false
        default: false
        type: boolean
      r49_build_only:
        description: Build the new Human APK while independent qualification is pending.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  dashboard-paths:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) }}
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.changes.outputs.profile || steps.non_pr.outputs.profile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            profile:
              - 'lib/features/dashboard/**'
              - 'android/**'
              - 'integration_test/dashboard_interaction_profile_test.dart'
              - 'integration_test/support/**'
              - 'test_driver/dashboard_profile_driver.dart'
              - 'scripts/run-dashboard-profile.sh'
              - 'scripts/build-human-diagnostic-apk.sh'
              - '.github/workflows/fluvi-core.yml'

      - id: non_pr
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        shell: bash
        run: echo 'profile=true' >> "$GITHUB_OUTPUT"

  test-core:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) }}
    runs-on: ubuntu-latest
    # A clean Android/Room build needs ~17 minutes on a cold GitHub runner
    # before Robolectric starts; 20 minutes cancelled healthy test execution
    # before it reached `testDebugUnitTest`.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The action's legacy default requests the removed SDK `tools` package.
      # `cmdline-tools` is already provided by the action; only platform-tools
      # is required by these jobs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Verify Flutter/core boundary
        run: ./scripts/verify-fluvi-boundaries.sh

      - name: Run clean Room core tests
        working-directory: android
        run: ./gradlew :fluvi-core:testDebugUnitTest --no-daemon

      - name: Run native dashboard bridge tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload native SQL and stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-native-test-results-${{ github.sha }}
          path: |
            build/fluvi-core/test-results/testDebugUnitTest
            build/fluvi-core/reports/tests/testDebugUnitTest
            build/app/test-results/testDebugUnitTest
            build/app/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  test-flutter:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos

      - name: Run curated Flutter correctness suite
        run: ./scripts/test-fluvi-fast.sh

      - name: Run the complete Flutter suite for R49
        run: flutter test --reporter expanded

      - name: Retain failed Flutter golden comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures-${{ github.sha }}
          path: test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 3

  test-flutter-nightly:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)) }}
    needs: test-flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Run full non-golden Flutter suite
        run: |
          find test -type f -name '*_test.dart' \
            ! -name '*_golden_test.dart' -print0 \
            | xargs -0 flutter test

  # RuntimeShader construction is a device/GPU API, not a JVM contract. This
  # deliberately compiles the generated production AGSL asset and mounts the
  # production retained View on an API-35 hardware Canvas before an APK is
  # handed to a physical-device tester.
  build-wa-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Pin Java 17 for Flutter and Fluvi native libraries
        run: echo "FLUVI_JDK17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-36 build-tools;36.0.0
      - uses: ./.github/actions/setup-fluvi-flutter
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare isolated WA SDK
        shell: bash
        run: |
          echo "FLUVI_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
          sdkmanager --install 'platforms;android-37.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          wa_sdk="$RUNNER_TEMP/fluvi-wa-sdk"
          mkdir -p "$wa_sdk/platforms"
          for entry in "$ANDROID_HOME"/*; do
            case "${entry##*/}" in platforms) continue ;; esac
            ln -s "$entry" "$wa_sdk/${entry##*/}"
          done
          cp -a "$ANDROID_HOME/platforms/android-37.0" "$wa_sdk/platforms/"
          sdk_jar="$wa_sdk/platforms/android-37.0/android.jar"
          curl --fail --silent --show-error --location --retry 2 \
            'https://raw.githubusercontent.com/Reginer/aosp-android-jar/262f6ae931160011572a5adfe4ec6302585e8f60/android-37/android-jdk21.jar' \
            --output "$sdk_jar"
          test "$(wc -c < "$sdk_jar")" -eq 57746914
          printf '%s  %s\n' 694b291a046b4ba1738e9df61577ec8cfddf250a7bbe9867a72ff19e161ea692 "$sdk_jar" | sha256sum --check
          echo "FLUVI_WA_ANDROID_SDK=$wa_sdk" >> "$GITHUB_ENV"
      - name: Build single-app WA Human profile
        env:
          FLUVI_BUILD_COMMIT: ${{ github.sha }}
          FLUVI_R49_INCLUDE_FIXTURE: "true"
        shell: bash
        run: |
          mkdir -p r49-build-evidence
          git rev-parse HEAD
          java -version
          flutter --version
          bash scripts/build-human-diagnostic-apk.sh 2>&1 | tee r49-build-evidence/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r49-human-builder-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-profile.apk
            build/app/outputs/flutter-apk/r49-control.apk
            build/app/outputs/flutter-apk/r49-control-test.apk
            build/wa-profile-*/host/app/build/outputs/logs/
            r49-build-evidence/
          if-no-files-found: warn

  test-wa-host:
    needs: build-wa-profile
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        system: ['37.0', '35']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          name: r49-human-builder-${{ github.sha }}
      - name: Prepare a disposable install of the same compiled product
        run: |
          mkdir -p r49-device-evidence
          keytool -genkeypair -keystore "$RUNNER_TEMP/r49-test.jks" -storepass android -keypass android \
            -alias fixture -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=R49 Disposable Test'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/r49-test.jks" \
            --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/r49-fixture.apk" \
            build/app/outputs/flutter-apk/app-profile.apk
          sha256sum build/app/outputs/flutter-apk/app-profile.apk "$RUNNER_TEMP/r49-fixture.apk" \
            | tee r49-device-evidence/apks.sha256
          echo "FLUVI_R49_FIXTURE_APK=$RUNNER_TEMP/r49-fixture.apk" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the screenshot sampler
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Exercise the installed single-APK host
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.system == '37.0' && 36 || 35 }}
          system-image-api-level: ${{ matrix.system }}
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: python3 scripts/test-r49-host-device.py "$FLUVI_R49_FIXTURE_APK" "${{ matrix.system }}" r49-device-evidence --control-apk build/app/outputs/flutter-apk/r49-control.apk --control-test build/app/outputs/flutter-apk/r49-control-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r49-host-${{ matrix.system }}-${{ github.sha }}
          path: r49-device-evidence/
          if-no-files-found: warn

  test-native-nightly:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)) }}
    needs: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Run exhaustive native unit suite
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

  build-human-diagnostic-apk:
    needs: [test-core, test-flutter, test-wa-host]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) && needs.test-core.result == 'success' && needs.test-flutter.result == 'success' && needs.test-wa-host.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record the reviewed artifact
        run: |
          echo "Qualified builder artifact r49-human-builder-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Delivery uses the established update signer and independent APK verification." >> "$GITHUB_STEP_SUMMARY"

  run-dashboard-profile:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.dashboard-paths.outputs.profile == 'true') }}
    needs: [test-core, test-flutter, dashboard-paths]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          lscpu
          profile_curl_home="$RUNNER_TEMP/fluvi-profile-curl"
          mkdir -p "$profile_curl_home"
          printf '%s\n' \
            'retry = 5' \
            'retry-all-errors' \
            'retry-delay = 2' \
            'continue-at = -' \
            > "$profile_curl_home/.curlrc"
          printf 'CURL_HOME=%s\n' "$profile_curl_home" >> "$GITHUB_ENV"

      - name: Run A-K dashboard profile gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -accel on
            -no-snapshot -noaudio
            -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: >-
            flutter build apk --profile
            --target=integration_test/dashboard_interaction_profile_test.dart
            --dart-define=FLUVI_VERBOSE_FLOW=false
            --dart-define=FLUVI_RAIL_FLIGHT_RECORDER=true
            --dart-define=FLUVI_PHYSICAL_RAIL_DIAGNOSTICS=true
            --dart-define=FLUVI_ONSCREEN_DIAGNOSTICS=true
            --dart-define=FLUVI_BUILD_PURPOSE=automated_profile_test
            --dart-define=FLUVI_AUTOMATED_SCENARIO_RUNNER_PRESENT=true
            --dart-define=FLUVI_AUTOMATED_INPUT_DRIVER_ACTIVE=true
            --dart-define=FLUVI_BUILD_COMMIT=${{ github.sha }}
            && (cd android && ./gradlew --stop)
          script: >-
            ./scripts/run-dashboard-profile.sh
            --use-application-binary=build/app/outputs/flutter-apk/app-profile.apk

      - name: Name automated profile test harness
        if: always()
        shell: bash
        run: |
          harness_path="build/app/outputs/flutter-apk/app-profile.apk"
          if [[ -f "$harness_path" ]]; then
            mv "$harness_path" \
              "build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_${GITHUB_SHA::7}.apk"
          fi

      - name: Upload automated profile test harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluvi_AUTOMATED_TEST_HARNESS_${{ github.sha }}
          path: build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_${{ github.sha }}.apk
          if-no-files-found: warn

      - name: Upload dashboard profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-profile-results-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_${{ github.sha }}.apk
            build/dashboard_profile_*.json
            build/dashboard-profile-diagnostics
            scripts/run-dashboard-profile.sh
            test_driver/dashboard_profile_driver.dart
          if-no-files-found: warn

  run-dashboard-profile-baseline:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.r49_build_only) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_baseline_profile)) }}
    needs: [test-core, test-flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fb6aaec4573fd8728bfc5e1f14ca062ec74fd0fe
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          lscpu
          profile_curl_home="$RUNNER_TEMP/fluvi-profile-curl"
          mkdir -p "$profile_curl_home"
          printf '%s\n' \
            'retry = 5' \
            'retry-all-errors' \
            'retry-delay = 2' \
            'continue-at = -' \
            > "$profile_curl_home/.curlrc"
          printf 'CURL_HOME=%s\n' "$profile_curl_home" >> "$GITHUB_ENV"

      - name: Run milestone baseline profile
        id: baseline-profile
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swangle -feature -Vulkan -accel on
            -no-snapshot -noaudio
            -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: >-
            flutter build apk --profile
            --target=integration_test/dashboard_interaction_profile_test.dart
            --dart-define=FLUVI_VERBOSE_FLOW=false
            --dart-define=FLUVI_RAIL_FLIGHT_RECORDER=true
            --dart-define=FLUVI_PHYSICAL_RAIL_DIAGNOSTICS=true
            --dart-define=FLUVI_ONSCREEN_DIAGNOSTICS=true
            --dart-define=FLUVI_BUILD_PURPOSE=automated_profile_test
            --dart-define=FLUVI_AUTOMATED_SCENARIO_RUNNER_PRESENT=true
            --dart-define=FLUVI_AUTOMATED_INPUT_DRIVER_ACTIVE=true
            --dart-define=FLUVI_BUILD_COMMIT=${{ github.sha }}
            && (cd android && ./gradlew --stop)
          script: >-
            ./scripts/run-dashboard-profile.sh
            --use-application-binary=build/app/outputs/flutter-apk/app-profile.apk

      - name: Verify milestone baseline evidence
        if: always()
        shell: bash
        run: |
          evidence_file="$(find build -maxdepth 2 -type f -name 'dashboard_profile_*.json' -print -quit)"
          if [[ -z "$evidence_file" ]]; then
            echo "Milestone baseline produced no profile evidence." >&2
            exit 1
          fi
          printf 'baseline_profile_step_outcome=%s\n' '${{ steps.baseline-profile.outcome }}' \
            > build/dashboard_profile_baseline_step_outcome.txt

      - name: Name milestone automated profile test harness
        if: always()
        shell: bash
        run: |
          harness_path="build/app/outputs/flutter-apk/app-profile.apk"
          if [[ -f "$harness_path" ]]; then
            mv "$harness_path" \
              "build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_fb6aaec.apk"
          fi

      - name: Upload milestone automated profile test harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluvi_AUTOMATED_TEST_HARNESS_fb6aaec
          path: build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_fb6aaec.apk
          if-no-files-found: warn

      - name: Upload milestone baseline profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-profile-baseline-fb6aaec
          path: |
            build/app/outputs/flutter-apk/fluvi_AUTOMATED_TEST_HARNESS_fb6aaec.apk
            build/dashboard_profile_*.json
            build/dashboard-profile-diagnostics
            build/dashboard_profile_baseline_step_outcome.txt
          if-no-files-found: warn
