name: R55 independently witnessed API 35 shade and PIN controls
on:
  workflow_dispatch:
    inputs:
      app_sha:
        required: true
        type: string
      apk:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
permissions:
  contents: read

jobs:
  stock:
    strategy:
      fail-fast: false
      matrix:
        case: [restricted]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_SHA: ${{ inputs.app_sha }}
      APK_URL: ${{ inputs.apk }}
      APK_HASH: ${{ inputs.sha256 }}
      APK_SIZE: ${{ inputs.size }}
      CASE: ${{ matrix.case }}
      R52_SHA: 7705f87c0c8f2bdf930a528b5bc6f87d276676a5
      REFERENCE_SHA: b3c6fe33267fa19e4853fe03b551ef27fec7dbd6
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .github/r52-stock:.github/r53-unlock:.github/r54-unlock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full products, reference and offline controls
        run: |
          mkdir -p evidence
          if [[ "$CASE" != optical-r52 ]]; then
            bash .github/r52-stock/verify-apk.sh "$APK_URL" "$APK_HASH" "$APK_SIZE" \
              "$APP_SHA" "$RUNNER_TEMP/r54.apk"
          fi
          if [[ "$CASE" == upgrade || "$CASE" == optical-r52 ]]; then
            bash .github/r52-stock/verify-apk.sh \
              https://media.githubusercontent.com/media/elizerpist/exptv2/8f7fc51e91d8ab2f65aae1565ed803e6fea9f3a1/Fluvi_R52_HUMAN_7705f87c0c8f.apk \
              4ca98594dc1e764b5ec1c9e2a93dd0dd212b7fcd7ca88f8e55db89d677ba9f7d \
              114027163 "$R52_SHA" "$RUNNER_TEMP/r52.apk"
          fi
          if [[ "$CASE" == optical-* ]]; then
            bash .github/r53-unlock/reference/verify.sh \
              https://media.githubusercontent.com/media/elizerpist/exptv2/ac3c7adeb9d90e69b01ed670e5c06d6911367cd2/Fluvi_R53_Reference_b3c6fe33267f.apk \
              3bbeda3c9555a56c3bf194c00844164f0bcf93c24e11099fec7f7e7da6dacb54 \
              16811 "$REFERENCE_SHA" 9260dbbf7fcbe03f1f0bf4218a3c3ddc892dba1ae86f50b88434719f7daf6d54 \
              "$RUNNER_TEMP/reference.apk" | tee evidence/reference-apk.txt
          fi
          bash .github/r52-stock/prepare-runner.sh
          python -m unittest discover -s .github/r53-unlock -v 2>&1 | tee evidence/offline-controls.txt
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          system-image-api-level: '35'
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash .github/r54-unlock/run.sh
      - if: always()
        run: bash .github/r53-unlock/export_trace.sh evidence/unlock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r54-${{ matrix.case }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
