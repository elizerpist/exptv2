name: Fluvi Verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Verify Flutter/core boundary
        run: ./scripts/verify-fluvi-boundaries.sh

      - name: Run clean Room core tests
        working-directory: android
        run: ./gradlew :fluvi-core:testDebugUnitTest --no-daemon

  test-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos

      - name: Test Flutter app
        run: |
          find test -type f -name '*_test.dart' \
            ! -name '*_golden_test.dart' -print0 \
            | xargs -0 flutter test

  build-debug-apk:
    needs: [test-core, test-flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: ./.github/actions/setup-fluvi-flutter

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Name debug APK
        id: apk_name
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk_name="fluvi_${short_sha}.apk"
          mv build/app/outputs/flutter-apk/app-debug.apk \
            "build/app/outputs/flutter-apk/${apk_name}"
          printf 'apk_name=%s\nartifact_name=fluvi_%s\n' "$apk_name" "$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_name.outputs.artifact_name }}
          path: build/app/outputs/flutter-apk/${{ steps.apk_name.outputs.apk_name }}
          if-no-files-found: error
