name: R16 Exact-Source Unit and Flutter Checks (orchestration only)
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 7c49a22386296ed0285552384c519da87d0bd468
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: ./.github/actions/setup-fluvi-flutter
      - name: Run exact-source Android and core JVM tests
        working-directory: android
        run: |
          test "$(git rev-parse HEAD)" = 7c49a22386296ed0285552384c519da87d0bd468
          ./gradlew :app:testDebugUnitTest :fluvi-core:testDebugUnitTest --no-daemon --max-workers=3 --console=plain
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-native-unit-7c49a2238629-${{ github.run_id }}
          path: |
            build/app/test-results/testDebugUnitTest/**
            build/fluvi-core/test-results/testDebugUnitTest/**
            build/app/reports/tests/testDebugUnitTest/**
            build/fluvi-core/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 30
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 7c49a22386296ed0285552384c519da87d0bd468
          fetch-depth: 0
      - uses: ./.github/actions/setup-fluvi-flutter
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos
      - name: Targeted diagnostics and architecture tests
        if: always()
        run: flutter test test/core/diagnostics/keyguard_timing_capture_bridge_test.dart test/core/debug/keyguard_timing_capture_console_test.dart test/boundary/keyguard_first_render_architecture_boundary_test.dart --reporter expanded
      - name: Fast Flutter suite
        if: always()
        run: bash scripts/test-fluvi-fast.sh --reporter expanded
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-flutter-checks-7c49a2238629-${{ github.run_id }}
          path: |
            test/**/failures/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 30
