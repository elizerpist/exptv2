name: R18 API35 panel and unit qualification (orchestration only)
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  r18-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_SHA: 8a7186a4144822a25970079f3a2a374bddcfc737
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Resolve Flutter packages in the application checkout
        run: flutter pub get
      - name: Verify source and run Gradle JVM suites
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/r18-api35"
          test "$(git rev-parse HEAD)" = "$APP_SHA" || exit 1
          test -z "$(git status --porcelain --untracked-files=no)" || exit 1
          printf 'application_sha=%s\nharness_sha=%s\n' "$APP_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/r18-api35/identity.txt"
          (cd android && ./gradlew :app:testDebugUnitTest :fluvi-core:testDebugUnitTest --no-daemon --max-workers=3 --console=plain) 2>&1 | tee "$RUNNER_TEMP/r18-api35/unit.log"
          printf '%s\n' "${PIPESTATUS[0]}" > "$RUNNER_TEMP/r18-api35/unit.exit"
      - name: Overlay only the calibrated panel test fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/scripts/r18-panel-patch-fixture.py"
          git diff --name-only > "$RUNNER_TEMP/r18-api35/fixture-modified-files.txt"
          test "$(cat "$RUNNER_TEMP/r18-api35/fixture-modified-files.txt")" = android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/KeyguardOrbPresentationPipelineInstrumentationTest.kt
          git diff > "$RUNNER_TEMP/r18-api35/fixture.patch"
      - name: Assemble exact debug and instrumentation pair
        run: cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 0666 /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Run R18 panel and diagnostic controls on API35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: cd "$GITHUB_WORKSPACE/app" && bash "$GITHUB_WORKSPACE/harness/scripts/r18-api35-panel-qualification.sh"
      - name: Fail job if any independent unit suite failed
        if: always()
        run: if test -s "$RUNNER_TEMP/r18-api35/unit.exit"; then test "$(cat "$RUNNER_TEMP/r18-api35/unit.exit")" = 0; else echo "Unit suite NOT RUN"; fi
      - name: Preserve raw evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-api35-panel-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r18-api35/**
            app/build/app/reports/tests/**
            app/build/fluvi-core/reports/tests/**
            app/build/app/test-results/**
            app/build/fluvi-core/test-results/**
          if-no-files-found: warn
          retention-days: 30
