name: R37 profile APK update install control
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: full
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download and verify the exact signed public APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r36-update"
          cd "$RUNNER_TEMP/r36-update"
          curl --fail --location --silent --show-error 'https://media.githubusercontent.com/media/elizerpist/exptv2/dbae068bc6e6a84bab08889669bf7c88a7137af5/fluvi_R36_HUMAN_a86046e2be25.apk' -o old.apk
          curl --fail --location --silent --show-error 'https://media.githubusercontent.com/media/elizerpist/exptv2/7dd853f734a0247da337b622f3cc7e3d7c22c255/fluvi_R37_HUMAN_d2b1890a8c89.apk' -o new.apk
          printf '%s  %s\n' e074ee0e9d950c4447e5255544eed3ad9e2e74b43e2e1a14e39affbe77408c9c old.apk 4c00c8156e4eed8dfe19d5e6bf3e9dda6845efdb18f8ee1c9f2674a38c600df5 new.apk | sha256sum -c | tee hashes.txt
          signer=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs old.apk > old-signer.txt
          "$signer" verify --print-certs new.apk > new-signer.txt
          for file in old-signer.txt new-signer.txt; do grep -F 'faedbe8483532ebb1412bf4d8387c36ff6bbcd4b1da560ba0eabbaea9bad49fb' "$file"; done
      - name: Prepare single-shell update control
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/r36-update/control.sh" <<'CONTROL'
          set -euo pipefail
          out="$RUNNER_TEMP/r36-update"
          for ((bootwait=0; bootwait<45; bootwait++)); do
            [[ "$(adb shell getprop init.svc.bootanim | tr -d '\r')" = stopped ]] && break
            sleep 1
          done
          sleep 15
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          adb install -r "$out/old.apk" > "$out/old-install.txt" 2>&1
          trap 'adb logcat -d -v threadtime > "$out/logcat.txt" 2>&1 || true; adb shell dumpsys activity activities > "$out/last-activities.txt" 2>&1 || true' EXIT
          wait_for_app() {
            label="$1"
            launches=0
            : > "$out/${label}-launch.txt"
            for ((attempt=0; attempt<90; attempt++)); do
              if (( launches < 3 )) && { (( attempt == 0 )) || { (( attempt % 10 == 0 )) && ! adb shell pidof com.fluvi.app >/dev/null 2>&1; }; }; then
                launches=$((launches+1))
                printf 'LAUNCH_ATTEMPT=%s\n' "$launches" >> "$out/${label}-launch.txt"
                adb shell am start -W -n com.fluvi.app/.MainActivity >> "$out/${label}-launch.txt" 2>&1 || true
              fi
              adb shell dumpsys activity activities > "$out/${label}-activities.txt" 2>&1 || true
              if grep -Ei '(mResumedActivity|topResumedActivity).*com\.fluvi\.app/\.MainActivity' "$out/${label}-activities.txt" >/dev/null && adb shell pidof com.fluvi.app >/dev/null 2>&1; then
                printf '%s\n' "${label}_RESUMED" >> "$out/${label}-launch.txt"
                return 0
              fi
              sleep 1
            done
            return 1
          }
          wait_for_app old
          adb shell run-as com.fluvi.app mkdir -p files
          printf '%s' R36_UPDATE_SENTINEL | adb shell run-as com.fluvi.app tee files/r36_update_sentinel >/dev/null
          adb install -r "$out/new.apk" > "$out/new-install.txt" 2>&1
          actual=$(adb shell run-as com.fluvi.app cat files/r36_update_sentinel | tr -d '\r')
          test "$actual" = R36_UPDATE_SENTINEL
          adb shell am force-stop com.fluvi.app
          wait_for_app new
          printf '%s\n' 'UPDATE_INSTALL_PASS sentinel=preserved launch=ok API=35' > "$out/result.txt"
          CONTROL
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install R36, preserve sentinel, update and launch R37
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$RUNNER_TEMP/r36-update/control.sh"
      - name: Retain non-sensitive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r37-profile-update-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r36-update/*.txt
          if-no-files-found: warn
          retention-days: 14
