name: R22.3 untreated R21 versus candidate ABBA acquisition
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  abba:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_SHA: ef310b490cf03713c0c97d3d4aab85e3b536e66d
      APP_SHA: b1eccd845546e5d65d9e69c9ba0a43775a2c216b
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Configure runner-only plugin repository fallback
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp "$GITHUB_WORKSPACE/harness/scripts/r22-3-plugin-repos.init.gradle" "$HOME/.gradle/init.d/fluvi-r22-3-repositories.gradle"
      - name: Build unchanged R21 app and instrumentation
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r22-3-abba/build-baseline"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain)
          sha256sum build/app/outputs/apk/debug/app-debug.apk build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/r22-3-abba/build-baseline/apks.txt"
      - name: Build unchanged candidate app and instrumentation
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r22-3-abba/build-candidate"
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain)
          sha256sum build/app/outputs/apk/debug/app-debug.apk build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/r22-3-abba/build-candidate/apks.txt"
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 0666 /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Run four untreated processes on the same API35 emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$GITHUB_WORKSPACE/harness/scripts/r22-3-unheld-abba.sh"
      - name: Preserve every planned slot and all raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22-3-unheld-abba-${{ github.run_id }}
          path: ${{ runner.temp }}/r22-3-abba/**
          if-no-files-found: warn
          retention-days: 30
