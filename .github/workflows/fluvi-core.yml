name: R50 exact signed host qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test-wa-host:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        system: ['37.0', '35']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-35
      - name: Verify the exact signed public Human APK
        run: |
          mkdir -p r50-device-evidence
          curl --disable --fail --silent --show-error --location --retry 2 \
            https://media.githubusercontent.com/media/elizerpist/exptv2/76f40ac6c73909632c723592932acec56ad310bb/Fluvi_R50_HUMAN_7f83664c1ad4.apk \
            -o "$RUNNER_TEMP/r50-human.apk"
          echo 'a3210d3ddd9c69098b2bd60258375a67ad770ef54ba2db1089fdef128c4ae2b0  '"$RUNNER_TEMP/r50-human.apk" | sha256sum -c - | tee r50-device-evidence/apks.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/r50-human.apk" |
            grep -F faedbe8483532ebb1412bf4d8387c36ff6bbcd4b1da560ba0eabbaea9bad49fb
          echo "FLUVI_R50_APK=$RUNNER_TEMP/r50-human.apk" >> "$GITHUB_ENV"
      - name: Build the non-suppressing observer for this disposable profile
        run: |
          bash scripts/r49-fixture/build-observer.sh "$RUNNER_TEMP/observer"
          keytool -genkeypair -keystore "$RUNNER_TEMP/r50-test.jks" -storepass android -keypass android \
            -alias fixture -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=R50 Disposable Test'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/r50-test.jks" \
            --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/r50-observer.apk" \
            "$RUNNER_TEMP/observer/observer-unsigned.apk"
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the screenshot sampler
        run: python -m pip install Pillow==11.3.0
      - name: Exercise the installed single-APK host
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.system == '37.0' && 36 || 35 }}
          system-image-api-level: ${{ matrix.system }}
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          pre-emulator-launch-script: >-
            test -s "$FLUVI_R50_APK"
          script: >-
            python3 scripts/test-r50-host-device.py "$FLUVI_R50_APK" "${{ matrix.system }}" r50-device-evidence
            --observer "$RUNNER_TEMP/r50-observer.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r50-host-signed-${{ matrix.system }}-${{ github.sha }}
          path: r50-device-evidence/
          if-no-files-found: warn
