name: R22.4 paired b1 policy counterfactual and translucent phases
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  paired-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: b1eccd845546e5d65d9e69c9ba0a43775a2c216b
      APP_SHA: b1eccd845546e5d65d9e69c9ba0a43775a2c216b
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Configure runner-only plugin repository fallback
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp "$GITHUB_WORKSPACE/harness/scripts/r22-3-plugin-repos.init.gradle" "$HOME/.gradle/init.d/fluvi-r22-3-repositories.gradle"
      - name: Build original b1 target and identical test observer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r22-3-cadence/baseline"
          cd baseline
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd android && ./gradlew :app:assembleDebug --no-daemon --max-workers=3 --console=plain)
          sha256sum build/app/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/r22-3-cadence/baseline/target-before.txt"
          git apply --unidiff-zero "$GITHUB_WORKSPACE/harness/scripts/r22-4-cadence-fixture.patch"
          python3 "$GITHUB_WORKSPACE/harness/scripts/r22-4-cadence-observer.py"
          git diff --name-only > "$RUNNER_TEMP/r22-3-cadence/baseline/changed-files.txt"
          test "$(cat "$RUNNER_TEMP/r22-3-cadence/baseline/changed-files.txt")" = 'android/app/src/androidTest/kotlin/com/fluvi/app/lockscreen/material/KeyguardHeaderMaterialViewInstrumentationTest.kt'
          git diff > "$RUNNER_TEMP/r22-3-cadence/baseline/test-only.patch"
          (cd android && ./gradlew :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain)
          sha256sum -c "$RUNNER_TEMP/r22-3-cadence/baseline/target-before.txt"
          sha256sum build/app/outputs/apk/debug/app-debug.apk build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/r22-3-cadence/baseline/apks.txt"
      - name: Build b1 diagnostic-only counterfactual and identical observer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r22-3-cadence/candidate"
          cd candidate
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 "$GITHUB_WORKSPACE/harness/scripts/r22-4-disable-optional-cap.py"
          test "$(git diff --name-only)" = 'android/app/src/main/kotlin/com/fluvi/app/lockscreen/material/KeyguardOrbBufferRenderer.kt'
          git diff > "$RUNNER_TEMP/r22-3-cadence/candidate/counterfactual.patch"
          printf 'DIAGNOSTIC_ONLY_NOT_FOR_DELIVERY\n' > "$RUNNER_TEMP/r22-3-cadence/candidate/purpose.txt"
          (cd android && ./gradlew :app:assembleDebug --no-daemon --max-workers=3 --console=plain)
          sha256sum build/app/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/r22-3-cadence/candidate/target-before.txt"
          git apply --unidiff-zero "$GITHUB_WORKSPACE/harness/scripts/r22-4-cadence-fixture.patch"
          python3 "$GITHUB_WORKSPACE/harness/scripts/r22-4-cadence-observer.py"
          git diff > "$RUNNER_TEMP/r22-3-cadence/candidate/all-changes.patch"
          (cd android && ./gradlew :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain)
          sha256sum -c "$RUNNER_TEMP/r22-3-cadence/candidate/target-before.txt"
          sha256sum build/app/outputs/apk/debug/app-debug.apk build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/r22-3-cadence/candidate/apks.txt"
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 0666 /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Measure both arms on one API35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$GITHUB_WORKSPACE/harness/scripts/r22-4-paired-cadence.sh"
      - name: Preserve both arms and every failed sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22-4-policy-counterfactual-${{ github.run_id }}
          path: ${{ runner.temp }}/r22-3-cadence/**
          if-no-files-found: warn
          retention-days: 30
