name: R16 Historical R14 Evidence Replay
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: false
      native_scope:
        type: string
        default: r14_recovery_candidate
      run_nightly:
        type: boolean
        default: false
      run_baseline_profile:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  r14-archived-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify current app runtime is unchanged in this tooling branch
        run: |
          git diff --quiet 7c49a22386296ed0285552384c519da87d0bd468 HEAD -- android/app/src/main android/app/src/debug android/app/src/profile android/app/src/release android/app/build.gradle.kts lib shaders pubspec.yaml pubspec.lock
          printf 'current_candidate=7c49a22386296ed0285552384c519da87d0bd468\nreplayed_old_application=536987c2345bf0c0cc2cb297b68c7227a0aed3c8\nharness=%s\n' "$GITHUB_SHA"
      - name: Replay the original specimens and adversarial controls
        run: python3 scripts/test-r16-r14-archive-replay.py
      - name: Preserve all replay evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r16-r14-old-source-replay-${{ github.sha }}-${{ github.run_id }}
          path: android/keyguard-r16-r14-replay/**
          if-no-files-found: warn
          retention-days: 30
