name: R22.3 corrected unchanged-parent visual fixtures
on:
  workflow_dispatch:
    inputs:
      native_diagnostic:
        type: boolean
        default: true
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  api35-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_SHA: fe8931a69c96e964f78561a3100e3d776dfe5dfc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.APP_SHA }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Build and identify unchanged target APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r22-3-parent"
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          flutter pub get
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd android && ./gradlew :app:assembleDebug --no-daemon --max-workers=3 --console=plain)
          sha256sum build/app/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/r22-3-parent/original-target-sha256.txt"
          printf 'application_sha=%s\nharness_sha=%s\n' "$APP_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/r22-3-parent/identity.txt"
      - name: Apply androidTest-only fixture and build test APK
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$GITHUB_WORKSPACE/harness/scripts/r22-3-parent-fixture.patch" > "$RUNNER_TEMP/r22-3-parent/fixture-patch-sha256.txt"
          git apply "$GITHUB_WORKSPACE/harness/scripts/r22-3-parent-fixture.patch"
          git diff --name-only > "$RUNNER_TEMP/r22-3-parent/changed-files.txt"
          test -s "$RUNNER_TEMP/r22-3-parent/changed-files.txt"
          if grep -v '^android/app/src/androidTest/' "$RUNNER_TEMP/r22-3-parent/changed-files.txt"; then exit 1; fi
          git diff > "$RUNNER_TEMP/r22-3-parent/actual-fixture.patch"
          (cd android && ./gradlew :app:assembleDebugAndroidTest --no-daemon --max-workers=3 --console=plain)
          sha256sum -c "$RUNNER_TEMP/r22-3-parent/original-target-sha256.txt"
          sha256sum build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/r22-3-parent/test-apk-sha256.txt"
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 0666 /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Run independent controls on API35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15081367
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: cd "$GITHUB_WORKSPACE/app" && bash "$GITHUB_WORKSPACE/harness/scripts/r22-3-parent-control.sh"
      - name: Preserve results on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22-3-parent-visual-corrected-${{ github.run_id }}
          path: ${{ runner.temp }}/r22-3-parent/**
          if-no-files-found: warn
          retention-days: 30
