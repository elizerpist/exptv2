name: R52 signed stock withdrawal
on:
  workflow_dispatch:
    inputs:
      app_sha:
        required: true
        type: string
      apk:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
permissions:
  contents: read
jobs:
  withdrawal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        system: ['37.0', '35']
    env:
      APP_SHA: ${{ inputs.app_sha }}
      APK_URL: ${{ inputs.apk }}
      APK_HASH: ${{ inputs.sha256 }}
      APK_SIZE: ${{ inputs.size }}
      STOCK_API: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact signed binary and calibrate the decoder
        run: |
          mkdir -p evidence
          bash .github/r52-stock/verify-apk.sh "$APK_URL" "$APK_HASH" "$APK_SIZE" "$APP_SHA" "$RUNNER_TEMP/human.apk"
          bash .github/r52-stock/prepare-runner.sh
          (cd .github/r52-stock && python -m unittest -v test_r52_oracle)
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.system == '37.0' && 36 || 35 }}
          system-image-api-level: ${{ matrix.system }}
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash .github/r52-stock/run-stock.sh
      - if: always()
        run: bash .github/r52-stock/analyze-traces.sh evidence/experiment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52-withdrawal-${{ matrix.system }}-${{ inputs.app_sha }}
          path: evidence/
          if-no-files-found: warn

  signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_SHA: ${{ inputs.app_sha }}
      APK_URL: ${{ inputs.apk }}
      APK_HASH: ${{ inputs.sha256 }}
      APK_SIZE: ${{ inputs.size }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify both releases and prepare independent paste witness
        run: |
          mkdir -p evidence
          bash .github/r52-stock/verify-apk.sh "$APK_URL" "$APK_HASH" "$APK_SIZE" "$APP_SHA" "$RUNNER_TEMP/human.apk"
          bash .github/r52-stock/verify-apk.sh \
            https://media.githubusercontent.com/media/elizerpist/exptv2/6962d94f0c78b14ded193c3543340507fc4c0006/Fluvi_R51_HUMAN_e7542639d22d.apk \
            5b2cb2acd1debeec113df939ce093479854a35f044a18f59c0985cf03a9e498e 113982051 \
            e7542639d22d78d10e7b123e836ee9bc9758c91a "$RUNNER_TEMP/r51.apk"
          bash .github/r52-stock/prepare-runner.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: >-
            python3 .github/r52-stock/signed_upgrade.py --baseline "$RUNNER_TEMP/r51.apk"
            --apk "$RUNNER_TEMP/human.apk" --observer "$RUNNER_TEMP/observer.apk" --output evidence/upgrade --sha "$APP_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52-signed-upgrade-${{ inputs.app_sha }}
          path: evidence/
          if-no-files-found: warn
