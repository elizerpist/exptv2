name: R40 three-way visible unlock and stale proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45460282386
          pattern: r38-unheld-pair-*
          path: ${{ runner.temp }}/pairs
      - name: Prepare same signed fixture pairs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r38-unlock"; mkdir -p "$out"
          keytool -genkeypair -keystore "$out/test.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Disposable R38 Test' -keyalg RSA -validity 7 >/dev/null 2>&1
          signer=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          for mode in r38 r39 r40; do
            pair="$RUNNER_TEMP/pairs/r38-unheld-pair-$mode"; mkdir -p "$out/$mode"
            cp "$pair/source.txt" "$out/$mode/source.txt"
            for apk in app test; do
              "$signer" sign --ks "$out/test.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$out/$mode/$apk.apk" "$pair/$apk.apk"
              "$signer" verify "$out/$mode/$apk.apk"
            done
            sha256sum "$out/$mode/"*.apk > "$out/$mode/pair.sha256"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare visible unlock and stale proof on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-animations: false
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swangle -feature -Vulkan -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 4096
          script: bash "$GITHUB_WORKSPACE/.github/scripts/r38-unlock.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r40-unlock-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r38-unlock/**/*.txt
            ${{ runner.temp }}/r38-unlock/**/*.png
            ${{ runner.temp }}/r38-unlock/**/*.tar
            ${{ runner.temp }}/r38-unlock/*.txt
          if-no-files-found: warn
          retention-days: 14
