name: fluvi
description: Fluvi personal finance dashboard.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  iconsax_plus: ^1.0.0
  vector_graphics: ^1.2.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  vector_graphics_compiler: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fluvi/actions/
    - assets/fluvi/brand/
    - assets/fluvi/budget/
    - assets/category_catalog/
    - assets/category_icons/
    - assets/logbox_category_icons/
